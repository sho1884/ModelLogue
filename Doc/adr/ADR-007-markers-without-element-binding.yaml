id: ADR-007
title: "マーカーはモデル要素に紐づけず、AIに解釈させる"
date: "2026-04-07"
status: accepted
superseded_by: null

participants:
  author: ""
  approver: ""
  last_updated: "2026-04-07"

context:
  problem: |
    レビューで「ここに注目」を示すマーカーを、特定のモデル要素
    （Idle状態、特定の遷移など）に厳密に紐づけるべきかが論点
    だった。以前の設計ではマーカーをクリック座標からモデル要素
    IDに紐づける案を試したが、人間は一発で正確にクリックできない
    ことが多く、厳密照合は失敗時のリカバリーが面倒という問題が
    あった。
  drivers:
    - "人間の自然なレビュー所作（「だいたいこのあたり」）"
    - "他のモデル図種への汎用性"
    - "実装のシンプルさ"
    - "AIの曖昧性処理能力"

decision:
  summary: "マーカーは特定のモデル要素IDに紐づけない。座標と色のみを持ち、AIがコンテキストからどの要素を指しているか解釈する。"
  detail: |
    マーカーは特定のモデル要素IDに紐づけないことにした。
    MarkerStoreはマーカーの座標と色だけを保持し、AIチャットの
    コンテキストとして「マーカー一覧」と「モデル要素の座標」の
    両方をAIに渡す。AIは必要に応じて「赤の楕円はIdle状態を
    指していますね」と解釈し、曖昧なら人間に質問する。

neglected:
  - option: "マーカーをクリック座標から最も近いモデル要素に厳密に紐づける"
    because: "人間は一発で正確にクリックできないことが多く、失敗時のリカバリーが煩雑"
  - option: "マーカーごとに『対象要素』ドロップダウンで明示選択させる"
    because: "レビュー中の操作が重くなり、『だいたいこのあたり』という自然な所作と合わない"

consequences:
  positive:
    - "人間の自然な「だいたいこのあたり」というレビュー所作と合致する"
    - "状態遷移図以外のモデル図（アクティビティ図、要求系統図等）でも同じ仕組みが使える"
    - "マーカー実装側の責任が減り、シンプルで堅牢になる"
    - "AIは元々曖昧性に強く、座標情報からの推論に向いている"
  negative:
    - "マーカーとモデル要素の対応が常に一意に決まるわけではない"
  risks:
    - "AIの解釈が的外れだった場合、ユーザーが意図した要素と違う要素について議論が進む可能性"

references:
  - "Doc/architecture.md §ADR-007"
  - "Doc/adr/ADR-006-native-svg-overlay-for-markers.yaml"
