id: ADR-008
title: "ModelLogueのスコープ境界——前後の業務ワークフローはn8n側に委ねる"
date: "2026-04-08"
status: accepted
superseded_by: null

participants:
  author: ""
  approver: ""
  last_updated: "2026-04-08"

context:
  problem: |
    モデルレビューは開発業務の中の一工程であり、前段（初版モデルの
    生成）と後段（合意形成・保留・仕様不備のフィードバック）を伴う。
    この前後の業務プロセスは現場ごとに異なる。ModelLogue本体が
    どこまでの範囲を担い、どこから先を外部（運用ワークフロー）に
    委ねるかが曖昧だと、要求が際限なく膨らんでスコープが破綻する。

    特に、ユーザー要求の段階では「初版を依頼する」「セッションを
    終了する」といったタスクが当然存在するが、これらをModelLogue
    本体の機能として実装するかどうかは別問題である。
  drivers:
    - "システム要求のスコープを有限に保ちたい"
    - "業務プロセスの現場差異に対応する柔軟性"
    - "n8nオーケストレーター方針（ADR-002）との整合"
    - "ユーザー要求は広く取り、システム要求で実装範囲を絞るという仕様駆動開発の流儀"

decision:
  summary: "ModelLogueの実装範囲はAntigravity図でいう ReviewLoop の内側に専念し、その前後（初版生成、終了後フィードバック）はn8nワークフロー側に委ねる。"
  detail: |
    モデルレビューの全体プロセスを表す状態遷移図のうち、ModelLogue
    本体が機能として実装する範囲は ReviewLoop の内側に限定する
    ことにした。ReviewLoop の前段（初版モデルの生成：AI自動生成や
    人間による手動記述）と、後段（合意形成・保留・仕様不備の
    通知やフィードバック）は、n8nワークフローと現場の運用で
    組み立てる範囲とする。

    ユーザー要求（UR）レベルでは、レビュー前後のタスクも要求として
    広く拾う（例：UR「初版モデル生成を依頼する」「レビューセッション
    を終了する」）。しかしシステム要求（SR）レベルでは、ModelLogue
    本体が実装するのは「既存のPlantUMLソースを受け取れる」「セッション
    成果物をエクスポートできる」という入出力の境界に絞る。具体的な
    生成手段や送信先は現場ごとにn8nで構成する。

    このスコープ境界は明示的な設計判断であり、将来「なぜ初版生成
    機能がないのか」「なぜ終了時に上流工程に通知する機能がないのか」
    という疑問が出たときに、本ADRを参照すれば設計意図が伝わるように
    記録しておく。

neglected:
  - option: "初版生成機能（要求仕様書からPlantUMLを生成する等）をModelLogue本体に実装する"
    because: "現場ごとに生成方式が異なり、汎用化するとシステムが肥大化する。n8nワークフローで個別構成する方が柔軟"
  - option: "レビュー終了時のフィードバック送信先（チケット管理ツール、Slack等）をModelLogue本体に実装する"
    because: "現場ごとに送信先が異なる。n8nワークフローでアダプトする方が柔軟"
  - option: "ユーザー要求から前後タスクを排除し、ModelLogueの直接機能だけをURとして書く"
    because: "ニーズの全体像を捉えられず、本当の利用文脈が見えなくなる。仕様駆動開発の原則に反する"

consequences:
  positive:
    - "システム要求のスコープが明確になり、実装範囲が爆発しない"
    - "現場ごとの業務プロセス差異にn8nワークフローで対応できる"
    - "ユーザー要求の全体像は失われない（広く拾う）"
    - "ModelLogue本体は再利用しやすい部品として位置づけられる"
  negative:
    - "ModelLogueをそのまま現場で使うには、別途n8nワークフローの構築が必要"
    - "「これはModelLogueの機能ではない」という説明を都度行う必要がある"
  risks:
    - "境界の判定が将来曖昧になり、UR/SRの対応関係がぶれる可能性"

references:
  - "Doc/requirements/user_requirements.yaml"
  - "Doc/adr/ADR-002-n8n-as-orchestrator.yaml"

v7_1_amendment:
  date: "2026-04-14"
  note: |
    v7.1 での運用上の明確化（本ADRは維持）。

    レビューは「モデル図を介して要求仕様をブラッシュアップする」
    営みだが、初版を作るだけのために外部 n8n ワークフローを組むのは
    運用負荷が高い。そこで ModelLogue 本体の内部に以下の**薄い**
    追加機能を入れることにした:

      - 要求仕様タブ（SR-080）: このモデル分に限定した短い要求仕様
        文（目安 4000 字、上限 8000 字）を受け取り、セッション中は
        読み取り専用で参照できる。
      - モデル生成ボタン（SR-082）: 要求仕様文をコンテキストに
        「初版モデルを作ってください」とチャット送信するショート
        カット。通常のチャット経路を使うので対話ログに残る。
      - 外部シードバンドル受け取り口（SR-083）:
        `{ requirementsText?, plantUmlSource? }` を URL パラメータ
        またはファイル import で受け取る。

    本ADRの境界は維持している。理由:
      - 受け取れる要求仕様はこのモデル分の断片だけ。大きな要求仕様
        文書からの抽出は依然として ModelLogue の外（n8n / CI / 人手）
        でやる。
      - 最終モデル確定後の「要求仕様の再導出（レビュー結果の自然
        言語への反映）」は外部ワークフロー側の仕事のまま。ModelLogue
        はエクスポートされた ReviewSession（モデル + 対話ログ +
        最初の要求仕様断片）を渡して終わる。
      - 上流通知・チケット連携・Git 連携などの後段もすべて n8n 側。

    要するに、境界上の**受け渡し仕様**を明文化しただけで、内部で
    大きな要求仕様文書の処理や再導出は行わない。
