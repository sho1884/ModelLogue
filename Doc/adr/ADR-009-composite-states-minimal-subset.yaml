id: ADR-009
title: "複合状態は1階層限定の最小サブセットでサポートする"
date: "2026-04-08"
status: accepted
superseded_by: null

revisions:
  - date: "2026-07-06"
    change: |
      テスト生成の戦略を「レイヤード」から「平坦化（1段インライン展開）」に変更。
      本ADRの「複合状態=1階層限定」という決定自体は維持する（むしろそれが平坦化を
      有界に保つ）。変えたのはテストの作り方のみ。

      レイヤード（複合を黒箱として親でテスト＋内部を別レイヤーで別々にテスト）は、
      境界をまたぐ遷移列（進入→内部で切替→脱出を1本の列として）を落とすため
      被覆が手薄になり、しかも同一挙動でもモデルの描き方でテスト数が変わる。
      黒箱側は複合状態が内部で消費する事象（例：計測中のラップ）を「禁止遷移」
      として偽報告もする。テスト生成ツールでこの被覆低下は許容できない。

      対応：複合状態は生成前に機械的に平坦化し、通常の完全 N-switch をかける。
      進入は内部初期へ、グループ脱出は各子状態へ複製、内部遷移はそのまま。結果、
      複合モデルと手で平坦化した等価モデルは同一のテストを生成し、偽の禁止も消える。

      教訓：モデルを構造化（階層化）しただけで被覆が静かに下がってはならない。
      被覆は「挙動」に対して不変であるべきで、「描き方」に依存してはならない。
      詳細は tools/nswitch/Requirements_Specification.md §7.1。

participants:
  author: ""
  approver: ""
  last_updated: "2026-04-08"

context:
  problem: |
    Antigravity氏が作成したModelLogue自身のレビュープロセスを表す
    状態遷移図が、フラットな状態遷移図サブセットでは表現しにくい
    ことが分かった。具体的には、複数の状態に対する共通遷移
    （例：レビューループ全体からの脱出）をフラットに展開すると
    遷移が冗長になり、図の意図（フェーズの抽象化）も失われる。

    一方で、業界調査の結果、複合状態を完全にサポートしようとすると
    実装が大きくなる：
    - 直交領域（並行状態）
    - ヒストリ擬似状態
    - ドット記法による直接進入
    - 入れ子の入れ子（多階層ネスト）
    - entry/exit point擬似状態
    などを全て扱う必要が出てくる。

    一方、フラットなままでは、設計のDRY原則も状態遷移表のレイヤード
    戦略も活かせない。妥協点が必要だった。
  drivers:
    - "設計のDRY化（共通遷移を親に1回書けば済む）"
    - "状態遷移表のレイヤード戦略（業界調査結果より、テスト数削減の恩恵）"
    - "実装コストの抑制（パーサー全面書き直しを避ける）"
    - "PlantUMLサブセットを最初から厳密に絞る方針（ModelLogueは完全なPlantUMLを目指していない）"
    - "他のモデル図種への将来拡張時にも同じ枠組みを流用できること"

decision:
  summary: "複合状態は1階層の入れ子に限定してサポートする。直交領域、ヒストリ、ドット記法、多階層ネスト、entry/exit pointは構文エラーとして拒否する。"
  detail: |
    PlantUMLサブセットに複合状態を導入することにした。ただし、
    以下の最小サブセットに限定する：

    **サポートする機能**:
    - `state X { ... }` による1階層の入れ子
    - 複合状態を source とする遷移（グループ脱出：内部のどの状態からでも発火）
    - 複合状態を target とする遷移（内部の初期状態へ進入）
    - 複合状態の内部の `[*] --> ChildState`（内部初期遷移の定義）
    - 状態遷移表のハイブリッドパターン表示（複合状態の行と子状態の行を並べる、子状態はインデント）

    **サポートしない機能**（構文エラーで拒否）:
    - 入れ子の入れ子（`state X { state Y { ... } }`）
    - 直交領域（`--` による並行区分）
    - ヒストリ擬似状態（`[H]`、`[H*]`）
    - ドット記法による直接進入（`X.Y`）
    - entry/exit point擬似状態

    この制限により、得たい利点は得つつ、実装コストを抑制できる：
    - 設計のDRY化
    - レイヤード戦略によるテスト数削減（将来のNスイッチカバレッジ生成サービスとの接続時。生成自体はModelLogue本体の外側で別サービスとして実装する。詳細は ADR-010 参照）
    - パーサーは行ベースのまま維持し、中括弧の深さカウンタと
      「現在の親ID」変数を追加するだけで対応可能（30〜50行程度）

    1階層の制限自体が意図的な設計判断である。将来「なぜネストできない
    のか」と問われたときに、この決定を参照できる。

neglected:
  - option: "複合状態を完全にサポートする（直交領域・ヒストリ・多階層・ドット記法すべて）"
    because: "パーサー全面書き直しが必要で実装コストが大きい。ModelLogueはPlantUML完全互換を目指していないのでオーバースペック"
  - option: "複合状態をサポートしない（フラットなまま）"
    because: "設計のDRY化とテスト数削減という主要な利点が得られない。Antigravity図のような実用的な状態遷移図を表現できない"
  - option: "複合状態をパーサーで扱わず、コメント注釈やラベル命名規則で擬似的に表現する"
    because: "標準的なPlantUML文法から逸脱する非慣用的な書き方になり、可読性とツール互換性が落ちる"
  - option: "1階層ではなく2階層まで許す"
    because: "実装コストが急増し（スコープ管理、ID解決の複雑化）、得られる表現力の追加メリットが少ない。必要になった時点で再検討する"

consequences:
  positive:
    - "設計のDRY化が実現される（共通遷移を親に集約できる）"
    - "状態遷移表でハイブリッドパターン（業界標準）を採用できる"
    - "将来のNスイッチカバレッジ生成サービス（ADR-010に基づく外部サービス）でレイヤード戦略を適用できる"
    - "パーサー実装コストが抑制される（全面書き直し不要）"
    - "Antigravity図のような実用的な状態遷移図を自然に表現できる"
    - "アクティビティ図など他のモデル図種に拡張する際も同じ枠組みを使える"
  negative:
    - "深い階層を持つ複雑な状態マシンは表現できない"
    - "並行状態（直交領域）を含むモデルは扱えない"
    - "ヒストリを使った復元動作は表現できない"
    - "「PlantUMLそのもの」と思って使うユーザーは構文エラーで戸惑う可能性がある"
  risks:
    - "将来、より高度な表現力が必要になった場合、本ADRを再検討する必要がある"
    - "サポート/非サポートの境界をユーザーに正確に伝える文書化が必要"

references:
  - "Doc/requirements/system_requirements.yaml SR-002"
  - "Doc/architecture.md §6.1"
  - "Doc/adr/ADR-010-external-services-for-heavy-or-domain-specific-work.yaml"
  - "業界調査結果：David Harel Statecharts, ISO/IEC/IEEE 29119-4, MATLAB Stateflow, IBM Rhapsody, Yakindu, 秋山浩一氏の状態遷移マトリクス"
