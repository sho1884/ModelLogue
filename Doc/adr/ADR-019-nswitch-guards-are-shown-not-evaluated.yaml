id: ADR-019
title: "N-switch 生成器はガードを評価せず、各ステップに出力して前提条件として明示する（経緯で決まる条件は状態で表す）"
date: "2026-11-20"
status: accepted
superseded_by: null

participants:
  author: ""
  approver: ""
  last_updated: "2026-11-20"

context:
  problem: |
    状態遷移図のテスト生成（tools/nswitch、ADR-010）は、遷移の連鎖
    （0/1/2-switch）を Tests とし、それらを覆う一筆書きの経路を
    Scenarios として出力している。経路の探索は遷移のつながりだけを
    見ており、遷移に付いたガード（`イベント [ガード] / アクション`）は
    探索にも出力にも使っていなかった。

    契約保全の演習事例（第1版、ガード版モデル）で次の2件が報告された。

    - BUG-1: 「復活審査中」からの遷移に、履歴で決まる排他なガード
      （[復活可能期間内] / [復活可能期間満了済]）を付けていた。
      [復活可能期間満了済] は「復活可能期間満了」の自己遷移を通った
      後でしか成り立たないが、生成されたシナリオの一部
      （SC-003・SC-010・SC-011）はその遷移を通らずに
      「→ 消滅」の遷移を通っていた。実行すると期待値と一致しない。
      さらに「取下げ → 消滅」を通るシナリオは SC-010 の1本だけで、
      実行可能なシナリオが1本もないことが出力から分からなかった。
    - BUG-2: Tests・Scenarios の出力（画面・CSV）にガードとアクションが
      含まれず、同じ開始状態・同じイベントでガードにより行き先が
      分かれるテストを、到達状態でしか区別できなかった。遷移表には
      ガードとアクションが表示されていた。

    ガードの文言は自由記述であり、生成器はその意味を解釈できない。
    「その時点の入力値で決まる条件」（[全額] など）と「過去の経緯で
    決まる条件」（期限が過ぎたか、謝絶されたか）も区別できない。
    同じ事例の第2版では、経緯で決まる条件を状態の分割で表し、
    ガードなしで同じ業務を表せている（第2版は演習の模範解答のため、
    公開文書では状態の分け方を示さず、同じ構造の中立的な例を使う）。

  drivers:
    - 生成されたシナリオを、そのまま実行してよいかどうかが出力から分かること
    - ガード付きの遷移で行き先が分かれるテストを、出力だけで区別できること
    - アクションはテストの期待結果そのものであり、到達状態だけでは不具合を見逃す
    - 状態機械の N-switch 生成器の範囲に収めること（ADR-010 / ADR-011 の決定論）
    - CLI・HTTP API・画面の CSV がバイト単位で一致すること（ADR-011）

decision:
  summary: "生成器はガードを評価しない。各ステップのガードとアクションを出力し、ガード付きの遷移を通るシナリオには「どのステップのどのガードが成り立つことを前提とするか」を明示する。経緯で決まる条件は状態を分けて表すことを、モデリングの指針として仕様と利用者向けページに書く"

  detail: |
    1. **ガードは評価しない**：経路の探索はこれまでどおり遷移の
       つながりだけで行う。生成器はガードの真偽を判定せず、
       そのことを仕様書と利用者向けページに明記する。
    2. **ステップごとにガードとアクションを出力する**：Tests と
       Scenarios の各ステップを `event_i, guard_i, action_i,
       reached_i` の4列とする。ガードやアクションがないモデルでも
       列は常に出し、値を空にする（モデルによって列の並びが
       変わらないようにするため）。列の位置が変わるので、生成器の
       版を 0.2.0 に上げる。
    3. **シナリオに前提条件を明示する**：Scenarios に
       `preconditions` 列を加え、ガード付きのステップを
       `<ステップ番号>:[<ガード>]` の形で `;` 区切りに並べる
       （例：`4:[復活可能期間満了済]`）。画面では
       「前提：ステップ4 の [復活可能期間満了済] が成り立つこと」
       のように文で表示し、該当するガードのセルを強調する。
       生成器はガードの種類を区別できないため、ガード付きの
       ステップを含むシナリオにはすべて付ける。Tests では、自身の
       ステップのガードが列にそのまま出るので、印の列は設けない。
    4. **モデリングの指針**：ガードは、その時点の入力値で決まる
       条件に使う。過去の経緯で決まる条件は、状態を分けて表す。
       指針は生成器の仕様書と、利用者が読む状態遷移図のページ
       （ガードの文法の説明と Test cases の説明）の両方に書き、
       実例は、同じ構造を持つ中立的な例（図書館の貸出と延滞）で示す。
       契約保全事例の第2版は演習の模範解答なので、公開文書には
       状態の分け方を載せない。

    印を付けても、「ある遷移を通る実行可能なシナリオが1本もない」
    ことは出力から分からない。それを防ぐのは 4 の指針であり、
    出力の印はその指針に沿っていないモデルで実行前に気づく
    ための手がかりと位置づける。

neglected:
  - option: "(a) 拡張状態変数を追跡し、ガードが成り立つ経路だけでシナリオを組む"
    because: |
      ガードは自由記述であり、その意味（どの変数がどの遷移で
      どう変わるか）をモデルが持っていない。厳密に行うには
      ガードとアクションの言語を定め、変数の値を追跡する必要が
      あり、状態機械の N-switch 生成器の範囲を超える。
      経緯で決まる条件は状態の分割で表せる（第2版で実証済み）ので、
      生成器を拡張するより、モデリングの指針で扱うほうが筋がよい。

  - option: "(b) のうち、シナリオに「前提条件要確認」の印だけを付ける"
    because: |
      何を確認すればよいか（どのステップのどのガードか）が分からない。
      ステップごとのガード列（BUG-2 の修正）を出すなら、印はそれを
      指せば足りる。

  - option: "ガード列・アクション列を、モデルにガード（アクション）があるときだけ出す"
    because: |
      表は狭くなるが、モデルによって列の並びが変わり、列番号で
      読む下流の仕組み（データ駆動のテスト実行）が壊れやすくなる。

  - option: "アクションは出さず、ガードだけを出す"
    because: |
      アクションはテストの期待結果そのものである。到達状態だけでは
      「状態は合っているが未払保険料が0になっていない」のような
      不具合を見逃す。

consequences:
  positive:
    - "ガードで行き先が分かれるテストを、出力だけで区別できる"
    - "シナリオを実行する前に、成り立たせる必要のある前提（ステップとガード）が分かる"
    - "アクションが出力に載り、期待結果の確認に使える"
    - "経緯で決まる条件を状態で表す指針が、利用者の目に入る場所に書かれる"

  negative:
    - "Tests・Scenarios の CSV の列の位置が変わる。列番号で読む既存の仕組みは直す必要がある（版を 0.2.0 に上げる）"
    - "列が増え、2-switch の Tests は 3ステップ×4列になる"
    - "入力値で決まるガード（[全額] など）を通るシナリオにも印が付く"

  risks:
    - "指針に沿わないモデル（履歴依存のガード）では、実行可能なシナリオがない遷移が依然として出力から見えない。指針の周知に依存する"
    - "ガードの文言に `;` や `]` が含まれると preconditions の読み取りが曖昧になりうる（ガードは文法上 `]` を含まない。`;` は CSV 上は引用で保たれるが、列の値を分割する下流は注意が要る）"

