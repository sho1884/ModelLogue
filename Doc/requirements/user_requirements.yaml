# ModelLogue User Requirements
# Format: Task expression (Value Engineering)
# Writing convention: Short verb phrase describing user task

version: "7.7"
last_updated: "2026-05-01"

# Version 7.0 highlights:
#   - Reframed as a review tool where PlantUML source and requirements text
#     are BOTH read-only references during review. All model changes flow
#     through AI dialogue → Apply, so every change is captured in the
#     dialogue log (Dialogue as Asset).
#   - UR-002 "Edit PlantUML source" removed. Source seeding happens at
#     session start (import / generate-from-requirements / first paste),
#     not during review.
#   - UR-008 reframed: the EBNF grammar is not a tab in the UI; users who
#     need it download the static file.
#   - New UR-012: Refer to the target requirements text alongside the model.
#   - UR-009 widened: an initial PlantUML source AND (optionally) a matching
#     requirements text fragment can be received together.

requirements:
  UR-001:
    task: "Review state machine diagram"
    background: >
      Reviewer examines a state machine diagram to verify correctness
      of states, transitions, events, guards, and actions.
      The diagram is displayed as PlantUML-generated SVG with pan and
      zoom support. Markers can be placed on top of the diagram to
      indicate areas of concern.
    priority: high

  UR-002:
    task: "Refer to the PlantUML source of the current model"
    background: >
      The PlantUML source is the canonical representation of the model
      under review, but during a review session it is read-only. All
      model changes flow through AI dialogue and the Apply action, which
      keeps every change attributable to an entry in the dialogue log.
      Reviewers still need to SEE the source at any time — to cite a
      specific line in discussion, to understand what the AI is about
      to change, and to hand-inspect the proposed edit before applying.
      Direct source editing was intentionally removed in v7.0; typos or
      small tweaks are handled by asking the AI in natural language so
      that the intent is captured in the log (Dialogue as Asset).
    priority: high

  UR-003:
    task: "View state transition table"
    background: >
      Reviewer inspects a state transition matrix to find missing
      or incorrect transitions. Two matrix forms are available:
      State×Event (cell = next state) and PreState×PostState (cell = event).
    priority: high

  UR-004:
    task: "Place markers on the diagram"
    background: >
      Reviewer places markers on the diagram to indicate "look here"
      during a review. Three marker shapes are available: ellipse,
      rectangle, and arrow. Ellipse and rectangle surround a region
      of interest; arrow points at a single location. The reason for
      offering both ellipse and rectangle is that they hide different
      parts of the underlying diagram, which matters in practice.

      Markers are drawn by selecting a tool from a small toolbar and
      dragging on the diagram. After being drawn, a marker can be
      moved, resized, or have its arrow endpoints adjusted. A marker
      is removed by selecting it and pressing Delete, or via a
      right-click menu.

      Each marker is assigned a color from a fixed four-color palette
      (red, blue, green, purple). Colors are picked automatically from
      the unused colors so that no two markers share a color at the
      same time. When all four colors are in use, a new marker cannot
      be added; pressing the tool button shows a toast error. The
      intent is to keep the number of focus points small enough that
      humans and AI can refer to each one unambiguously by color
      ("the red ellipse", "what about the blue arrow?").

      The system always knows the marker positions and the underlying
      element coordinates, so the AI receives both as context and can
      reason about which model elements each marker is pointing at.
      The system does not need to bind a marker to a specific element
      strictly; if it is ambiguous, the AI asks the reviewer.
    priority: high

  UR-005:
    task: "Discuss the model with AI"
    background: >
      Reviewer or author chats with AI about the model's correctness.
      AI understands both the PlantUML source and the structured
      state machine model. Conversation is relayed via n8n.
    priority: high

  UR-006:
    task: "Apply AI suggestions"
    background: >
      When the AI proposes a PlantUML modification, the reviewer judges
      it by comparing the CURRENT model and the PROPOSED model visually
      — diagram before and after, placed side-by-side, with added /
      removed / changed states and transitions highlighted on the
      proposed side (using the same overlay mechanism as review
      markers). A raw text diff is not enough: people chose to use a
      diagram precisely because comparing intent in natural language
      is hard. Apply reflects the change into source, diagram, and
      tables simultaneously; Undo reverts the latest Apply.
    priority: medium

  UR-007:
    task: "Save the review evidence and lift individual artifacts out of the session"
    background: >
      Two related but distinct needs:

        a) Save the WHOLE review as evidence — final PlantUML source,
           requirements text, full chat log, every applied source
           snapshot, markers, outcome, and metadata — as a single
           JSON file. This is what the reviewer hands off as the
           record of the review (and what they re-open later to
           continue from where they left off).

        b) Lift INDIVIDUAL artifacts out of the session for use in
           other tools: the final PlantUML source on its own, the
           state-transition matrices as CSV / TSV for spreadsheets,
           and (when the auxiliary service lands) generated test
           cases as CSV. Both Copy-to-clipboard and Save-as-file
           paths matter — Copy for paste-into-anywhere flows, Save
           for archive / commit / CI handoff.

      Session data remains volatile in browser memory (Volatile
      Canvas); persistence happens via these export actions.
    priority: medium

  UR-008:
    task: "Obtain the PlantUML subset grammar definition"
    background: >
      The supported PlantUML subset is defined by a static EBNF file
      (src/grammars/stateDiagram.ebnf). It is already included in every
      AI chat request so generated PlantUML stays inside the subset
      (SR-022). Humans rarely need to read it in-app; when they do, a
      download / open-in-new-tab action from Help is sufficient. The
      original idea of a dedicated EBNF tab in the analysis panel is
      dropped in v7.0.
    priority: low

  UR-009:
    task: "Receive an initial model (and optionally its requirements text) into the review session"
    background: >
      Before a review can start, an initial PlantUML model must exist.
      The way it is produced varies by site:
        a) Supplied from outside (n8n workflow, Git repo, CI pipeline,
           external extraction from a larger requirement document).
           In this case ModelLogue also accepts a matching requirements
           text fragment so the reviewer has the same context the
           initial model was written from.
        b) Generated inside ModelLogue by pasting a small requirements
           text into the Requirements tab and pressing "Generate model",
           which is a shortcut for "ask AI to author the initial model
           from this requirements text" via the same chat channel.
        c) First-time paste of PlantUML source when the session is
           still empty (one-shot seed; the source becomes read-only
           once any content is present).

      ADR-008 boundary remains: heavy extraction from a large
      requirements document belongs OUTSIDE ModelLogue (n8n etc.).
      What ModelLogue accepts is a short requirements fragment
      scoped to the model at hand (typical target: a few thousand
      characters).
    priority: high

  UR-010:
    task: "Close the review session with an outcome"
    background: >
      A review session ends in one of several outcomes: consensus
      reached, postponed (modifications cannot yet be agreed),
      or requirement-spec issue discovered (the problem is upstream).
      How the outcome is acted on (notifying stakeholders, opening
      a ticket, committing to Git, etc.) is composed using n8n
      workflows. ModelLogue itself needs to provide a way to
      package the session as evidence and hand it off. See ADR-008
      for the scope boundary.
    priority: medium

  UR-012:
    task: "Refer to the target requirements text alongside the model"
    background: >
      During a review, people work on the diagram but also need to
      remember WHY that model exists — which requirements it is meant
      to satisfy. ModelLogue keeps a short requirements text (scoped
      to this model, not a full spec document) visible on its own tab.
      The text is read-only during review; it is seeded at session
      start (from outside, or by pasting / typing on the tab before
      the model is generated) and stays fixed thereafter. Updating
      the requirements text to reflect the final, agreed model is
      done OUTSIDE the session — given the final model, re-deriving
      the natural-language requirements is a separate task and is
      composed as an n8n workflow (ADR-008).
    priority: medium

  UR-014:
    task: "Review a requirement diagram"
    background: >
      A requirement diagram expresses the intent of a system as a set
      of requirements (functional / non-functional / constraints) and
      the traceability relations between them (derive / refine /
      satisfy / verify / contain / trace / copy). Reviewing it is a
      parallel task to UR-001 (state machine review) — same Dialogue
      as Asset principle, same marker / chat / session workflow — but
      the diagram semantics, analysis views (traceability matrix,
      orphan list), and AI-prompt expectations differ enough that
      ModelLogue treats it as a distinct model type (ADR-012).
      PlantUML has no native requirement diagram; the community uses
      `!procedure` macros over class diagram syntax to approximate
      SysML, and ModelLogue adopts this as its requirement DSL.
    priority: high

  UR-015:
    task: "Review a business process / workflow diagram"
    background: >
      Reviewers agree on end-to-end business processes — who does
      what, in what order, with which branches and events — as the
      basis for E2E / UAT / system-test case design. ModelLogue is
      NOT a formal BPMN or Activity Diagram authoring tool; those
      notations' full feature sets are overkill for review, and
      stakeholders rarely distinguish between them. Instead this
      model type provides the minimum expressive subset that covers
      tasks, branches, start/end, parallel fork/join, swim lanes
      (who), events (triggers, timers, errors), and an optional
      "伝票" (artifact / token) label on the flow arrow between
      tasks — borrowing from traditional paper-based business flow
      diagrams. The subset targets PlantUML activity-diagram native
      syntax so the buffer renders standalone without a macro DSL.
      The primary review artifact is a path-enumeration table
      (start → end scenarios) that feeds directly into E2E / UAT
      test case design, in the same spirit as UR-013's N-switch
      coverage for state machines.
    priority: high

  UR-013:
    task: "Review N-switch coverage test cases derived from the current model"
    background: >
      A reviewed state machine implies a set of test sequences needed to
      cover its transitions (0-switch), transition pairs (1-switch), or
      triples (2-switch). Seeing those sequences during the review — in
      real time, alongside the diagram — surfaces gaps and impossible
      chains that are easy to miss from the diagram alone. The generator
      itself is an auxiliary service (ADR-010); ModelLogue's role is to
      display the resulting test list reactively as the model evolves and
      to let reviewers cross-reference a test sequence with the diagram.
    priority: medium

  UR-011:
    task: "Convert between state machine source and state transition table"
    background: >
      A state transition diagram and a state transition table are
      isomorphic representations of the same model. Reviewers and
      authors must be able to move freely between the two:
      - Importing a state transition table (CSV) into a review
        session, so that legacy spreadsheet-based artifacts can be
        reviewed in ModelLogue without manual rewriting.
      - Exporting the current model as a state transition table
        (CSV), so that the result can be handed off to other tools
        such as test generators, spreadsheet reviews, or CI/CD
        pipelines.
      Both directions go through PlantUML subset source as the
      canonical form (CSV → PlantUML source → model, and model →
      PlantUML source → CSV). The CSV format is strictly defined
      to keep the conversion deterministic and predictable
      (see ADR-011). Per ADR-010, the converter is implemented as
      an external service in the same repository, callable from
      both ModelLogue and CI/CD pipelines.
    priority: medium

  UR-016:
    task: "Establish the correct model type for the session, even when the type is unstated or initially miscued"
    background: >
      Three concerns are bundled here because they all manifest as
      "the session is running under the wrong model type":

      a) Late detection. As the number of model types grows
         (state-machine, requirement, process, future class /
         sequence / classification-tree / …), the chance of picking
         the wrong type at session seed grows. The cost of catching
         the mistake late is the work the reviewer has already
         poured into the wrong-typed session — source, chat,
         markers, requirements text. The detection must happen as
         early as possible in the workflow, not after the user has
         invested effort.

      b) Information loss when correcting. When the type does need
         to be switched, the user's existing input must not be
         silently destroyed. The default seed-template overwrite
         that fits "I'm starting fresh under a new type" is wrong
         for "I picked the wrong type and need to re-tag what I
         already have." Both flows must be available, and the
         re-tag flow must preserve source / chat / markers /
         requirements text.

      c) External bootstrapping without an explicit type. The
         session is increasingly seeded by upstream pipelines
         (n8n workflows extracting from larger documents, CI
         handoff, GitHub PR bots, etc.). These external producers
         can pass a PlantUML source / CSV / requirements text
         fragment but cannot reasonably be required to declare
         "this is a state-machine diagram" / "this is a process
         diagram" — that classification is exactly what the user
         expects ModelLogue to handle. When `modelTypeId` is
         absent or ambiguous in the seed bundle, the system must
         resolve it from the content itself, falling back to a
         user choice only when the content is genuinely
         ambiguous.

      The three sub-problems share a common requirement
      structure: the system reads available signals (source
      content, parse outcomes, bundle metadata), surfaces
      disagreements between the chosen type and what the
      content suggests, and offers a recovery path that
      preserves the user's work.
    priority: medium

  UR-017:
    task: "Have multiple participants take part in the review chat"
    background: >
      A review is, by definition, a multi-person activity.
      ModelLogue v7.7 only allows the facilitator and the AI on
      the chat pane, so other reviewers have no way to take part
      in the conversation that drives the model. UR-017 is the
      simple user-side need: multiple people should be able to
      participate in the review chat.

      Implementation strategy is intentionally NOT specified
      here. The architectural decision (how the multi-participant
      chat is realised) is recorded as an ADR; the resulting
      derived functions are SR-132–135; the corresponding quality
      bar is NFR-080 / NFR-081. UR-017 itself stands as the user
      need.

      Out-of-scope:
        - The previous Future-Extensions line "Slack/Teams/
          Discord feedback via n8n" referred to one-shot post-
          session notifications, not in-session dialogue. UR-017
          replaces that line.
        - Real-time multi-user marker / source collaboration is
          a separate concern; if pursued it belongs to its own
          UR.
    priority: high
