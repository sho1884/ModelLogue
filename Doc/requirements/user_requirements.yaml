# ModelLogue User Requirements
# Format: Task expression (Value Engineering)
# Writing convention: Short verb phrase describing user task

version: "5.0"
last_updated: "2026-04-07"

requirements:
  UR-001:
    task: "Review state machine diagram"
    background: >
      Reviewer examines a state machine diagram to verify correctness
      of states, transitions, events, guards, and actions.
      The diagram is displayed as PlantUML-generated SVG with pan and
      zoom support. Markers can be placed on top of the diagram to
      indicate areas of concern.
    priority: high

  UR-002:
    task: "Edit PlantUML source"
    background: >
      Author writes or modifies PlantUML state diagram source code.
      The tool supports a simplified subset of PlantUML state diagram
      syntax, optimized for review rather than full-featured drawing.
    priority: high

  UR-003:
    task: "View state transition table"
    background: >
      Reviewer inspects a state transition matrix to find missing
      or incorrect transitions. Two matrix forms are available:
      State×Event (cell = next state) and PreState×PostState (cell = event).
    priority: high

  UR-004:
    task: "Place markers on the diagram"
    background: >
      Reviewer places markers on the diagram to indicate "look here"
      during a review. Three marker shapes are available: ellipse,
      rectangle, and arrow. Ellipse and rectangle surround a region
      of interest; arrow points at a single location. The reason for
      offering both ellipse and rectangle is that they hide different
      parts of the underlying diagram, which matters in practice.

      Markers are drawn by selecting a tool from a small toolbar and
      dragging on the diagram. After being drawn, a marker can be
      moved, resized, or have its arrow endpoints adjusted. A marker
      is removed by selecting it and pressing Delete, or via a
      right-click menu.

      Each marker is assigned a color from a fixed four-color palette
      (red, blue, green, purple). Colors are picked automatically from
      the unused colors so that no two markers share a color at the
      same time. When all four colors are in use, a new marker cannot
      be added; pressing the tool button shows a toast error. The
      intent is to keep the number of focus points small enough that
      humans and AI can refer to each one unambiguously by color
      ("the red ellipse", "what about the blue arrow?").

      The system always knows the marker positions and the underlying
      element coordinates, so the AI receives both as context and can
      reason about which model elements each marker is pointing at.
      The system does not need to bind a marker to a specific element
      strictly; if it is ambiguous, the AI asks the reviewer.
    priority: high

  UR-005:
    task: "Discuss the model with AI"
    background: >
      Reviewer or author chats with AI about the model's correctness.
      AI understands both the PlantUML source and the structured
      state machine model. Conversation is relayed via n8n.
    priority: high

  UR-006:
    task: "Apply AI suggestions"
    background: >
      Author applies AI-proposed PlantUML modifications with one click.
      Changes are reflected in diagram, table, and source simultaneously.
    priority: medium

  UR-007:
    task: "Export review session"
    background: >
      Author exports the review session (PlantUML source + dialogue log
      + analysis artifacts) as a file for review evidence.
      Session data is volatile (browser memory only).
    priority: medium

  UR-008:
    task: "View PlantUML subset grammar"
    background: >
      Author refers to the constrained PlantUML grammar (EBNF)
      to understand which syntax is supported for state diagrams.
    priority: low
