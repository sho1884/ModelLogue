# ModelLogue Test Strategy

version: "2.0"
last_updated: "2026-04-08"

# =============================================================================
# Overview
# =============================================================================

approach: "specification-driven"
description: |
  Test strategy driven by requirements specification.
  Core logic (parser, model, table generator) is tested with golden data.
  UI components are tested with React Testing Library.
  要求仕様駆動のテスト戦略。
  コアロジック（パーサー、モデル、テーブル生成）はゴールデンデータで検証。
  UIコンポーネントはReact Testing Libraryで検証。

# =============================================================================
# Test Categories
# =============================================================================

test_categories:

  unit_tests:
    description: "Test individual functions in isolation"
    targets:
      - component: "StateMachineParser"
        traces_to: SR-002
        tests:
          - "Parse simple state transitions (A --> B : event)"
          - "Parse initial/final pseudo-states ([*])"
          - "Parse transitions with event, guard, and action"
          - "Parse state aliases (state \"name\" as alias)"
          - "Parse multiple transitions from same state"
          - "Report syntax errors with line numbers"
          - "Handle empty source gracefully"
          - "Unicode state names (Japanese)"

      - component: "StateMachineSerializer"
        traces_to: SR-003
        tests:
          - "Serialize simple state machine to PlantUML source"
          - "Round-trip: parse → serialize produces equivalent source"
          - "Preserve event, guard, and action on transitions"

      - component: "StateEventMatrix"
        traces_to: SR-020
        tests:
          - "Generate matrix from simple state machine"
          - "Empty cells for missing transitions"
          - "Multiple transitions with different guards on same event"
          - "Exclude initial/final pseudo-states from rows"
          - "Deduplicate events for columns"

      - component: "StateStateMatrix"
        traces_to: SR-021
        tests:
          - "Generate matrix from simple state machine"
          - "Multiple events between same state pair"
          - "Empty cells for no direct transition"

      - component: "SvgCoordinateExtractor"
        traces_to: SR-011
        tests:
          - "Extract state positions from PlantUML SVG"
          - "Map SVG elements to model states by name"
          - "Handle SVG with state aliases"

  integration_tests:
    description: "Test PlantUML source → Model → Tables pipeline"
    approach: "Golden data comparison"
    format:
      input: "PlantUML source (.puml)"
      expected_output:
        - "state_event_matrix.json"
        - "state_state_matrix.json"
        - "model.json"

  component_tests:
    description: "Test React components with React Testing Library"
    targets:
      - component: "StateMachineDiagram"
        traces_to: [SR-010, SR-012, SR-013]
        tests:
          - "Render states as nodes"
          - "Render transitions as edges"
          - "Select state node on click"
          - "Emit selection event"

      - component: "AnalysisPanel"
        traces_to: SR-071
        tests:
          - "Switch between tabs"
          - "Resize panel via drag"
          - "Collapse and expand"

      - component: "BidirectionalHighlighter"
        traces_to: SR-022
        tests:
          - "Click table row highlights diagram state"
          - "Click diagram state highlights table row"
          - "Click transition highlights table cell"

# =============================================================================
# Golden Test Cases
# =============================================================================

golden_test_cases:

  basic:
    - id: "GT-001"
      name: "Simple two-state machine"
      description: "Two states with one transition"
      plantuml: |
        @startuml
        [*] --> Idle
        Idle --> Active : start
        Active --> Idle : stop
        Active --> [*]
        @enduml
      expected:
        states: ["Idle", "Active"]
        events: ["start", "stop"]
        transitions: 4  # including initial and final

    - id: "GT-002"
      name: "Transitions with guards and actions"
      description: "State machine with guard conditions and actions"
      plantuml: |
        @startuml
        [*] --> Idle
        Idle --> Processing : submit [valid] / validate()
        Idle --> Error : submit [invalid] / showError()
        Processing --> Done : complete / notify()
        Error --> Idle : retry
        Done --> [*]
        @enduml
      expected:
        states: ["Idle", "Processing", "Error", "Done"]
        events: ["submit", "complete", "retry"]

    - id: "GT-003"
      name: "State aliases with Japanese names"
      description: "States with display names in Japanese"
      plantuml: |
        @startuml
        state "待機中" as Idle
        state "処理中" as Processing
        state "完了" as Done
        [*] --> Idle
        Idle --> Processing : start
        Processing --> Done : finish
        Done --> [*]
        @enduml
      expected:
        states: ["Idle", "Processing", "Done"]
        labels: ["待機中", "処理中", "完了"]

  matrix:
    - id: "GT-010"
      name: "State×Event matrix basic"
      description: "Verify State×Event matrix generation"
      plantuml: |
        @startuml
        [*] --> S0
        S0 --> S1 : E1
        S1 --> S2 : E2
        S2 --> S0 : E3
        S2 --> S3 : E4
        S0 --> S0 : E5
        S3 --> S1 : E1
        @enduml
      expected_state_event_matrix:
        rows: ["S0", "S1", "S2", "S3"]
        columns: ["E1", "E2", "E3", "E4", "E5"]
        cells:
          S0: { E1: "S1", E5: "S0" }
          S1: { E2: "S2" }
          S2: { E3: "S0", E4: "S3" }
          S3: { E1: "S1" }

    - id: "GT-011"
      name: "PreState×PostState matrix basic"
      description: "Verify PreState×PostState matrix generation"
      plantuml: |
        @startuml
        [*] --> S0
        S0 --> S1 : E1
        S1 --> S2 : E2
        S2 --> S0 : E3
        S2 --> S3 : E4
        S0 --> S0 : E5
        S3 --> S1 : E1
        @enduml
      expected_state_state_matrix:
        rows: ["S0", "S1", "S2", "S3"]
        columns: ["S0", "S1", "S2", "S3"]
        cells:
          S0: { S0: "E5", S1: "E1" }
          S1: { S2: "E2" }
          S2: { S0: "E3", S3: "E4" }
          S3: { S1: "E1" }

  composite:
    - id: "GT-020"
      name: "Composite state with internal initial transition"
      description: "Verify a one-level composite state is parsed and child states get parentId set"
      plantuml: |
        @startuml
        state Operating {
          [*] --> Idle
          Idle --> Working : start
          Working --> Idle : stop
        }
        [*] --> Operating
        @enduml
      expected:
        composite_states: ["Operating"]
        child_states_of_operating: ["Idle", "Working"]
        normal_states_top_level: []
        transitions_count_inside_operating: 3   # internal [*]->Idle, Idle->Working, Working->Idle

    - id: "GT-021"
      name: "Composite state with group escape transition"
      description: "Verify that a transition whose source is the composite name is treated as group escape"
      plantuml: |
        @startuml
        state ReviewLoop {
          [*] --> Inspecting
          Inspecting --> Asking : ask
          Asking --> Inspecting : answered
        }
        [*] --> ReviewLoop
        ReviewLoop --> Done : finished
        Done --> [*]
        @enduml
      expected:
        group_escape_transitions:
          - source: "ReviewLoop"
            target: "Done"
            event: "finished"
        # In the State×Event matrix, the row 'ReviewLoop' must hold the 'finished' transition,
        # not the rows 'Inspecting' or 'Asking'.

    - id: "GT-022"
      name: "Hybrid State×Event matrix for a composite"
      description: "Verify the hybrid pattern: composite row + child rows under it"
      plantuml: |
        @startuml
        state Operating {
          [*] --> Idle
          Idle --> Working : start
          Working --> Idle : stop
        }
        [*] --> Operating
        Operating --> Failure : fault
        Failure --> Operating : reset
        @enduml
      expected_state_event_matrix:
        # Hybrid: composite states and child states both appear as rows.
        # Order: composite first, then its children indented, then siblings.
        rows: ["Operating", "  Idle", "  Working", "Failure"]
        columns: ["fault", "reset", "start", "stop"]
        cells:
          Operating: { fault: "Failure" }
          Idle: { start: "Working" }
          Working: { stop: "Idle" }
          Failure: { reset: "Operating" }

  composite_rejected:
    description: "Constructs that must be rejected with a syntax error per ADR-009"
    - id: "GT-030"
      name: "Reject nested composite state"
      plantuml: |
        @startuml
        state Outer {
          state Inner {
            [*] --> A
          }
        }
        @enduml
      expected_error: "Nested composite state not supported"

    - id: "GT-031"
      name: "Reject orthogonal region"
      plantuml: |
        @startuml
        state Parallel {
          [*] --> A
          --
          [*] --> B
        }
        @enduml
      expected_error: "Orthogonal region not supported"

    - id: "GT-032"
      name: "Reject history pseudo-state"
      plantuml: |
        @startuml
        state Outer {
          [*] --> A
          A --> [H]
        }
        @enduml
      expected_error: "History pseudo-state not supported"

    - id: "GT-033"
      name: "Reject dot-notation entry"
      plantuml: |
        @startuml
        state Outer {
          [*] --> A
          A --> B
        }
        SomeOther --> Outer.B : event
        @enduml
      expected_error: "Dot-notation entry not supported"

# =============================================================================
# Test Data Format
# =============================================================================

test_data_format:
  directory: "tests/golden/"
  structure:
    - "{test_id}/"
    - "  input.puml                    # PlantUML source"
    - "  expected_model.json           # Parsed StateMachineModel"
    - "  expected_state_event.json     # State×Event matrix"
    - "  expected_state_state.json     # PreState×PostState matrix"
    - "  metadata.yaml                 # Test case info"

# =============================================================================
# CI Integration
# =============================================================================

ci_integration:
  test_commands:
    unit: "npm test -- --testPathPattern=unit"
    integration: "npm test -- --testPathPattern=integration"
    golden: "npm test -- --testPathPattern=golden"
    all: "npm test"

  coverage_threshold:
    statements: 80
    branches: 75
    functions: 80
    lines: 80

  github_actions:
    triggers:
      - push
      - pull_request
    jobs:
      - lint
      - unit_tests
      - integration_tests
      - golden_tests
      - build
