# ModelLogue Non-Functional Requirements

version: "5.1"
last_updated: "2026-05-01"

requirements:
  NFR-001:
    parent: [UR-001, UR-002]
    category: performance
    name: "Response performance"
    criteria:
      - item: "Source parse + model update"
        standard: "Within 100ms"
      - item: "SVG coordinate extraction"
        standard: "Within 2 seconds (including PlantUML Server round-trip)"
      - item: "State transition table recalculation"
        standard: "Within 100ms"
      - item: "AI first response token"
        standard: "Within 5 seconds (streaming)"
      - item: "UI interaction response"
        standard: "Within 100ms"

  NFR-010:
    parent: [UR-001, UR-002]
    category: usability
    name: "Intuitive operation"
    criteria:
      - item: "Diagram interaction"
        standard: "Pan/zoom/select with mouse"
      - item: "Panel resize"
        standard: "Drag handle for analysis panel"
      - item: "Tab navigation"
        standard: "Single click to switch analysis tabs"

  NFR-011:
    parent: [UR-002]
    category: usability
    name: "Error handling"
    criteria:
      - item: "Parse errors"
        standard: "Display with line number in editor"
      - item: "Connection errors"
        standard: "Display in status bar with service name"
      - item: "Data protection"
        standard: "Last valid state retained on error"

  NFR-020:
    parent: []
    category: compatibility
    name: "Browser compatibility"
    criteria:
      - item: "Primary"
        standard: "Chrome latest version"
      - item: "Secondary"
        standard: "Firefox, Safari, Edge latest versions"
      - item: "Out of scope"
        standard: "Mobile browsers"

  NFR-030:
    parent: []
    category: security
    name: "Security"
    criteria:
      - item: "API keys"
        standard: "Never embedded in frontend; managed by n8n"
      - item: "Input validation"
        standard: "All PlantUML source validated through parser"
      - item: "Injection prevention"
        standard: "No eval(), no Function(), no dangerouslySetInnerHTML with user input"
      - item: "Standards"
        standard: "Follow OWASP Top 10 guidelines"

  NFR-040:
    parent: []
    category: internationalization
    name: "Internationalization"
    criteria:
      - item: "Supported languages"
        standard: "English (EN), Japanese (JA)"
      - item: "UI language switch"
        standard: "User can switch via settings"
      - item: "Default language"
        standard: "Follow browser locale setting"
      - item: "PlantUML keywords"
        standard: "English only (no localization)"
      - item: "State labels"
        standard: "Unicode characters allowed (including Japanese)"

  NFR-050:
    parent: []
    category: maintainability
    name: "Code quality"
    criteria:
      - item: "Type safety"
        standard: "TypeScript strict mode"
      - item: "Testability"
        standard: "Parser and table generator testable independently"
      - item: "Modularity"
        standard: "Parser, model, diagram, and table as independent modules"

  NFR-060:
    parent: []
    category: availability
    name: "Deployment"
    criteria:
      - item: "Frontend"
        standard: "Static SPA (deployable to any static host)"
      - item: "Infrastructure"
        standard: "Docker Compose for PlantUML Server + n8n"
      - item: "Offline mode"
        standard: "Display notification when PlantUML Server or n8n is unreachable"

  NFR-070:
    parent: []
    category: licensing
    name: "License compatibility"
    criteria:
      - item: "Project license"
        standard: "MIT License"
      - item: "Dependencies"
        standard: "Only MIT, Apache-2.0, BSD, ISC, or similarly permissive licenses"
      - item: "Prohibited"
        standard: "GPL, LGPL, AGPL (copyleft incompatible with MIT)"
      - item: "Infrastructure services"
        standard: "GPL/fair-code acceptable for separate Docker services (not bundled)"

  NFR-080:
    parent: [UR-017]
    category: usability
    name: "Multi-participant chat — single-pane operation"
    rationale: |
      UR-017 is implemented via a Slack relay (see SR-132–135 and the
      forthcoming ADR on the relay design). That choice introduces a
      derived risk: the facilitator could end up watching two surfaces
      (ModelLogue + Slack) and translating between them, which breaks
      concentration on the diagram and the AI conversation. The same
      risk exists symmetrically for remote participants — being asked
      to also load ModelLogue would defeat the point of bridging into
      the venue they already use. NFR-080 fixes the quality bar that
      the relay must clear so it actually delivers UR-017 instead of
      just nominally satisfying it.
    criteria:
      - item: "Facilitator single-pane completeness"
        standard: "The facilitator can run a multi-participant review using only the ModelLogue chat pane — every relayed Slack message is surfaced there"
      - item: "Participant single-pane completeness"
        standard: "Remote participants can follow the whole review (facilitator turns + AI replies) using only Slack — every ModelLogue chat turn is surfaced there"
      - item: "Speaker disambiguation"
        standard: "Each surfaced message carries a source identifier (facilitator / AI / Slack participant) that the consumer's UI can render distinguishably"

  NFR-081:
    parent: [UR-017]
    category: performance
    name: "Multi-participant chat — relay latency"
    rationale: |
      For UR-017's multi-participant chat to feel like a live
      conversation, the bridge must surface messages quickly enough
      that participants do not lose the thread. The relay design uses
      polling (see SR-132 and the forthcoming ADR), so Slack →
      ModelLogue picks up the polling interval and Slack's own
      delivery delay; ModelLogue → Slack is push-based and only pays
      network + Slack API cost. NFR-081 sets the latency budget for
      both directions and the failure-mode contract.
    criteria:
      - item: "Slack → ModelLogue surfacing latency"
        standard: "≤ 4 seconds end-to-end from Slack post to appearance in the ModelLogue chat pane"
      - item: "ModelLogue → Slack surfacing latency"
        standard: "≤ 2 seconds from chat send (or AI reply receipt) to appearance in the Slack channel"
      - item: "Relay failure mode"
        standard: "If the relay endpoint is unreachable, the local ModelLogue chat continues to function; failures are logged but do not break the chat pane"
