# ModelLogue Non-Functional Requirements

version: "6.0"
last_updated: "2026-07-04"

requirements:
  NFR-001:
    parent: [UR-001, UR-002]
    category: performance
    name: "Response performance"
    criteria:
      - item: "Source parse + model update"
        standard: "Within 100ms"
      - item: "SVG coordinate extraction"
        standard: "Within 2 seconds (including PlantUML Server round-trip)"
      - item: "State transition table recalculation"
        standard: "Within 100ms"
      - item: "AI first response token"
        standard: "Within 5 seconds (streaming)"
      - item: "UI interaction response"
        standard: "Within 100ms"

  NFR-010:
    parent: [UR-001, UR-002]
    category: usability
    name: "Intuitive operation"
    criteria:
      - item: "Diagram interaction"
        standard: "Pan/zoom/select with mouse"
      - item: "Panel resize"
        standard: "Drag handle for analysis panel"
      - item: "Tab navigation"
        standard: "Single click to switch analysis tabs"

  NFR-011:
    parent: [UR-002]
    category: usability
    name: "Error handling"
    criteria:
      - item: "Parse errors"
        standard: "Display with line number in editor"
      - item: "Connection errors"
        standard: "Display in status bar with service name"
      - item: "Data protection"
        standard: "Last valid state retained on error"

  NFR-020:
    parent: []
    category: compatibility
    name: "Browser compatibility"
    criteria:
      - item: "Primary"
        standard: "Chrome latest version"
      - item: "Secondary"
        standard: "Firefox, Safari, Edge latest versions"
      - item: "Out of scope"
        standard: "Mobile browsers"

  NFR-030:
    parent: []
    category: security
    name: "Security"
    criteria:
      - item: "API keys"
        standard: "Never embedded in frontend; managed by n8n"
      - item: "Input validation"
        standard: "All PlantUML source validated through parser"
      - item: "Injection prevention"
        standard: "No eval(), no Function(), no dangerouslySetInnerHTML with user input"
      - item: "Standards"
        standard: "Follow OWASP Top 10 guidelines"

  NFR-040:
    parent: []
    category: internationalization
    name: "Internationalization"
    criteria:
      - item: "Supported languages"
        standard: "English (EN), Japanese (JA)"
      - item: "UI language switch"
        standard: "User can switch via settings"
      - item: "Default language"
        standard: "Follow browser locale setting"
      - item: "PlantUML keywords"
        standard: "English only (no localization)"
      - item: "State labels"
        standard: "Unicode characters allowed (including Japanese)"

  NFR-050:
    parent: []
    category: maintainability
    name: "Code quality"
    criteria:
      - item: "Type safety"
        standard: "TypeScript strict mode"
      - item: "Testability"
        standard: "Parser and table generator testable independently"
      - item: "Modularity"
        standard: "Parser, model, diagram, and table as independent modules"

  NFR-060:
    parent: []
    category: availability
    name: "Deployment"
    criteria:
      - item: "Frontend"
        standard: "Static SPA (deployable to any static host)"
      - item: "Infrastructure"
        standard: "Docker Compose for PlantUML Server + n8n"
      - item: "Offline mode"
        standard: "Display notification when PlantUML Server or n8n is unreachable"

  NFR-070:
    parent: []
    category: licensing
    name: "License compatibility"
    criteria:
      - item: "Project license"
        standard: "MIT License"
      - item: "Dependencies"
        standard: "Only MIT, Apache-2.0, BSD, ISC, or similarly permissive licenses"
      - item: "Prohibited"
        standard: "GPL, LGPL, AGPL (copyleft incompatible with MIT)"
      - item: "Infrastructure services"
        standard: "GPL/fair-code acceptable for separate Docker services (not bundled)"

  NFR-080:
    parent: [UR-017]
    category: usability
    name: "Multi-participant chat — single-pane operation"
    rationale: |
      UR-017 is implemented via a Slack relay (see SR-132–135 and the
      forthcoming ADR on the relay design). That choice introduces a
      derived risk: the facilitator could end up watching two surfaces
      (ModelLogue + Slack) and translating between them, which breaks
      concentration on the diagram and the AI conversation. The same
      risk exists symmetrically for remote participants — being asked
      to also load ModelLogue would defeat the point of bridging into
      the venue they already use. NFR-080 fixes the quality bar that
      the relay must clear so it actually delivers UR-017 instead of
      just nominally satisfying it.
    criteria:
      - item: "Facilitator single-pane completeness"
        standard: "The facilitator can run a multi-participant review using only the ModelLogue chat pane — every relayed Slack message is surfaced there"
      - item: "Participant single-pane completeness"
        standard: "Remote participants can follow the whole review (facilitator turns + AI replies) using only Slack — every ModelLogue chat turn is surfaced there"
      - item: "Speaker disambiguation"
        standard: "Each surfaced message carries a source identifier (facilitator / AI / Slack participant) that the consumer's UI can render distinguishably"

  NFR-081:
    parent: [UR-017]
    category: performance
    name: "Multi-participant chat — relay latency"
    rationale: |
      For UR-017's multi-participant chat to feel like a live
      conversation, the bridge must surface messages quickly enough
      that participants do not lose the thread. The relay design uses
      polling (see SR-132 and the forthcoming ADR), so Slack →
      ModelLogue picks up the polling interval and Slack's own
      delivery delay; ModelLogue → Slack is push-based and only pays
      network + Slack API cost. NFR-081 sets the latency budget for
      both directions and the failure-mode contract.
    criteria:
      - item: "Slack → ModelLogue surfacing latency"
        standard: "≤ 4 seconds end-to-end from Slack post to appearance in the ModelLogue chat pane"
      - item: "ModelLogue → Slack surfacing latency"
        standard: "≤ 2 seconds from chat send (or AI reply receipt) to appearance in the Slack channel"
      - item: "Relay failure mode"
        standard: "If the relay endpoint is unreachable, the local ModelLogue chat continues to function; failures are logged but do not break the chat pane"

  NFR-090:
    parent: [UR-018]
    category: security
    name: "AI authorization — identity switch, server-enforced"
    rationale: |
      UR-018 gates AI (the only paid, secret-bearing capability)
      behind authentication. This NFR fixes the invariant that makes
      that gate actually safe, because the naive framings are unsafe:

        - The switch must be AUTHENTICATED IDENTITY, not "n8n is
          present / reachable". In a deployment n8n exists and is
          fixed for everyone — operator and anonymous visitors alike
          — so its presence cannot discriminate users. Only "am I the
          authenticated operator?" is a legitimate discriminator.
        - Enforcement must be SERVER-SIDE (the auth gate / n8n).
          Frontend gating (SR-136) is bypassable, so the system's
          safety must not depend on it; the property must hold even
          if the entire frontend is removed.
        - The AI boundary must trust only requests that PASSED THE
          GATE — the origin reachable only through the gate (network
          isolation, or n8n verifying the gate's signed assertion) —
          never a client-set "authenticated" claim; and no operator
          secret is embedded in the SPA build (the SPA's JS is public
          and any bearer could extract it).

      Net effect: the Gemini API key and its per-call cost are
      protected from anonymous abuse. Extends NFR-030 (Security) for
      the AI relay path. Realised by SR-136 (insurance) + SR-137
      (boundary / origin isolation) + SR-138 (the gate).
    criteria:
      - item: "Switch basis"
        standard: "AI availability is decided by authenticated identity, never by whether n8n is configured or reachable"
      - item: "Enforcement location"
        standard: "Rejection of unauthenticated AI requests happens server-side (n8n / in-stack proxy) and holds even if the entire frontend is removed"
      - item: "Boundary integrity"
        standard: "The AI boundary accepts only requests that passed the gate (origin reachable only through the gate); a client-set 'authenticated' claim or an SPA-embedded static secret is not accepted"
      - item: "Cost protection"
        standard: "No Gemini call is made on behalf of an unauthenticated request"

  NFR-091:
    parent: [UR-018]
    category: maintainability
    name: "Auth boundary — simple now, changeable later"
    rationale: |
      The operator's requirements for the AI gate are only three:
      safe, simple, and easy to change later. Safety is NFR-090;
      this NFR fixes SIMPLE and CHANGEABLE. The operator does not
      build or own the auth. The AI boundary is a provider-agnostic
      forward-auth seam (SR-138): n8n requires only that an
      authenticated request reached the seam, so the front-piece is
      swappable. For the beta the simplest safe realisation is
      chosen — a managed access gate with nothing to build.
      Self-hosting the gate (e.g. oauth2-proxy / Authelia / a site's
      own OIDC / corporate SSO) is one of the changes the seam
      permits, not a launch requirement. Extends NFR-060
      (Deployment). Realised by SR-138 (the seam + managed gate) +
      SR-139 (change-friendly topology).
    criteria:
      - item: "Simple to stand up"
        standard: "The beta gate requires no bespoke auth code — a managed access gate plus an allowlist of the operator, TLS included"
      - item: "Provider replaceable"
        standard: "The gate provider can be swapped (managed → self-hosted forward-auth / OIDC / corporate SSO) without changing the seam contract the AI boundary relies on, and without rebuilding the SPA — often configuration-only"
      - item: "Stable seam"
        standard: "The AI boundary depends only on 'an authenticated request reached the seam', not on any specific provider's specifics beyond the seam"
      - item: "Deploy portability"
        standard: "The SPA deploys to a different host by changing only a small env / the domain (no per-host rebuild); a static host MAY front the SPA but is not required"

  NFR-092:
    parent: [UR-009]
    category: performance
    name: "PWA is performance-neutral and always fresh"
    rationale: |
      Adding a service worker (SR-143) must neither slow the app down nor
      hide new deploys behind a stale cache. The service worker only
      precaches the static shell (which makes repeat startup faster) and
      passes server calls straight through, so the heavy operations
      (diagram rendering, AI, N-switch) see no added latency. Freshness and
      the identity gate are preserved by keeping the API / auth / render
      paths out of the cache and by auto-updating the shell on each deploy.
    criteria:
      - item: "No runtime slowdown"
        standard: "Server-backed requests (/plantuml, /n8n, /nswitch, /auth) are network-only pass-throughs; the service worker adds no measurable latency to them"
      - item: "Faster repeat startup"
        standard: "On a return visit the app shell is served from the service-worker cache rather than re-fetched from the network"
      - item: "No stale build"
        standard: "A new deploy is adopted automatically (autoUpdate); an installed or open client is never left on an old build without a manual cache clear"
      - item: "Cache never weakens the gate"
        standard: "No gated or dynamic response (/n8n, /auth, /plantuml, /nswitch) is ever served from cache, so the identity gate (NFR-090 / SR-137) and data freshness are unaffected"
      - item: "Progressive enhancement"
        standard: "With no service worker or on an unsupporting browser, behaviour and performance are identical to the non-PWA app"
