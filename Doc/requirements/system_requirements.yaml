# ModelLogue System Requirements
# Format: Verb + Object (Value Engineering - Miles function analysis)
# Subject is always the artifact (component/system), omitted by convention.
# Rule scenarios: Context → Action → Outcome (not Gherkin)

version: "6.0"
last_updated: "2026-04-08"

# =============================================================================
# PlantUML Subset Grammar
# =============================================================================
# Supported PlantUML state diagram syntax (simplified subset):
#   @startuml / @enduml
#   [*] --> StateName             (initial transition)
#   StateName --> [*]             (final transition)
#   StateName --> StateName : event [guard] / action
#   state "Display Name" as alias
#   state CompositeName {         (composite state, ONE level only)
#     [*] --> ChildState          (internal initial transition)
#     ChildState --> ChildState : event
#   }
#   CompositeName --> AnyState : event   (group escape transition)
#   AnyState --> CompositeName : event   (entry to composite's internal default)
#
# NOT supported (out of scope; rejected as syntax errors):
#   Styling, colors, notes
#   Nested-of-nested composite states (composite inside composite)
#   Orthogonal regions (concurrency: --)
#   History pseudo-states ([H], [H*])
#   Dot-notation entry to a specific child (CompositeName.ChildState)
#   Entry/exit point pseudo-states
#
# See ADR-009 for the rationale behind this minimal composite-state subset.

# =============================================================================
# Source Editing
# =============================================================================

source_editing:
  SR-001:
    function: "Render PlantUML editor with syntax highlighting"
    parent: [UR-002, UR-009]
    component: PlantUmlEditor
    acceptance_criteria:
      - "Display code editor with PlantUML syntax highlighting"
      - "Emit source change events on user input"
      - "Support paste from clipboard"
      - "Accept PlantUML source loaded from outside the system (e.g. via clipboard or future load mechanism) as the entry point for a review session"

  SR-002:
    function: "Parse PlantUML subset into state machine model"
    parent: [UR-001, UR-002, UR-003, UR-009]
    component: StateMachineParser
    acceptance_criteria:
      - "Parse states (including initial [*] and final [*])"
      - "Parse transitions with optional event, guard, and action"
      - "Parse state aliases (state \"Display Name\" as alias)"
      - "Parse composite states with one level of nesting (state X { ... })"
      - "Track parent-child relationships in the StateMachineModel"
      - "Recognize composite-level transitions as group escape (source = composite name)"
      - "Recognize the internal initial transition ([*] --> Child) inside a composite"
      - "Build StateMachineModel (states with parentId, events, transitions)"
      - "Report syntax errors with line numbers"
    rules:
      - context: "Source contains syntax error"
        action: "User edits source"
        outcome: "Error message with line number displayed; last valid model retained"
      - context: "Source is valid"
        action: "User edits source"
        outcome: "Model updated after 500ms debounce"
      - context: "Source contains a nested composite state (state X { state Y { ... } })"
        action: "Parser encounters the second-level composite"
        outcome: "Syntax error reported; the construct is not in the supported subset (ADR-009)"
      - context: "Source contains an orthogonal region (composite with -- separator)"
        action: "Parser encounters the separator"
        outcome: "Syntax error reported; orthogonal regions are not supported (ADR-009)"
      - context: "Source contains a history pseudo-state ([H] or [H*])"
        action: "Parser encounters the history marker"
        outcome: "Syntax error reported; history pseudo-states are not supported (ADR-009)"
      - context: "Source contains dot-notation entry (Composite.Child)"
        action: "Parser encounters the dot-notation reference"
        outcome: "Syntax error reported; dot-notation entry is not supported (ADR-009)"

  SR-003:
    function: "Serialize state machine model to PlantUML source"
    parent: [UR-006]
    component: StateMachineSerializer
    acceptance_criteria:
      - "Convert StateMachineModel back to valid PlantUML source"
      - "Preserve event, guard, and action on transitions"
      - "Round-trip: parse → serialize produces equivalent source"

# =============================================================================
# Diagram Display
# =============================================================================
# PlantUML SVG is displayed directly with pan and zoom.
# A separate marker overlay layer holds the review markers.
# No third-party whiteboard framework: a small native SVG layer is enough.

diagram_display:
  SR-010:
    function: "Display PlantUML SVG with pan and zoom"
    parent: [UR-001]
    component: DiagramView
    acceptance_criteria:
      - "Fetch SVG from PlantUML Server (Deflate + Base64 encoding)"
      - "Display SVG as-is, preserving PlantUML's layout and edge routing"
      - "Mouse wheel to zoom"
      - "Mouse drag (on empty area) to pan"
      - "Fit-to-view button"
      - "SVG updates when PlantUML source changes (500ms debounce)"
    rules:
      - context: "PlantUML Server is unreachable"
        action: "Source is edited"
        outcome: "Connection error displayed in status bar; last known SVG retained"

  SR-011:
    function: "Extract element coordinates from PlantUML SVG"
    parent: [UR-001, UR-004]
    component: SvgCoordinateExtractor
    acceptance_criteria:
      - "Parse SVG to extract state positions (x, y, width, height)"
      - "Map SVG elements to StateMachineModel states by text content"
      - "Coordinate map is shared with the AI as context (model side of the marker context)"

  SR-012:
    function: "Provide marker tool selection"
    parent: [UR-004]
    component: MarkerToolbar
    acceptance_criteria:
      - "Toolbar offers three tools: ellipse, rectangle, arrow"
      - "Active tool is visually highlighted"
      - "Default tool is ellipse"

  SR-013:
    function: "Draw marker by drag"
    parent: [UR-004]
    component: MarkerOverlay
    acceptance_criteria:
      - "Drag on the diagram with active tool to create a marker"
      - "Ellipse and rectangle take the dragged bounding box"
      - "Arrow takes the drag start as tail and drag end as head"
      - "New marker is assigned an unused color from the palette"
      - "Marker is added to MarkerStore on drag end"
    rules:
      - context: "All four palette colors are already in use"
        action: "User attempts to draw a new marker"
        outcome: "No marker is created; a toast error explains the limit"

  SR-014:
    function: "Manage marker colors from a fixed palette"
    parent: [UR-004]
    component: MarkerStore
    acceptance_criteria:
      - "Palette contains four colors: red, blue, green, purple"
      - "New markers are assigned an unused color (no two markers share a color)"
      - "When a marker is removed, its color becomes available again"
      - "Reject creation when all colors are in use"

  SR-015:
    function: "Select, move, and resize markers"
    parent: [UR-004]
    component: MarkerOverlay
    acceptance_criteria:
      - "Click a marker to select it"
      - "Selected marker shows handles for resize / endpoint adjustment"
      - "Drag the marker body to move it"
      - "Drag a handle to resize an ellipse/rectangle or move an arrow endpoint"
      - "Click on empty area or another marker to change selection"

  SR-016:
    function: "Delete marker"
    parent: [UR-004]
    component: MarkerOverlay
    acceptance_criteria:
      - "Press Delete or Backspace while a marker is selected to remove it"
      - "Right-click a marker to open a context menu with a Delete item"
      - "Removed colors return to the palette pool"

  SR-017:
    function: "Render marker overlay over the SVG"
    parent: [UR-004]
    component: MarkerOverlay
    acceptance_criteria:
      - "Markers are drawn in their assigned color on a layer above the PlantUML SVG"
      - "Marker geometry is stored in SVG coordinate space so it stays aligned during pan/zoom"
      - "Each marker has a stable id (used by future features such as AI-driven highlight)"

# =============================================================================
# State Transition Table
# =============================================================================

state_transition_table:
  SR-020:
    function: "Generate State×Event matrix in hybrid (layered) form"
    parent: [UR-003]
    component: StateEventMatrix
    acceptance_criteria:
      - "Rows include both composite states and their child states (hybrid pattern, per industry convention and ISO/IEC/IEEE 29119-4)"
      - "Initial/final pseudo-states are excluded from rows"
      - "Columns: events (deduplicated from all transitions)"
      - "Composite-state rows hold group-escape transitions (transitions whose source is the composite itself)"
      - "Child-state rows hold the transitions internal to the composite, plus any transitions from that specific child"
      - "Child rows are visually indented under their parent row"
      - "Cell value: next state name (or empty if no transition)"
      - "Recalculate reactively when model changes"
    rules:
      - context: "Transition has guard condition"
        action: "Matrix is generated"
        outcome: "Cell shows next state with guard annotation"
      - context: "Multiple transitions from same state on same event (different guards)"
        action: "Matrix is generated"
        outcome: "Cell shows all possible next states with their guards"
      - context: "Composite state has a group-escape transition (e.g. CompositeName --> SomeOtherState : event)"
        action: "Matrix is generated"
        outcome: "The transition is shown on the composite-state row, not on each child row, so the DRY benefit of composite states is reflected in the matrix"
      - context: "There are no composite states in the model"
        action: "Matrix is generated"
        outcome: "The matrix is effectively flat — only normal-state rows are present"

  SR-021:
    function: "Generate PreState×PostState matrix in hybrid (layered) form"
    parent: [UR-003]
    component: StateStateMatrix
    acceptance_criteria:
      - "Rows and columns include both composite states and their child states (hybrid pattern)"
      - "Composite states appear as both row headers and column headers, in addition to their child states"
      - "Child rows/columns are visually indented under their parent"
      - "Cell value: event name(s) for the direct transition between source and target, or empty"
      - "Group-escape transitions appear in the composite-state row"
      - "Entry transitions targeting a composite appear in the composite-state column"
      - "Recalculate reactively when model changes"
    rules:
      - context: "Multiple events between same state pair"
        action: "Matrix is generated"
        outcome: "Cell shows all events separated by comma"
      - context: "Transition targets a composite state (entry to its internal default)"
        action: "Matrix is generated"
        outcome: "Cell appears in the composite-state column, not duplicated to each child"

  SR-022:
    function: "Provide marker context to AI"
    parent: [UR-004, UR-005]
    component: MarkerStore, ChatPanel
    acceptance_criteria:
      - "AI chat requests include the current marker list (id, type, color, geometry)"
      - "AI chat requests include the model element coordinate map (SR-011)"
      - "AI is expected to interpret which model elements each marker is pointing at, and ask the reviewer to clarify if it is ambiguous"

# =============================================================================
# AI Chat (n8n relay)
# =============================================================================

ai_chat:
  SR-030:
    function: "Send chat message to AI via n8n"
    parent: [UR-005]
    component: N8nService
    acceptance_criteria:
      - "POST to n8n webhook with current PlantUML source as context"
      - "Include conversation history in request"
      - "Stream response tokens via SSE"
      - "Handle n8n/API errors gracefully"

  SR-031:
    function: "Render chat message list"
    parent: [UR-005]
    component: MessageList
    acceptance_criteria:
      - "Display user and AI messages with distinct styles"
      - "Display timestamp on each message"
      - "Auto-scroll to latest message"

  SR-032:
    function: "Extract PlantUML source from AI response"
    parent: [UR-006]
    component: "n8n workflow"
    acceptance_criteria:
      - "Detect ```plantuml code blocks in AI response"
      - "Extract complete PlantUML source from code block"
      - "Return structured JSON with text and suggestedSource fields"

  SR-033:
    function: "Display source diff for AI proposals"
    parent: [UR-006]
    component: SourceDiffView
    acceptance_criteria:
      - "Show visual diff between current and proposed source"
      - "Highlight added, removed, and changed lines"
      - "Display Apply button alongside the diff"

  SR-034:
    function: "Apply proposed source modification"
    parent: [UR-006]
    component: SessionStore
    acceptance_criteria:
      - "Replace current source with proposed source"
      - "Record snapshot in source history"
      - "Mark the ChatMessage as applied"
      - "Trigger model re-parse, diagram re-render, table re-calculate"

  SR-035:
    function: "Undo source modification"
    parent: [UR-006]
    component: SessionStore
    acceptance_criteria:
      - "Restore previous source from history"
      - "Trigger model re-parse, diagram re-render, table re-calculate"
      - "Disable undo when no history exists"

# =============================================================================
# Session Management
# =============================================================================

session_management:
  SR-040:
    function: "Manage session state in browser memory"
    parent: [UR-002, UR-005, UR-007, UR-010]
    component: SessionStore
    acceptance_criteria:
      - "Initialize session with unique ID and timestamp"
      - "Store current PlantUML source"
      - "Maintain source change history"
      - "Hold the session outcome (consensus, postponed, requirement-spec issue) when set by the user"
      - "Session data is volatile (browser memory only)"

  SR-041:
    function: "Export session as JSON"
    parent: [UR-007, UR-010]
    component: ExportService
    acceptance_criteria:
      - "Serialize session (source + messages + source history + outcome + metadata)"
      - "Include the recorded session outcome so downstream workflows can act on it (per ADR-008, the actual notifications/integrations are composed in n8n outside ModelLogue)"
      - "Trigger browser file download with timestamped filename"

# =============================================================================
# Grammar Display
# =============================================================================

grammar_display:
  SR-050:
    function: "Display PlantUML subset grammar"
    parent: [UR-008]
    component: EbnfView
    acceptance_criteria:
      - "Display EBNF grammar for supported state diagram subset"
      - "Grammar is a static file (not LLM-generated)"
      - "Syntax highlighting for EBNF notation"

# =============================================================================
# Infrastructure
# =============================================================================

infrastructure:
  SR-060:
    function: "Check PlantUML Server health"
    parent: [UR-001]
    component: PlantUmlService
    acceptance_criteria:
      - "Send health check request to PlantUML Server"
      - "Display connection status in status bar"

  SR-061:
    function: "Check n8n connectivity"
    parent: [UR-005]
    component: N8nService
    acceptance_criteria:
      - "Send health check request to n8n webhook endpoint"
      - "Display n8n connection status in status bar"

# =============================================================================
# UI Layout
# =============================================================================
# ┌──────────────────────────────────┬──────────────┐
# │  Diagram View                    │  Chat/Review  │
# │  (PlantUML SVG + marker overlay) │  Panel        │
# │  [Marker tools: ⬭ ▭ ⇢]           │              │
# ├── drag to resize ────────────────┤              │
# │  ▲ Analysis Panel [tabs]        │              │
# │  [Source|StateEvent|StateState|EBNF]            │
# ├──────────────────────────────────┴──────────────┤
# │  Status Bar                                      │
# └──────────────────────────────────────────────────┘

ui_layout:
  SR-070:
    function: "Render state machine diagram as primary view"
    parent: [UR-001]
    component: DiagramView
    acceptance_criteria:
      - "Diagram occupies the main screen area (center, largest)"
      - "Diagram area resizes when analysis panel resizes"
      - "Diagram area maximizes when analysis panel is collapsed"

  SR-071:
    function: "Render resizable analysis panel with tabs"
    parent: [UR-002, UR-003, UR-008]
    component: AnalysisPanel
    acceptance_criteria:
      - "Bottom pull-up panel with tab navigation"
      - "Source tab: PlantUML editor (SR-001)"
      - "State×Event tab: state transition matrix (SR-020)"
      - "State×State tab: pre/post state matrix (SR-021)"
      - "EBNF tab: grammar display (SR-050)"
      - "Vertically resizable via drag handle"
      - "Collapsible to maximize diagram area"

  SR-072:
    function: "Render chat panel"
    parent: [UR-005, UR-006]
    component: ChatPanel
    acceptance_criteria:
      - "Right side panel spanning full height"
      - "Contains message list (SR-031)"
      - "Contains chat input field"
      - "Contains source diff view when AI proposes changes (SR-033)"

# =============================================================================
# Data Model
# =============================================================================

data_model:
  StateMachineModel:
    description: "Canonical representation of a state machine parsed from PlantUML source"
    fields:
      - name: states
        type: "State[]"
        description: "All states including initial/final pseudo-states"
      - name: transitions
        type: "Transition[]"
        description: "All transitions between states"
      - name: events
        type: "string[]"
        description: "Deduplicated list of all event names"

  State:
    fields:
      - name: id
        type: string
        description: "Unique identifier (PlantUML name or alias)"
      - name: label
        type: string
        description: "Display name (from state \"name\" as alias, or id)"
      - name: type
        type: "'normal' | 'composite' | 'initial' | 'final'"
        description: "'composite' is a state that contains child states (one level only, per ADR-009)"
      - name: parentId
        type: "string | null"
        description: "Id of the enclosing composite state, or null for top-level states"

  Transition:
    fields:
      - name: sourceStateId
        type: string
      - name: targetStateId
        type: string
      - name: event
        type: "string | null"
      - name: guard
        type: "string | null"
      - name: action
        type: "string | null"

  ReviewSession:
    fields:
      - name: id
        type: string
      - name: name
        type: string
      - name: createdAt
        type: "string (ISO 8601)"
      - name: updatedAt
        type: "string (ISO 8601)"
      - name: plantUmlSource
        type: string
      - name: messages
        type: "ChatMessage[]"
      - name: sourceHistory
        type: "SourceSnapshot[]"
      - name: markers
        type: "Marker[]"
      - name: outcome
        type: "SessionOutcome | null"
        description: "Set when the review session is closed (UR-010); null while the session is open"

  SessionOutcome:
    description: "How a review session ended; downstream workflows in n8n act on this (per ADR-008)"
    fields:
      - name: status
        type: "'consensus' | 'postponed' | 'spec_issue'"
        description: "consensus: agreement reached; postponed: changes pending; spec_issue: upstream requirement problem"
      - name: closedAt
        type: "string (ISO 8601)"
      - name: note
        type: "string | null"
        description: "Free-form note explaining the outcome"

  Marker:
    description: "A review marker drawn by the user on top of the diagram"
    fields:
      - name: id
        type: string
        description: "Stable id, used by future features (e.g. AI-driven highlight)"
      - name: type
        type: "'ellipse' | 'rectangle' | 'arrow'"
      - name: color
        type: "'red' | 'blue' | 'green' | 'purple'"
      - name: geometry
        type: "EllipseGeometry | RectangleGeometry | ArrowGeometry"
        description: "Coordinates in the SVG coordinate space (so the marker stays aligned during pan/zoom)"

  EllipseGeometry:
    fields:
      - name: cx
        type: number
      - name: cy
        type: number
      - name: rx
        type: number
      - name: ry
        type: number

  RectangleGeometry:
    fields:
      - name: x
        type: number
      - name: y
        type: number
      - name: width
        type: number
      - name: height
        type: number

  ArrowGeometry:
    fields:
      - name: x1
        type: number
      - name: y1
        type: number
      - name: x2
        type: number
      - name: y2
        type: number

# =============================================================================
# External Interfaces
# =============================================================================

external_interfaces:
  plantuml_server:
    endpoint: "http://localhost:8080/svg/{encoded}"
    method: GET
    input: "PlantUML source encoded with Deflate + Base64"
    output: "SVG image (displayed directly with pan/zoom + used for coordinate extraction)"

  n8n_chat_webhook:
    endpoint: "{n8n_base_url}/webhook/modellogue-chat"
    method: POST
    input: "Current PlantUML source + conversation history + user message"
    output: "AI text response (streaming via SSE)"
    note: "n8n internally calls Gemini API; API key managed on n8n side"

