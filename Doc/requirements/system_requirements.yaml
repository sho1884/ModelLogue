# =============================================================================
# PlantUML Subset Grammar
# =============================================================================
# Supported PlantUML state diagram syntax (simplified subset):
#   @startuml / @enduml
#   [*] --> StateName             (initial transition)
#   StateName --> [*]             (final transition)
#   StateName --> StateName : event [guard] / action
#   state "Display Name" as alias
#   state CompositeName {         (composite state, ONE level only)
#     [*] --> ChildState          (internal initial transition)
#     ChildState --> ChildState : event
#   }
#   CompositeName --> AnyState : event   (group escape transition)
#   AnyState --> CompositeName : event   (entry to composite's internal default)
#
# NOT supported (out of scope; rejected as syntax errors):
#   Styling, colors, notes
#   Nested-of-nested composite states (composite inside composite)
#   Orthogonal regions (concurrency: --)
#   History pseudo-states ([H], [H*])
#   Dot-notation entry to a specific child (CompositeName.ChildState)
#   Entry/exit point pseudo-states
#
# See ADR-009 for the rationale behind this minimal composite-state subset.

# =============================================================================
# Source Editing
# =============================================================================

source_editing:
  SR-001:
    function: "Display PlantUML source (read-only during review; editable while seeding until a parseable model exists)"
    parent: [UR-002, UR-009]
    component: SourceView
    status: implemented
    acceptance_criteria:
      - "Render PlantUML source with syntax highlighting"
      - "Lock model: the editor is editable while the session is in the SEED phase, read-only once it has entered the REVIEW phase"
      - "REVIEW phase is entered the first time a PARSEABLE model with at least one real state has been established (via seed paste, Generate model, Apply of an AI proposal, or Open-saved-review import). Empty / whitespace-only input does NOT count, so the editor is editable from session start"
      - "Until then, the user may freely edit, paste, and re-paste — invalid PlantUML never traps them"
      - "Once in REVIEW phase the lock is permanent for that session: changes come exclusively through AI-proposal Apply, so every change is captured in the dialogue log"
      - "Parse errors during seed are shown inline (line + message) so the user can fix and try again"
      - "Support copy-to-clipboard and select-all on the displayed source even when read-only"
    rules:
      - context: "Session is in SEED phase, source is empty"
        action: "User pastes a valid PlantUML source"
        outcome: "Source is accepted; parse succeeds → REVIEW phase starts and the editor locks"
      - context: "Session is in SEED phase"
        action: "User pastes PlantUML source that fails to parse"
        outcome: "Parse errors are displayed; the editor stays editable so the user can fix or replace it; the session remains in SEED phase"
      - context: "Session is in REVIEW phase"
        action: "User tries to type in the source area"
        outcome: "Input is ignored; a hint explains that model edits happen via chat"
    notes: |
      Direct source editing during REVIEW was removed in v7.1 because
      unlogged edits break the Dialogue-as-Asset property of the
      session. v7.2 fixes the seed-phase trap: invalid PlantUML used
      to lock the editor with no escape; now the lock only fires on a
      successful parse.

  SR-002:
    function: "Parse PlantUML subset into state machine model"
    parent: [UR-001, UR-002, UR-003, UR-009]
    component: StateMachineParser
    status: implemented
    acceptance_criteria:
      - "Parse states (including initial [*] and final [*])"
      - "Parse transitions with optional event, guard, and action"
      - "Parse state aliases (state \"Display Name\" as alias)"
      - "Parse composite states with one level of nesting (state X { ... })"
      - "Track parent-child relationships in the StateMachineModel"
      - "Recognize composite-level transitions as group escape (source = composite name)"
      - "Recognize the internal initial transition ([*] --> Child) inside a composite"
      - "Strip inline comments (' comment) before parsing; quotes inside \"...\" string literals are preserved"
      - "Skip full-line comments (lines starting with ' or #)"
      - "Silently skip non-semantic PlantUML directives that do not affect the state-machine model, so AI-generated proposals are not rejected over presentation hints the subset doesn't use. Tolerated prefixes (case-insensitive): hide / show / skinparam / !theme / !pragma / !include / !define / scale / title / caption / header / footer / mainframe / legend / end legend / note / end note / left to right direction / top to bottom direction. ADR-009's hard rejections (history, orthogonal regions, dot-notation entry, nested composites) remain errors"
      - "Build StateMachineModel (states with parentId, events, transitions)"
      - "Report syntax errors with line numbers"
    rules:
      - context: "Source contains syntax error"
        action: "User edits source"
        outcome: "Error message with line number displayed; last valid model retained"
      - context: "Source is valid"
        action: "User edits source"
        outcome: "Model updated after 500ms debounce"
      - context: "Line has an inline comment after real code (Foo --> Bar ' note)"
        action: "Parser processes the line"
        outcome: "The comment is stripped; the code portion is parsed normally"
      - context: "Source contains a nested composite state (state X { state Y { ... } })"
        action: "Parser encounters the second-level composite"
        outcome: "Syntax error reported; the construct is not in the supported subset (ADR-009)"
      - context: "Source contains an orthogonal region (composite with -- separator)"
        action: "Parser encounters the separator"
        outcome: "Syntax error reported; orthogonal regions are not supported (ADR-009)"
      - context: "Source contains a history pseudo-state ([H] or [H*])"
        action: "Parser encounters the history marker"
        outcome: "Syntax error reported; history pseudo-states are not supported (ADR-009)"
      - context: "Source contains dot-notation entry (Composite.Child)"
        action: "Parser encounters the dot-notation reference"
        outcome: "Syntax error reported; dot-notation entry is not supported (ADR-009)"

  SR-003:
    function: "Serialize state machine model to PlantUML source"
    parent: [UR-006]
    component: StateMachineSerializer
    status: removed
    removed_reason: |
      Not needed. Undo is implemented by restoring full-source snapshots
      from SessionStore.sourceHistory, so round-trip serialization was
      never required. If a future feature needs to synthesize PlantUML
      from a model (e.g., model-first editing tools), resurrect this SR.
    acceptance_criteria: []

# =============================================================================
# Diagram Display
# =============================================================================
# PlantUML SVG is displayed directly with pan and zoom.
# A separate marker overlay layer holds the review markers.
# No third-party whiteboard framework: a small native SVG layer is enough.

diagram_display:
  SR-010:
    function: "Display PlantUML SVG with pan and zoom"
    parent: [UR-001]
    component: DiagramView
    status: implemented
    acceptance_criteria:
      - "Fetch SVG from PlantUML Server (Deflate + Base64 encoding)"
      - "Display SVG as-is, preserving PlantUML's layout and edge routing"
      - "Mouse wheel to zoom"
      - "Mouse drag (on empty area) to pan"
      - "Fit-to-view button"
      - "SVG updates when PlantUML source changes (500ms debounce)"
    rules:
      - context: "PlantUML Server is unreachable"
        action: "Source is edited"
        outcome: "Connection error displayed in status bar; last known SVG retained"

  SR-011:
    function: "Extract element coordinates from PlantUML SVG"
    parent: [UR-001, UR-004]
    component: SvgCoordinateExtractor
    status: implemented
    acceptance_criteria:
      - "Parse SVG to extract state positions (x, y, width, height) in the SVG's user-coordinate (viewBox) space"
      - "Correctly handle PlantUML's `<g transform=\"translate(...)\">` wrappers — a node's position is the composition of its ancestors' transforms, not the raw x/y attribute on the shape. Implemented by inserting the SVG off-screen in the live DOM (position: absolute, negative offsets, visibility: hidden — but NOT width/height: 0, which collapsed layout and returned empty bounding boxes) and reading getBoundingClientRect + SVGSVGElement.getScreenCTM().inverse() so the browser composes every transform kind (translate / scale / rotate / matrix) for us. Any `<?xml ... ?>` or `<!DOCTYPE ...>` prelude is stripped before assigning to innerHTML so the SVG namespace resolves correctly. Consequence: cannot be unit-tested in node-only environments (getBoundingClientRect/getScreenCTM need a real layout engine); correctness is verified in the browser"
      - "Map SVG elements to StateMachineModel states by text content"
      - "Coordinate map is shared with the AI as context (model side of the marker context) and drives the diff overlay positions in SR-033"

  SR-012:
    function: "Provide diagram tool selection"
    parent: [UR-001, UR-004]
    component: MarkerToolbar
    status: implemented
    acceptance_criteria:
      - "Toolbar offers five tools: select, pan, ellipse, rectangle, arrow"
      - "Active tool is visually highlighted"
      - "Default tool on session start is PAN. Rationale: at session start there are no markers to select, so starting in select mode leaves the user with no useful action"
      - "Pan lets the user drag the canvas around; the other drawing tools create markers; select activates hit-testing on existing markers"

  SR-013:
    function: "Draw marker by drag"
    parent: [UR-004]
    component: MarkerOverlay
    status: implemented
    acceptance_criteria:
      - "Drag on the diagram with an active marker tool (ellipse, rectangle, arrow) to create a marker"
      - "Ellipse and rectangle take the dragged bounding box"
      - "Arrow takes the drag start as tail and drag end as head"
      - "New marker is assigned an unused color from the palette"
      - "Marker is added to MarkerStore on drag end"
    rules:
      - context: "All four palette colors are already in use"
        action: "User attempts to draw a new marker"
        outcome: "No marker is created; a toast error explains the limit"

  SR-014:
    function: "Manage marker colors from a fixed palette"
    parent: [UR-004]
    component: MarkerStore
    status: implemented
    acceptance_criteria:
      - "Palette contains four colors: red, blue, green, purple"
      - "New markers are assigned an unused color (no two markers share a color)"
      - "When a marker is removed, its color becomes available again"
      - "Reject creation when all colors are in use"

  SR-015:
    function: "Select, move, and resize markers"
    parent: [UR-004]
    component: MarkerOverlay
    status: implemented
    acceptance_criteria:
      - "Click a marker to select it"
      - "Selected marker shows handles for resize / endpoint adjustment"
      - "Drag the marker body to move it"
      - "Drag a handle to resize an ellipse/rectangle or move an arrow endpoint"
      - "Click on empty area or another marker to change selection"

  SR-016:
    function: "Delete marker"
    parent: [UR-004]
    component: MarkerOverlay
    status: implemented
    acceptance_criteria:
      - "Press Delete or Backspace while a marker is selected to remove it"
      - "Right-click a marker to open a context menu with a Delete item"
      - "Removed colors return to the palette pool"

  SR-017:
    function: "Render marker overlay over the SVG"
    parent: [UR-004]
    component: MarkerOverlay
    status: implemented
    acceptance_criteria:
      - "Markers are drawn in their assigned color on a layer above the PlantUML SVG"
      - "Marker geometry is stored in SVG coordinate space so it stays aligned during pan/zoom"
      - "Each marker has a stable id (used by future features such as AI-driven highlight)"

# =============================================================================
# State Transition Table
# =============================================================================

state_transition_table:
  SR-020:
    function: "Generate State×Event matrix in hybrid (layered) form"
    parent: [UR-003]
    component: StateEventMatrix
    status: implemented
    acceptance_criteria:
      - "Rows include both composite states and their child states (hybrid pattern, per industry convention and ISO/IEC/IEEE 29119-4)"
      - "Initial/final pseudo-states are excluded from rows"
      - "Columns: events (deduplicated from all transitions)"
      - "Composite-state rows hold group-escape transitions (transitions whose source is the composite itself)"
      - "Child-state rows hold the transitions internal to the composite, plus any transitions from that specific child"
      - "Child rows are visually indented under their parent row"
      - "Cell value: next state name (or empty if no transition)"
      - "Recalculate reactively when model changes"
    rules:
      - context: "Transition has guard condition"
        action: "Matrix is generated"
        outcome: "Cell shows next state with guard annotation"
      - context: "Multiple transitions from same state on same event (different guards)"
        action: "Matrix is generated"
        outcome: "Cell shows all possible next states with their guards"
      - context: "Composite state has a group-escape transition (e.g. CompositeName --> SomeOtherState : event)"
        action: "Matrix is generated"
        outcome: "The transition is shown on the composite-state row, not on each child row, so the DRY benefit of composite states is reflected in the matrix"
      - context: "There are no composite states in the model"
        action: "Matrix is generated"
        outcome: "The matrix is effectively flat — only normal-state rows are present"

  SR-021:
    function: "Generate PreState×PostState matrix in hybrid (layered) form"
    parent: [UR-003]
    component: StateStateMatrix
    status: implemented
    acceptance_criteria:
      - "Rows and columns include both composite states and their child states (hybrid pattern)"
      - "Composite states appear as both row headers and column headers, in addition to their child states"
      - "Child rows/columns are visually indented under their parent"
      - "Cell value: event name(s) for the direct transition between source and target, or empty"
      - "Group-escape transitions appear in the composite-state row"
      - "Entry transitions targeting a composite appear in the composite-state column"
      - "Recalculate reactively when model changes"
    rules:
      - context: "Multiple events between same state pair"
        action: "Matrix is generated"
        outcome: "Cell shows all events separated by comma"
      - context: "Transition targets a composite state (entry to its internal default)"
        action: "Matrix is generated"
        outcome: "Cell appears in the composite-state column, not duplicated to each child"

  SR-022:
    function: "Provide marker and grammar context to AI"
    parent: [UR-004, UR-005, UR-008]
    component: MarkerStore, ChatPanel, markerContext service
    status: implemented
    acceptance_criteria:
      - "AI chat requests include the current marker list (id, type, color, geometry)"
      - "AI chat requests include the model element coordinate map (SR-011)"
      - "AI chat requests include the EBNF grammar spec so the AI's generated PlantUML conforms to the supported subset"
      - "AI is expected to interpret which model elements each marker is pointing at, and ask the reviewer to clarify if it is ambiguous"

# =============================================================================
# AI Chat (n8n relay)
# =============================================================================

ai_chat:
  SR-030:
    function: "Send chat message to AI via n8n"
    parent: [UR-005]
    component: N8nService
    status: implemented
    acceptance_criteria:
      - "POST to n8n webhook with current PlantUML source as context"
      - "Include conversation history, marker context, and grammar spec in request"
      - "Include requirementsText in the request when it is non-empty (SR-080), so the AI can keep generated/proposed models aligned with the original intent"
      - "Include responseLanguage in the request — derived from the requirements text if present (CJK characters → 'ja', else 'en'), otherwise from the user's first message; the n8n system prompt instructs the AI to respond consistently in that language and never mix languages within a single response"
      - "Receive a single JSON response (non-streaming in phase 1)"
      - "Handle n8n/API errors gracefully — empty bodies and non-JSON bodies surface as actionable messages, not as 'Unexpected end of JSON input'"
      - "Retry once with a short backoff on transient upstream errors (network failure, HTTP 502/503/504); the second failure is surfaced to the user. Combined with n8n's own Retry-On-Fail this absorbs most Gemini capacity blips without a manual re-send"
      - "Auto-reask on parse failure: if the assistant's suggestedSource fails to parse against the supported subset (after SR-002's tolerance rules), automatically post a follow-up USER message quoting the parse errors and re-send to the AI. Cap at 2 auto-retries per original user ask; after that, leave the last unparseable proposal visible and let the user handle it manually. Each retry is a visible user+assistant exchange in the chat log so the dialogue asset captures exactly what happened"
    notes: |
      The actual language-locking instruction lives in the n8n system
      prompt; the frontend only computes and sends the field. Recommended
      n8n prompt addition (paste into the system prompt of the AI Agent
      node): "Respond in the language indicated by `responseLanguage`
      ('ja' = Japanese, 'en' = English). Use that single language for
      the entire reply, including any explanations around the proposed
      PlantUML code block. Never mix languages within one response."

  SR-031:
    function: "Render chat message list"
    parent: [UR-005]
    component: ChatPanel
    status: implemented
    acceptance_criteria:
      - "Display user and AI messages with distinct styles"
      - "Display timestamp on each message"
      - "Auto-scroll to latest message"

  SR-032:
    function: "Extract PlantUML source from AI response"
    parent: [UR-006]
    component: n8nService
    status: implemented
    implementation_note: |
      ADR-005 mandates extraction on the n8n side. In phase 1 we extract
      on the frontend (services/n8nService.ts::extractPlantUmlBlock) for
      speed of iteration. The response normalizer already accepts a
      pre-extracted suggestedSource field, so moving this to n8n is a
      drop-in replacement when we revisit ADR-005.
    acceptance_criteria:
      - "Detect ```plantuml code blocks in AI response"
      - "Extract complete PlantUML source from code block"
      - "Return structured value with text and suggestedSource fields"

  SR-033:
    function: "Present AI-proposed modifications as a visual before/after model comparison"
    parent: [UR-006]
    component: ProposalView
    status: implemented
    acceptance_criteria:
      - "When the AI response contains a suggestedSource, request PlantUML Server to render the proposed source as a second SVG"
      - "Display the before-model SVG and the proposed-model SVG side-by-side inside the chat message"
      - "The 'before' side is FROZEN at Apply time: the source that was live the moment the user clicked Apply gets snapshotted on the chat message, and the proposal view keeps comparing against that snapshot forever after — Undo / Redo do NOT shift past proposals' before/after relationship. (For an unapplied proposal, the live current source is used so the user can judge the change against the latest state.)"
      - "The 'before' SVG is rederived from the snapshotted before-source by re-fetching from PlantUML Server (NOT snapshotted from the live svgString, which is debounced and can lag behind the source it was generated from — that mismatch caused diff overlay rectangles to land off-position)"
      - "Overlay and underlying PlantUML SVG must share the same rendered viewport. BOTH the inline proposal view and the full-screen modal use the same pattern: the container fixes its aspect ratio to the SVG viewBox's aspect ratio (CSS aspect-ratio) with width=viewBox-width and maxWidth/maxHeight=100%; both SVGs are absolute-positioned inset-0 and CSS-forced to fill via [&>svg]:!w-full !h-full. The !important is essential — PlantUML ships `<svg>` with inline `style=\"width:NNNpx\"`, which otherwise beats plain Tailwind classes and keeps the underlying SVG at its native pixel size while the overlay stretches"
      - "viewBox fallback: when the PlantUML `<svg>` has no viewBox attr (some output paths omit it), synthesize `0 0 width height` from the width/height attrs so the overlay still renders instead of silently disappearing"
      - "Compute a model-level diff (SR-090) and overlay ADD / REMOVE / CHANGE highlights using the same native SVG overlay mechanism as review markers"
      - "Mark each diff item on the side where the affected node still exists: removed states overlay the CURRENT (left) SVG; added states overlay the PROPOSED (right) SVG; changed states overlay BOTH sides so the user can compare the same anchor before and after"
      - "Color convention: green = added, red = removed, orange = changed (guard/event/action text diff)"
      - "Diff counts in the summary (+N / −M / ~K states) reflect ONLY the frames actually rendered. Pseudo-states (initial/final) have no label to anchor a frame to and compositions aren't framed by the current extractor, so they're excluded from the visible state-level diff; their child-state changes still show individually. This prevents the 'summary says 3 but I only see 1' mismatch"
      - "Render the proposed raw source as collapsible detail below the two diagrams (for reviewers who want to read the text)"
      - "Keep the Apply button alongside the comparison; Apply commits the proposed source into session state via SR-034"
      - "When the proposed source fails to parse, fall back to showing only the raw source with a parse-error notice (no right-side SVG)"
      - "An 'Expand' action opens a full-screen modal showing the same before/after comparison at a readable size, with independent pan/zoom + fit-to-view on each side and the same diff overlay on the proposed side"
      - "The modal does NOT render review markers on either side — comparison focuses on structural diff, not on the reviewer's prior annotations (markers remain on the main diagram behind the modal, accessible once closed)"
      - "The modal offers Apply (commit + close) and Close (cancel) actions; ESC or background click cancel-closes"
    rules:
      - context: "Proposed source is identical to current source (empty diff)"
        action: "Proposal view renders"
        outcome: "Show a note (no changes) and hide the Apply button"
      - context: "PlantUML Server is unreachable when rendering the proposed SVG"
        action: "Proposal view tries to render"
        outcome: "Show the current SVG on the left, a placeholder plus the raw proposed source on the right, and keep Apply available"
    notes: |
      v7.0 had SR-033 as a text-level diff; v7.1 replaces that with a
      visual model comparison because the user chose a diagram
      precisely to avoid judging changes in text. The overlay reuses
      the marker overlay primitive (same native-SVG layer) to avoid
      introducing a new diagram framework.

  SR-034:
    function: "Apply proposed source modification"
    parent: [UR-006]
    component: SessionStore + ChatStore
    status: implemented
    acceptance_criteria:
      - "Replace current source with proposed source"
      - "Record snapshot in source history (with version number)"
      - "Mark the ChatMessage as applied (in ChatStore)"
      - "Trigger model re-parse, diagram re-render, table re-calculate"
      - "Auto-apply when the proposal arrives while the current source is empty (initial-generation case): there is nothing meaningful to compare the proposal against, so requiring a user click is noise. The auto-applied message still shows ✓ Applied and its Proposal view (empty vs proposed) for reference"
      - "Auto-apply is gated on parse success — an unparseable suggestedSource is never auto-applied (otherwise a bad first generation would poison the session with an unparseable current source). SR-030's auto-reask handles the unparseable case; the final parseable proposal is the one auto-apply picks up"
      - "For initial-generation messages (applied with an empty frozenBeforeSource, OR about-to-auto-apply while the live source is still empty and the proposal parses), the chat bubble hides the Proposal view entirely and shows only the AI's text. There is no meaningful before/after to display, so the 2-column comparison would be noise. The actual applied model is visible in the diagram pane"

  SR-035:
    function: "Undo and Redo applied source modifications"
    parent: [UR-006]
    component: SessionStore + DiagramToolbar
    status: implemented
    acceptance_criteria:
      - "Undo restores the previous source from history; pushes the displaced source onto a redo stack"
      - "Redo restores the next source from the redo stack; pushes the displaced source back onto undo history"
      - "Any new Apply (or Generate-model result, or seed-import) clears the redo stack — the new branch becomes canonical"
      - "Trigger model re-parse, diagram re-render, table re-calculate after Undo or Redo"
      - "Undo and Redo controls live on the diagram toolbar (next to the marker tools), NOT on the chat panel — they affect the model, so they belong with the model"
      - "Undo / Redo are visible at all times during the session, even when the diagram pane is in empty state (SR-070) — otherwise the user could undo back to empty and lose any way to redo forward"
      - "Disable Undo when no undo history exists; disable Redo when no redo history exists (do not hide — keep the affordance visible so the user knows the feature exists)"
      - "Tooltips: Undo = 'Undo the last applied proposal', Redo = 'Redo the next applied proposal'"

