      - "Columns in display order: visibility checkbox (reflects !hidden), id, statement, type, text, contained_in, derives_from, note, delete-action icon"
      - "`contained_in` is empty for top-level requirements; otherwise the container (package or parent requirement) id; multi-valued with ; separator when a requirement is contained in several places"
      - "`derives_from` is empty if the requirement has no derive-source; otherwise semicolon-separated source ids"
      - "Toggling the visibility checkbox flips the requirement's `hidden` flag; change takes effect immediately (diagram re-renders, CSV export reflects new state)"
      - "The note cell is inline-editable; changes update the requirement's `note` field"
      - "The delete-action icon opens a small reason-input dialog; confirming sets `deleted=true` and stores the reason in `note` (ADR-014)"
      - "Deleted rows remain in the list shown strikethrough + grey; an `Undelete` control in the row's context menu clears `deleted` (note is retained)"
      - "Copy produces HTML (<table>) for Excel / Sheets / Word paste AND plain-text CSV; Save produces the CSV"
      - "The CSV includes every requirement regardless of hidden / deleted state — the artifact is the full evidence record"
      - "Filename pattern: modellogue-<sessionName-slug>-requirements-<YYYY-MM-DD-HHMM>.csv"
      - "A file saved here is a valid seed-form input to SR-110 — round-trip is byte-stable for a given RequirementModel (ADR-011)"

  SR-114:
    function: "Render-pipeline filter: comment out hidden-requirement declarations and their relations before sending the PlantUML source to PlantUML Server"
    parent: [UR-014]
    component: src/modelTypes/requirement/renderer.ts
    status: implemented  # v7.5
    notes: |
      The edit buffer IS the canonical source and stays a valid
      PlantUML subset. Delete is already baked into the buffer
      (declaration commented out, relations tagged) per ADR-014 —
      the renderer does nothing for deleted ids. Hide is expressed
      only by a `' @modellogue hide "id"` marker comment; the
      declaration stays uncommented in the source so a direct PlantUML
      render shows everything. When ModelLogue prepares the source
      for its own diagram display, the renderer transforms the buffer:

        - for each hidden id, comment out its declaration line
        - for each relation touching a hidden id, comment it out too

      The stored buffer is untouched — only the text sent to
      PlantUML Server is filtered. The function is a pure
      (source, model) → string, so it is deterministic (ADR-011).

      Scope: applies to requirement-diagram sessions only. State-
      machine sessions do not use this filter (no hide flag on state
      machines in v7.5).
    acceptance_criteria:
      - "For each requirement with hidden=true, its declaration line in the source is commented out in the PlantUML sent to the server"
      - "Relations whose source or target is hidden are also commented out"
      - "Already-commented lines are not re-commented (the prefix is idempotent)"
      - "Deleted requirements require no renderer action (their source lines are already commented-out per ADR-014)"
      - "The editor source in the Source tab is never modified by the renderer"
      - "Toggling a hidden flag triggers a re-render of the SVG with the new filter applied (reactive, via MainLayout's model-dep effect)"
      - "Filter output is byte-deterministic for a given (source, hidden-set) so the SVG round-trip is stable (ADR-011)"

  SR-115:
    function: "Seed new requirement-diagram sessions with the !procedure preamble so the edit buffer is a valid PlantUML source from the first keystroke"
    parent: [UR-014]
    component: src/modelTypes/requirement/preamble.ts + ModelTypeDefinition.defaultSeedSource + sessionStore.setModelTypeId
    status: implemented  # v7.5
    notes: |
      Per the 2026-04-23 principle, the source buffer in a
      requirement session must be a valid PlantUML subset that renders
      directly on PlantUML Server without going through ModelLogue.
      That means the `!procedure` preamble defining $req / $fReq /
      $nfReq / $dConstraint / $contain / $derive / etc. must live
      INSIDE the edit buffer.

      ModelLogue does not auto-inject the preamble at render time.
      Instead, a fresh requirement session starts with the preamble
      pre-populated (ModelTypeDefinition.defaultSeedSource points at
      DEFAULT_REQUIREMENT_SEED_SOURCE — a wrapped `@startuml` /
      preamble / `@enduml` template). The user's content is added
      between the preamble and `@enduml`. Save .puml just writes the
      buffer, which is already self-contained.

      Open saved review: no strip-on-display; the saved file carries
      the preamble, the parser's `!procedure` tolerance silently
      skips it, and the buffer matches the file.
    acceptance_criteria:
      - "Switching to a requirement-diagram session seeds currentSource with the full preamble template (`@startuml`, `!procedure` definitions, `@enduml`)"
      - "State-machine sessions are unaffected (defaultSeedSource left undefined; buffer stays empty)"
      - "The source tab in a requirement session shows the preamble — users see and can (during SEED) edit everything that will be sent to PlantUML Server"
      - "Save .puml writes currentSource unchanged — no magic injection at save time"
      - "PlantUML Server can render the saved file directly with no ModelLogue pre-processing"

  SR-116:
    function: "Apply an AI chat reply to a requirement-diagram session: extract the ```csv block, regenerate canonical PlantUML mechanically, auto-apply without a before/after modal"
    parent: [UR-006, UR-014]
    component: |
      ModelTypeDefinition.extractSuggestedSource (src/modelTypes/types.ts)
      + src/modelTypes/requirement/csvParser.ts
      + src/modelTypes/requirement/plantUmlGenerator.ts
      + src/stores/chatStore.ts (sendAndAutoReask)
      + src/components/ChatPanel/ChatPanel.tsx (auto-apply effect,
        ProposalView gate)
    status: implemented  # v7.5
    notes: |
      Per user direction (2026-04-23): the Requirement list (CSV) is the
      canonical data for a requirement-diagram session, and the diagram
      is a visualization ModelLogue regenerates mechanically. The AI
      therefore works in CSV space; the before/after modal that state-
      machine sessions use (SR-033) would add nothing — instead the
      reviewer reviews the LIVE diagram with green/amber auto-markers
      (SR-117).

      Flow:
        1. AI reply arrives with a ```csv block. extractSuggestedSource
           for the requirement ModelTypeDefinition finds it, parses it
           via csvParser.ts, regenerates canonical PlantUML via
           plantUmlGenerator.ts (preamble + macro calls + review-state
           comments per ADR-014), and returns that as the proposal.
        2. ChatPanel's auto-apply effect fires UNCONDITIONALLY for
           requirement sessions (state-machine still auto-applies only
           the initial proposal when the source is empty, per SR-034).
        3. If the CSV failed to parse, extractSuggestedSource returns
           null; sendAndAutoReask retries with a follow-up prompt that
           asks for a ```csv code block (type-aware retry).
        4. The ProposalView component is NOT rendered for requirement
           sessions (its diff shape is state-machine-specific and would
           otherwise show an empty-looking dialog with no Apply button).

      Auto-apply is gated on successful parse of the regenerated
      PlantUML — an unparseable proposal will not poison the session.
    acceptance_criteria:
      - "A ```csv code block in the AI reply is transformed to a PlantUML source via csvParser + plantUmlGenerator; the result parses back to the same RequirementModel (byte-stable generator, ADR-011)"
      - "If the CSV block fails to parse or validation (ADR-014 soft-delete reason, etc.), extractSuggestedSource returns null and no proposal is offered; chatStore.sendAndAutoReask re-asks with a type-specific ```csv retry prompt"
      - "ChatPanel auto-applies every successfully-extracted proposal in a requirement session (no Apply button shown, no before/after modal)"
      - "State-machine sessions are unaffected: SR-034 initial auto-apply + SR-033 ProposalView still apply for them"
      - "displayText strips both ```plantuml and ```csv blocks so the chat bubble shows only the AI's explanation prose"

  SR-117:
    function: "Auto-place green/amber added/changed markers on the requirement diagram after an AI apply, cleared on every source change"
    parent: [UR-004, UR-006, UR-014]
    component: |
      src/modelTypes/requirement/diff.ts
        (diffRequirementModelsVisible — added / removed / changed)
      + src/modelTypes/requirement/svgCoordinates.ts
        (extractRequirementCoordinates — PlantUML class-diagram <g class="entity" …>)
      + src/modelTypes/requirement/autoMarkerPlacement.ts
        (placeAutoMarkers — (diff, coords) → AutoMarker[])
      + src/stores/autoMarkerApply.ts
        (stashAutoMarkerBeforeIfApplicable — gates the pre-apply snapshot)
      + src/stores/markerStore.ts (autoMarkers state)
      + src/stores/modelStore.ts (pendingAutoMarkerBefore +
        fetchCoordinates auto-marker step)
      + src/components/DiagramView/DiagramView.tsx
        (non-interactive <rect> overlay using AUTO_MARKER_STROKE)
    status: implemented  # v7.5
    notes: |
      Per user direction: "diff の apply なんて要らなくて、直接描き直した
      図に枠をつけちゃって、枠が不要になったら人が消せばいい". Review is
      on the live diagram, not in a modal.

      Semantics (diffRequirementModelsVisible):
        - added   : requirement visible in after, NOT visible in before →
                    solid green rectangle (#16a34a, matches COLOR_ADDED in
                    ProposalView)
        - changed : visible in both, but statement / text / type /
                    parentId differ OR the set of incident relations
                    changed → dashed amber rectangle (#f59e0b, matches
                    COLOR_CHANGED)
        - removed : visible in before, not visible in after → NO marker
                    (ADR-014 — the evidence lives in the Requirement list
                    tab as a strikethrough row; a marker for a position
                    that no longer exists on the diagram would mislead
                    the reviewer)

      Visibility = !hidden && !deleted. A hide/unhide or
      delete/undelete flip counts as added / removed for marker purposes.

      Relation changes aggregate to the incident nodes: adding or
      removing an edge between R1 and R2 promotes BOTH R1 and R2 to
      "changed". The v7.5 diagram does not carry per-edge markers, so
      node-level aggregation gives the reviewer a single point to
      inspect.

      Pre-apply snapshot gating (stashAutoMarkerBeforeIfApplicable): only
      stash the before-model when the session is requirement-type AND
      the before-model already has requirements. Initial generation
      (zero requirements before → N after) therefore emits no markers —
      otherwise the first apply would paint every new box green.

      Auto-markers are cleared on every source change that is NOT a
      stashed apply (plain edits, undo/redo, model-type switch). They
      are also cleared when the session is bootstrapped from a saved
      review bundle.
    acceptance_criteria:
      - "After an AI apply in a requirement session, every requirement visible in the new model but not in the previous model gets a solid green rectangle around its class box on the live diagram"
      - "Every requirement visible in both models whose fields or incident relations changed gets a dashed amber rectangle"
      - "Removed / deleted requirements do NOT get a diagram marker (verified against the Requirement list strikethrough row per SR-113)"
      - "Markers are placed at the class-box bounding rect (data-qualified-name match) with a 4 px outward inset; they are drawn below user markers so clicks still select user annotations"
      - "First-generation apply (empty before-model) emits no markers; subsequent applies emit markers driven by the diff"
      - "Source changes that are not part of an apply clear auto-markers (markerStore.clearAutoMarkers); user-drawn markers are untouched"
      - "State-machine sessions never populate autoMarkers — the overlay in ProposalView (SR-033) handles that case"
      - "Placement is deterministic for a given (before, after, coords) triple; unit test fixture confirms green/amber kinds and rect geometry"

  SR-118:
    function: "Persist level (user/system/design) and group (free-text) classification axes on requirements"
    parent: [UR-014]
    component: src/modelTypes/requirement/model.ts + parser.ts + csvParser.ts + listSerializer.ts + plantUmlGenerator.ts
    status: implemented  # v7.7 (ADR-015)
    notes: |
      Per ADR-015. Adds two orthogonal classification axes to
      Requirement so the existing `type` (functional / nonFunctional /
      constraint) is no longer the only attribute available for
      grouping or filtering during review:

        - `level: 'user' | 'system' | 'design' | null` — abstraction
          tier in the value-engineering sense. 'user' for UR-style
          tasks, 'system' for SR-style functions, 'design' for design
          decisions/constraints below SR. Optional (null = unspecified).
          Strict closed value space at first; ADR-015 commits to
          extending only via a follow-up ADR if a new tier is needed.
        - `group: string | null` — review-purpose-specific axis with
          free-text values (e.g. "Source editing", "AI chat", "Phase 1",
          a sub-system name). Used when the review wants a grouping
          that is NOT the canonical level tier and NOT the stereotype
          type — for example, system-level inventory by component area.

      One-axis discipline: the human-facing docs (Requirements_
      Specification.md §3.13) and the n8n requirement-type prompt
      MUST instruct authors / AI to populate at most ONE of {level,
      group} for any single review CSV. Multi-axis grouping in one
      diagram is bad practice; if both axes need attention, split
      into separate review sessions.

      CSV schema (SR-113 list shape):
        11 columns, fixed: id, statement, type, text, contained_in,
        derives_from, hidden, deleted, note, level, group.
        Empty cells mean null. The project is pre-public-release, so
        no 9-column tolerance is provided — a CSV with a different
        column count is a parse error. Save .csv (listSerializer)
        always emits all 11 columns.

      Default groupingAxis (SR-119) falls back to `type` when both
      level and group are null for every row, so a CSV that uses
      none of the new axes still renders sensibly via the existing
      stereotype-based grouping.

      AI prompt (n8n) update:
        - Explain the three axes (type / level / group) and their
          orthogonality.
        - Encode the one-axis-per-CSV rule: at most one of level/group
          should be populated per review session.
        - Provide examples for cross-tier coverage (level=user/system)
          and area inventory (group=area-name).
    acceptance_criteria:
      - "Requirement model has level: 'user' | 'system' | 'design' | null and group: string | null fields"
      - "csvParser accepts only the 11-column form; CSVs with a different column count produce a parse error"
      - "listSerializer (Save .csv) writes all 11 columns; round-trip CSV → model → CSV is byte-stable for the canonical column order"
      - "Unknown level values (anything other than user / system / design or empty) produce a parse error citing the offending row"
      - "n8n requirement-type system prompt teaches the 3-axis model and the one-axis-per-CSV rule with at least one cross-tier example and one area-inventory example"

  SR-119:
    function: "Render requirement diagram with selectable visual grouping axis (type / level / group)"
    parent: [UR-014]
    component: src/modelTypes/requirement/plantUmlGenerator.ts + RequirementDiagram session config
    status: implemented  # v7.7 (ADR-015; emits `left to right direction`)
    notes: |
      Per ADR-015. The existing CSV → modelToPlantUml pipeline produces
      a flat .puml — every requirement at top level, no `package`
      blocks — which makes 50+ node review diagrams horizontally
      sprawl (PlantUML auto-layout has no 2D anchor). The dogfood
      system-level CSV produced a 24919 px wide SVG against the
      8325 px wide hand-authored equivalent that did use packages.

      modelToPlantUml gains a `groupingAxis` parameter:

        type GroupingAxis = 'none' | 'type' | 'level' | 'group';

      Behaviour:
        - 'none' (or chosen axis is null for every row): emit flat,
          as today.
        - 'type' / 'level' / 'group': partition the requirements by
          distinct values of the chosen attribute and emit one
          `package "<value>" <<Frame>> { ... }` block per partition.
          Within each block, requirements are emitted in their model
          order.
        - Relations (`$contain`, `$derive`, etc.) are emitted AFTER
          all package blocks, in their model order.

      Layout hint:
        - The generated PlantUML begins with `top to bottom direction`
          so when grouping by level (UR upper / SR lower), the boxes
          actually stack vertically. `left to right direction` is an
          option for area-grouped reviews where horizontal scanning
          works better; expose it as a per-session config knob in
          a follow-up.

      Default selection rule:
        - When the session config does not specify groupingAxis:
            - if any row has a non-null `group`     → use 'group'
            - else if any row has a non-null `level` → use 'level'
            - else                                  → 'none'
          (`type` is never the auto-default; it stays an explicit
          choice for the rare "let stereotype drive layout" case.)

      Determinism (ADR-011):
        - Output stays byte-identical for the same (model,
          groupingAxis) pair.
        - Package emission order is determined by the FIRST appearance
          of each distinct grouping value in model.requirements
          (stable, not alphabetical).
    acceptance_criteria:
      - "modelToPlantUml accepts a groupingAxis parameter typed as 'none' | 'type' | 'level' | 'group'"
      - "When groupingAxis='level' and the model has UR + SR rows, the output contains exactly two `package` blocks named after the level values, in first-appearance order"
      - "When groupingAxis='group' and group is null on every row, the output is flat (no package blocks)"
      - "Generated PlantUML begins with `top to bottom direction` whenever any package block is emitted"
      - "Round-trip: parse(modelToPlantUml(model, axis)) yields a model with matching ids, statements, types, levels, groups, and parentIds for every requirement"
      - "Determinism (ADR-011): two calls with the same (model, groupingAxis) produce byte-identical output"
      - "PlantUML Server renders the output (HTTP 200) for all three non-flat axes when applied to the dogfood CSVs in Doc/requirements/diagrams/"

# =============================================================================
# Process Diagram (v7.6)
# =============================================================================

process_diagram:
  SR-120:
    function: "Scenarios tab — enumerate every start→end path in the process diagram, one row per path"
    parent: [UR-015]
    component: src/modelTypes/process/paths.ts + ScenariosView tab
    status: implemented  # v7.6
    notes: |
      The path-enumeration table is the primary review artifact for a
      process diagram session — each row is a candidate E2E / UAT /
      system-test case. Mirrors UR-013 / SR-103's role for the
      state-machine type.

      Path = ordered list of tasks from `start` to `stop` / `end`,
      expanded through `if/else` branches and `fork/end fork` parallel
      regions. For parallel regions, each possible interleaving is
      NOT enumerated (that would blow up); instead the parallel
      branch set is treated as "all of these must occur" and listed
      as such in the row.

      Columns: path_id, tasks (ordered), branches_taken, lanes
      traversed, events encountered, artifacts referenced,
      externals_touched.

      Initial implementation is in-SPA (pure TS, same shape as
      requirement orphans / traceability). If large real-world
      processes cause the enumeration to slow down, promote to an
      auxiliary service `tools/pathgen` per ADR-010.
    acceptance_criteria:
      - "Every maximal path from a `start` node to a `stop` / `end` node is emitted as one row"
      - "Branch conditions encountered along the path appear in the `branches_taken` column (e.g. `審査結果 == 承認 → 承認`)"
      - "Lane transitions are listed in order in the `lanes` column"
      - "Events (`<<timer>>` / `<<message>>` / `<<error>>`) on the path are listed in `events`"
      - "Artifact labels (`-> name;`) encountered are listed in `artifacts`"
      - "External IT systems / repositories referenced along the path (extracted from `**外部:** …` lines in note blocks, per SR-125) are deduplicated and listed in `externals_touched`"
      - "Parallel regions (`fork` / `end fork`) contribute a single `fork(...)` token to the path rather than exponential interleavings"
      - "Copy / Save .csv actions emit the canonical CSV with the above columns, LF line endings, RFC 4180 quoting"

  SR-121:
    function: "Events tab — list every `<<timer>>` / `<<message>>` / `<<error>>` event with the paths that contain it"
    parent: [UR-015]
    component: src/modelTypes/process/events.ts + EventsView tab
    status: implemented  # v7.6
    notes: |
      Exception / external-trigger inventory. Lets reviewers confirm
      that every externally-initiated event has a defined handler and
      that the handler's downstream paths are sensible.
    acceptance_criteria:
      - "One row per (task, stereotype) pair where the stereotype is timer / message / error"
      - "Each row shows the task label, event kind, the number of paths containing it (from SR-120), and the immediate next branches / stop nodes"
      - "Tasks without one of the 3 recognised stereotypes do NOT appear"

  SR-122:
    function: "Roles tab — list every swim lane with its tasks and the hand-off points to other lanes"
    parent: [UR-015]
    component: src/modelTypes/process/roles.ts + RolesView tab
    status: implemented  # v7.6
    notes: |
      Reviewer's "who does what" inventory. Lanes participate as
      actors regardless of whether they are humans, organisational
      units, or systems — ModelLogue is a system-design review
      tool, so the systems the project is designing / modifying
      are first-class participants and appear as lanes too. Lanes
      that should NOT be participants (third-party systems,
      existing-and-untouched repositories) are expressed as
      `**外部:**` notes per SR-125 instead.

      Hand-off points are the directed arrows that cross a lane
      boundary — the places where the flow relies on one
      participant handing control / data to another. They are
      high-value review material because they mark the
      organisational and integration boundaries each test has to
      coordinate across.
    acceptance_criteria:
      - "One row per swim lane (`|Actor|` declaration)"
      - "Each row lists the tasks executed in that lane"
      - "Hand-off points (arrows crossing lane boundaries) are listed with source task, target task, and the artifact label if present"
      - "A process diagram with no `|...|` declarations yields a single unnamed `(default)` lane row"

  SR-123:
    function: "Artifacts tab (optional) — list every `-> 伝票名;` arrow label with the tasks that produce / consume it"
    parent: [UR-015]
    component: src/modelTypes/process/artifacts.ts + ArtifactsView tab
    status: implemented  # v7.6
    notes: |
      Maps the flow of tokens / paper slips / digital artifacts
      between tasks. Optional in the sense that the process diagram
      works without any `->` labels; reviewers who want artifact
      traceability add them, and the tab populates.
    acceptance_criteria:
      - "One row per distinct artifact label (case-sensitive, trimmed)"
      - "Each row shows the task whose outgoing arrow first carries the label (producer) and every task whose incoming arrow carries the label (consumer)"
      - "A diagram with no `-> name;` labels yields an empty artifact list; the tab still renders with a hint explaining the `->` syntax"
      - "If the same label is produced by more than one task, all producers are listed"

  SR-124:
    function: "Parse process-diagram source (PlantUML activity subset, §3.15.3) into ProcessModel"
    parent: [UR-015]
    component: src/modelTypes/process/parser.ts
    status: implemented  # v7.6 (EBNF v1.2.2 with T-1 tolerance)
    notes: |
      Accepts the PlantUML activity-diagram subset defined in
      `src/grammars/processDiagram.ebnf`:

      - Nodes: `start` / `stop` / `end`, `:task;`, `:task;<<stereotype>>`
      - Branches: `if (cond) then (yes) ... else (no) ... endif`
      - Parallel: `fork` / `fork again` / `end fork`
      - Lanes: `|Actor|` declarations (lane applies to subsequent
        nodes until the next `|...|` or end of buffer)
      - Arrow labels: `-> label;` lines between nodes
      - Grouping: `partition "Name" { ... }`
      - Stereotypes recognised for event semantics: `timer` / `message` / `error`;
        other stereotypes are preserved as free labels but not
        surfaced in the Events tab

      Rejects (ADR-009-style guardrails to keep the subset small):
      - Nested `fork` inside `fork`
      - `partition` nested deeper than 1 level
      - `while` / `repeat` loops (not in the v7.6 subset)
      - `detach` / `kill` / dot-notation
      - PlantUML activity "beta" legacy syntax (`(*)` start nodes etc.)
    acceptance_criteria:
      - "Accepts every construct listed in src/grammars/processDiagram.ebnf"
      - "Produces ProcessModel { nodes, edges, lanes, stereotypes, partitions, externalReferences } per the data model section"
      - "Reports a clear line-numbered error for any rejected construct"
      - "Default lane when a node appears before any `|...|` is the literal `(default)`"
      - "Parse completes within the NFR-001 Parse < 100 ms budget for review-scale diagrams (~40 tasks)"

  SR-125:
    function: "Externals tab — list external IT systems / repositories referenced from task notes, with their touching tasks"
    parent: [UR-015]
    component: src/modelTypes/process/externals.ts + ExternalsView tab
    status: implemented  # v7.6
    notes: |
      ModelLogue is a system-design review tool. The default
      participation of any actor in a process diagram — human role,
      organisational unit, or SYSTEM — is the swim lane (SR-122).
      The `**外部:**` note pattern is reserved for systems and
      repositories that are explicitly OUT OF the project's design
      scope (third-party APIs, existing systems the project will
      not modify, regulatory systems, etc.). The reviewer / AI
      decides "external vs participant" by reading the requirements
      text for explicit cues like 外部 / external / 他社の /
      既存の-で-触らない; absent such cues, the system goes in a
      lane.

      PlantUML activity has no freely-placed object outside the
      flow, so external systems are expressed as sticky-note-shaped
      annotations attached to the task that touches them — notes
      are visually distinct from tasks (yellow, dog-eared corner)
      and semantically correct (they carry no inter-note ordering,
      matching "this task touches these externals, which have no
      order amongst themselves").

      Convention: a `note right`, `note left`, or multi-line
      `note right\n ... \nend note` block attached to a task may
      contain lines of the form `**外部:** 名前` (or its half-width
      equivalent `**External:** name`). Each such line registers a
      reference from the attached task to the named external. The
      rest of the note content is treated as free annotation.

      Multiple externals per note are allowed (one per line). The
      same external may be referenced from multiple tasks — the
      Externals tab aggregates and lists each external once with
      the full list of touching tasks.

      No graph is drawn between the external and the task; notes
      are annotations only.

      The tab is OPTIONAL: a process diagram with no `**外部:**`
      lines in any note yields an empty list; the tab still
      renders with a short usage hint so reviewers know how to
      add them.
    acceptance_criteria:
      - "One row per distinct external name (trimmed, case-sensitive)"
      - "Each row shows the list of tasks that have a `**外部:** name` line in an attached note"
      - "Lines starting with `**外部:**` or `**External:**` are recognised; both prefixes extract the same external reference"
      - "Non-matching note content is ignored (not surfaced in this tab), but is preserved in the source for diagram rendering"
      - "A diagram with no matching notes yields an empty list and a hint explaining the `note right\\n**外部:** …\\nend note` syntax"
      - "Copy / Save .csv emits the canonical CSV with columns external, touching_tasks (semicolon-separated, task-label order preserved)"

# =============================================================================
# Parser Diagnostics — Cross-type Help (v7.7)
# =============================================================================

parser_diagnostics:
  SR-126:
    function: "Cross-type parse diagnosis — when the active parser fails, suggest switching to another registered model type that parses the same source cleanly"
    parent: [UR-016]
    component: src/services/crossTypeDiagnosis.ts + modelStore.parseSuggestion + SourceEditor banner
    status: implemented  # v7.7 — fully covers UR-016(a) early detection across all currentSource entry events (paste / bundle import / AI generate / manual edit). Pairs with SR-128 (the switch action invoked by the banner).
    notes: |
      Stage A of the model-type auto-detection plan
      (project_model_type_auto_detection.md, 2026-04-24). With three
      registered model types (state-machine, requirement, process)
      and more on the horizon, picking the wrong one at session seed
      becomes a real failure mode — the user sees a wall of parse
      errors with no guidance about which type would fit.

      Trigger discipline:
        - Run only when the active parser produced at least one
          parse error AND the source is non-trivial (length > some
          floor like 30 chars).
        - Run every other registered ModelTypeDefinition's parse(source).
        - Compare error counts. Suggest an alternative ONLY when:
          (a) the alternative produces zero errors, AND
          (b) the alternative also produces a non-trivial model
              (so we don't suggest the alt's `defaultSeedSource`
              flavour passes — we want a real model parsed).
        - Never suggest if multiple alternatives tie at zero errors
          (ambiguous; leave the user to pick from the header
          selector instead of nudging toward an arbitrary one).

      UI surface:
        - SourceEditor's existing red error band gains one extra row
          below the line-numbered errors:
            「この入力は <currentType> としてはエラー <N> 件ですが、
             <suggestedType> としてエラー 0 件で解釈できます。
             ヘッダー型セレクタで切り替えますか？  [Switch]」
        - The Switch button calls a new sessionStore action that
          changes modelTypeId WITHOUT clobbering currentSource — the
          whole point is to re-parse the existing source under the
          suggested type. This differs from the existing
          setModelTypeId which resets the source to the new type's
          defaultSeedSource (header dropdown semantics).
        - Suggestion is cleared when the next parse succeeds, when
          the user manually switches via the header dropdown, or on
          source change.

      Out of scope (Stages B / C, separate SRs later):
        - Auto-detect on paste / bundle import without an active type.
        - Confidence scoring beyond pass/fail (Stage B's per-type
          scoring functions).
        - Fully autoselecting when confidence is high (Stage C).

      No new ADR is required (Stage A is pure error-handling polish).
      Stages B / C will need a heuristic-design ADR when scheduled.
    acceptance_criteria:
      - "When the active parser returns 0 errors, no diagnosis runs and parseSuggestion stays null"
      - "When the active parser fails on a non-trivial source AND exactly one alternative parser returns 0 errors with a non-empty model, parseSuggestion holds {suggestedTypeId, alternativeErrorCount:0, activeErrorCount:N}"
      - "When the active parser fails AND every alternative also returns errors, parseSuggestion stays null (no useful nudge)"
      - "When two or more alternatives return 0 errors, parseSuggestion stays null (ambiguous)"
      - "The suggestion banner appears in SourceEditor below the line-numbered error list and includes a Switch button"
      - "Clicking Switch changes modelTypeId to suggestedTypeId AND keeps currentSource intact (no reset to the new type's defaultSeedSource)"
      - "Switching produces a clean parse on the same source (the banner disappears, the analysis tabs populate)"
      - "Manually changing the header dropdown (existing setModelTypeId) clears any pending parseSuggestion"
      - "Empty / trivial source (≤ 30 chars after trim) never triggers diagnosis"

  SR-128:
    function: "Source-preserving model-type switch — change modelTypeId without resetting the user's currentSource / chat / requirementsText / manual markers"
    parent: [UR-016]
    component: src/stores/sessionStore.setModelTypeIdKeepingSource + MainLayout re-parse useEffect (modelTypeId in deps)
    status: implemented  # v7.7 — implementation shipped under SR-126 as the Switch button's target action; SR-128 formalises the contract.
    notes: |
      Two switch flows must coexist:

        - setModelTypeId (header dropdown): "I'm starting fresh
          under a new type." Resets currentSource to the new
          type's defaultSeedSource, clears chat / markers /
          requirementsText.
        - setModelTypeIdKeepingSource (this SR): "I picked the
          wrong type and want to re-tag what I have." Keeps the
          user's existing input and only swaps modelTypeId.

      The two flows MUST be distinguishable to the user via the
      entry point (header dropdown vs cross-type-diagnosis Switch
      button). Conflating them silently destroys work or surprises
      with stale content. UR-016 (b) is satisfied by having the
      latter flow available with a clear preservation contract.

      Preservation contract (the meaning of "keeping source"):
        - currentSource: kept (the whole reason)
        - sourceHistory + redoStack: kept (undo / redo continuity)
        - chat messages: kept (dialogue continues to be relevant)
        - requirementsText: kept (the natural-language brief is
          still relevant to the same artifact under another type)
        - manual markers (markerStore.markers): kept (user
          annotations; positions may land on irrelevant diagram
          coordinates after the type switch — accepted UX cost)
        - autoMarkers: cleared (computed from the previous
          type's model diff; nonsensical under the new type;
          cleared by the re-parse pipeline via fetchCoordinates)
        - active analysis tab: reset to 'requirements' (the
          previous tab may not exist in the new type's
          analysisTabs)

      Locks (shared with setModelTypeId):
        - REVIEW phase locked (hasEstablishedModel=true) → no-op
        - unknown id (resolveModelTypeId falls back) → no-op
        - same id → no-op

      Re-parse trigger:
        MainLayout's parseSource useEffect depends on modelTypeId,
        so changing the id automatically schedules a re-parse on
        the preserved source. The user immediately sees whether
        the new type fits the existing input.
    acceptance_criteria:
      - "Switching model type via this action does NOT clear the user's existing currentSource / chat / requirementsText / manual markers"
      - "Same locks as setModelTypeId: the action is a no-op once the REVIEW phase has started, for unknown type ids, and for same-id calls"
      - "After the switch, the new type's parser runs on the preserved source automatically (the user immediately sees whether the new type accepts their existing input)"
      - "autoMarkers from the previous type's diff are cleared as a side-effect of the re-parse; the active analysis tab falls back to 'requirements'"

  SR-129:
    function: "Auto-detect modelTypeId on bootstrapFromBundle when the bundle does not carry one — run every registered parser on bundle.plantUmlSource and adopt the unique 0-error winner; fall back to default if none or ambiguous"
    parent: [UR-016]
    component: src/services/crossTypeDiagnosis.ts (pickBestType helper) + src/stores/sessionStore.bootstrapFromBundle
    status: implemented  # v7.7
    notes: |
      Closes UR-016 sub-problem (c). External producers (n8n
      workflows, CI pipelines, GitHub bots, etc.) seed sessions
      via SeedBundle but cannot reasonably be required to declare
      the model type — that classification is what ModelLogue
      should handle. Currently bootstrapFromBundle calls
      resolveModelTypeId(undefined) which falls back to the
      hardcoded default (state-machine), which silently misclassifies
      requirement / process bundles.

      Mechanism (shared with SR-126):
        - A pure helper `pickBestType(source, registry?)` runs every
          registered parser. Returns the type id when EXACTLY ONE
          parser returns 0 errors with a non-trivial model; null
          otherwise (no candidates, or multiple 0-error candidates).
        - bootstrapFromBundle calls pickBestType only when
          bundle.modelTypeId is undefined AND bundle.plantUmlSource
          is non-trivial. If a winner is found, modelTypeId is set
          to it. Otherwise the existing default fallback kicks in,
          and SR-126's parse-time banner will catch the mismatch.

      Why no ADR:
        - The decision rule (unique 0-error winner) is decision-
          theoretically simple and aligns with ADR-011 (mechanical
          conversion is deterministic). No tie-break heuristic,
          no confidence threshold, no scoring function — the
          ambiguous case (which would warrant heuristics) is
          handled trivially by falling back to default and letting
          SR-126's banner flag it. No new architectural decision
          worth recording separately.

      Why no notification UI:
        - When auto-detection succeeds (unique winner), the chosen
          type matches the source and the user sees the analysis
          tabs populate normally. A "we auto-picked X" toast would
          be noise — the user does not need confirmation that a
          deterministic rule produced the obvious answer.
        - When auto-detection fails or is ambiguous, default
          fallback applies and SR-126 fires when the source fails
          to parse under default. That banner is the notification.
    acceptance_criteria:
      - "When the bundle carries a modelTypeId, that value is respected (auto-detection does not run)"
      - "When the bundle has no modelTypeId AND has a non-trivial plantUmlSource, every registered parser is tried; the unique 0-error winner with non-trivial content is adopted as the session's modelTypeId"
      - "When auto-detection has no unique winner (no clean candidate, or multiple clean candidates), the existing default fallback applies; SR-126's banner mechanism is then expected to nudge correction at parse time"
      - "Empty / trivial bundle.plantUmlSource (≤ 30 chars after trim) skips auto-detection and uses default — same trivial-floor as SR-126"

  SR-130:
    function: "Apply-time review-evidence guardrail — when an AI csv reply omits an id that was present in the previous requirement model, surface it for explicit user confirmation before applying"
    parent: [UR-014, UR-016]
    component: src/modelTypes/requirement/applyGuardrail.ts + chatStore.pendingGuardrail + ApplyGuardrailModal
    status: implemented  # v7.7
    notes: |
      ADR-014 establishes "soft-delete with reason as evidence" — when
      a requirement is removed / merged / decided-out, its row must
      stay in the CSV with deleted=Y and a non-empty note. The n8n
      requirement-type prompt instructs the AI to follow this rule
      (REVIEW SEMANTICS section), but prompt compliance is best-effort.
      When the AI silently drops a row entirely from its csv reply,
      the apply pipeline currently lets it through — the row's
      evidence vanishes with no audit signal.

      SR-130 is the defense-in-depth backstop. At apply time:
        - Compare the before-apply model's id set with the new csv's id set
        - Detect ids present in before but missing from new (true drops,
          NOT deleted=Y rows which still carry the id)
        - When drops exist, pause the apply and show a confirmation
          modal listing the dropped (id, statement) pairs
        - User chooses "Apply anyway" (accept the drop, last-resort
          override) or "Cancel" (abort apply, return to chat to re-prompt)

      Scope:
        - Only fires for requirement-type sessions
        - Only fires when the before-model is non-empty (initial
          generation has nothing to drop)
        - deleted=Y rows in the new csv are NOT drops (the id is still
          present, just flagged) — the guardrail leaves them alone
        - state-machine and process types do not have ADR-014's
          soft-delete principle and are out of scope

      No new ADR — SR-130 implements ADR-014's principle at the apply
      boundary; no new architectural decision is captured.

      UI text in easy English (consistent with the rest of the UI;
      response-language guidance applies to AI chat content, not
      modal labels).
    acceptance_criteria:
      - "In a requirement-type session with a non-empty before-apply model, the apply pauses and shows a confirmation modal listing the dropped (id, statement) pairs whenever the AI's csv reply omits an existing id"
      - "User can choose 'Apply anyway' (proceeds with the drop, evidence is lost) or 'Cancel' (apply aborted, the proposed message stays unapplied so the user can re-prompt)"
      - "deleted=Y rows in the new csv do not trigger the guardrail — the id is still present, the guardrail leaves them alone"
      - "The guardrail does NOT fire for initial generation (empty before-model) or for non-requirement type sessions (state-machine, process)"

  SR-131:
    function: "Strengthen requirement-type AI prompt: add ID-stability rule, reference-integrity rule, and worked examples for the three common review operations (merge / hide / add)"
    parent: [UR-014, UR-016]
    component: n8n/workflows/modellogue-chat.json (requirement-type system prompt)
    status: implemented  # v7.7
    notes: |
      The n8n requirement-type prompt already encodes the basic
      ADR-014 review semantics (soft-delete with reason, hidden vs
      deleted, CSV is canonical). SR-131 adds three reinforcements
      that came up while planning SR-130:

      - **ID-stability (B)** — "existing id MUST NOT be renamed;
        treat a rename as: keep the old id with deleted=Y plus a
        reason, and add a new row with a fresh id." Without this
        rule the AI may silently re-letter ids (e.g. R1 → R001 to
        normalise), breaking row continuity and tripping the
        SR-130 guardrail unnecessarily.
      - **Reference integrity (C)** — "every id in contained_in
        and derives_from MUST be the id of another row in the
        same CSV reply." Dangling references currently parse
        silently (the relation is just dropped), which means a
        typo can quietly lose a relation.
      - **Worked examples (A)** — three concrete (user-prompt,
        correct-csv-response) pairs covering the three common
        review operations: merge two requirements, hide a
        requirement temporarily, add a new requirement. Few-shot
        examples raise compliance noticeably with negligible token
        cost (each example ~80–130 tokens; the existing
        REQUIREMENT section is ~500–600 tokens, so the full
        addition stays under 1k tokens — negligible against
        Gemini's 1M context).

      Pairs with SR-130: prompt-side reinforcement reduces the
      mistake rate; SR-130 catches the residual mistakes at
      apply-boundary. Belt-and-suspenders.

      No code changes outside n8n/workflows/modellogue-chat.json.
      No new ADR (these are prompt-level refinements of ADR-014's
      principles).
    acceptance_criteria:
      - "The prompt explicitly states that existing ids MUST NOT be renamed; rename = old id with deleted=Y plus a reason + new row with fresh id"
      - "The prompt explicitly states that contained_in / derives_from MUST reference ids present in the same CSV reply"
      - "The prompt includes at least three worked examples showing correct CSV responses for: merging two requirements, marking a requirement hidden, and adding a new requirement"
      - "The pre-existing REVIEW SEMANTICS and ONE-AXIS DISCIPLINE rules are unchanged — SR-131 is additive reinforcement, not a rewrite"

  SR-132:
    function: "Bridge a Slack channel and the session's chat pane bidirectionally via n8n, so messages flow in both directions while the session is in REVIEW phase"
    parent: [UR-017]
    component: n8n/workflows/modellogue-slack-relay.json + n8n/workflows/modellogue-chat-to-slack.json + src/services/slackRelay.ts + chatStore + ChatPanel
    status: implemented  # v7.8 (a: client + chatStore append entry, b: n8n workflow scaffolds, c: ChatPanel polling hook)
    notes: |
      Architectural setting (subject of an upcoming ADR): UR-017's
      multi-participant chat is implemented by relaying messages
      between Slack and the ModelLogue chat pane, rather than by
      hosting a multi-user chat client inside ModelLogue itself. This
      SR is the relay function. The corresponding quality bar (that
      the facilitator can drive the review using only the ModelLogue
      pane, that participants can follow it using only Slack, and that
      latency stays within review-room thresholds) is captured in
      NFR-080 / NFR-081.

      Function structure — two n8n workflows + one client-side
      polling hook. ModelLogue stays a SPA with no server of its own;
      Slack credentials and message buffering live entirely in n8n.

      Slack → ModelLogue (read direction):
        - n8n workflow #1 has a Slack Trigger node listening to
          new messages on the bridged channel.
        - Each message is normalised to {ts, user, username,
          text, source: 'slack:<username>'} and pushed onto a
          ring buffer of the last 100 messages held in n8n
          Static Data.
        - The same workflow exposes GET /webhook/slack-relay
          ?since=<ts>, which returns all buffered messages
          newer than the supplied ts.
        - ModelLogue's slackRelay service polls this endpoint
          while a session is in REVIEW phase and appends new
          messages to chatStore.

      ModelLogue → Slack (write direction):
        - n8n workflow #2 exposes POST /webhook/chat-to-slack
          with body {source: 'facilitator' | 'ai', text}.
        - It posts to Slack chat.postMessage, prefixing the text
          with "[facilitator] " or "[AI] " so the source is
          preserved as part of the Slack-side message.
        - The facilitator's outgoing message in ModelLogue
          triggers this workflow; the AI's reply (after arriving
          at ModelLogue) also triggers it.

      Buffer choice:
        n8n Static Data ring buffer of the last 100 messages.
        Avoids standing up Redis just for the MVP. Older
        messages drop off; the polling client tolerates gaps
        because it tracks only the latest seen ts.

      Out of scope for this SR (covered separately):
        - AI awareness of relayed messages (SR-133)
        - Source labelling in the chat UI (SR-134)
        - Channel binding / Phase A vs Phase B (SR-135)
        - Latency budget and single-pane quality (NFR-080 / NFR-081)
    acceptance_criteria:
      - "A message posted in the bridged Slack channel during a REVIEW-phase session is appended to chatStore via the read-direction workflow"
      - "A chat send by the facilitator and an AI reply in ModelLogue both invoke the write-direction workflow and result in a Slack post via chat.postMessage"
      - "Each Slack-side post carries a source prefix ('[facilitator] ' or '[AI] ') so the speaker is preserved in the Slack message text"
      - "Polling uses the latest seen ts so that page reload does not produce duplicates in the chat pane"

  SR-133:
    function: "Include relayed Slack messages in the chat history sent to the AI, with a per-message source prefix and a mediator instruction in the system prompt"
    parent: [UR-017]
    component: src/services/n8nService.ts (serializeHistoryForPrompt) + n8n/workflows/modellogue-chat.json (mediator paragraph in systemMessage)
    status: implemented  # v7.8
    notes: |
      Today the n8n chat workflow receives a history array of
      {role, content} pairs, where role is 'user' (the
      facilitator) or 'assistant' (the AI). With Slack relay,
      three speaker classes coexist: facilitator, AI, and
      slack:<username>.

      Decision (planned):
        - Slack-origin messages keep role='user' so the AI
          continues to treat them as inputs to respond to.
        - Their content is prefixed with a source tag at history
          serialisation time, e.g. "[Slack: alice] We could
          combine these two requirements".
        - The system prompt gains one short paragraph explaining
          that this is a multi-participant review, that messages
          prefixed with "[Slack: <name>]" are remote
          participants, and that the AI should mediate — i.e.
          weave the points together rather than answering only
          the latest speaker.

      What this SR does NOT change:
        - The assistant role (AI replies remain a single voice).
        - The existing requirement / state-machine / process
          system prompts at the structural level — only one
          mediation paragraph is added at the top.

      Pairs with SR-132: SR-132 carries Slack messages into the
      session's chat history; SR-133 makes the AI actually use
      them. Without SR-133, relayed Slack messages would appear
      in the chat pane (good for visibility) but would not
      influence AI responses.
    acceptance_criteria:
      - "Slack-origin messages are included in the history array sent to the n8n chat webhook, with a content prefix like '[Slack: <username>]'"
      - "The system prompt explicitly tells the AI that prefixed messages come from remote participants and that the AI should mediate across participants"
      - "When the facilitator asks the AI about a remote participant's earlier point (e.g. 'What does Alice mean by combining these?'), the AI's reply demonstrates awareness of the remote participant's content"
      - "The change is additive — the existing ADR-014 / SR-131 prompt rules for requirement-type sessions are not weakened or removed"

  SR-134:
    function: "Render each chat message with a source label and visually distinct styling per source class (facilitator / AI / Slack participant)"
    parent: [UR-017]
    component: src/components/ChatPanel/MessageBubble.tsx + chatStore message schema (source field)
    status: implemented  # v7.8
    notes: |
      Each ChatMessage gains a `source` field with one of:
        - 'facilitator' — the local user typing in ModelLogue
        - 'ai'          — the AI assistant
        - 'slack:<name>' — a relayed Slack participant; <name> is
                           the Slack profile display name (or
                           username fallback) supplied by SR-132

      MessageBubble renders a small label above each bubble
      using easy English, consistent with SR-126 / SR-130:
        - facilitator → "You"
        - ai          → "AI"
        - slack:alice → "Slack · alice"

      Visual distinction:
        - Facilitator bubbles align right (as today).
        - AI and Slack participants both align left, but Slack
          participants are visually distinct from the AI (e.g.
          a different bubble accent / left border colour) so
          the facilitator does not mistake a participant for
          the AI.
        - Concrete colour / spacing decisions land in the
          implementation diff; this SR fixes the contract, not
          the pixels.

      Why a `source` field rather than a boolean isAI:
        - Three speaker classes already; UR-017's Phase B will
          add per-session channels which keep using slack:<name>.
        - Future Teams / Discord support (out of scope here)
          would use teams:<name> / discord:<name> with no schema
          change.
    acceptance_criteria:
      - "Each chat message in the pane shows a source label so the reader can distinguish facilitator, AI, and individual Slack participants"
      - "AI messages remain visually distinct from human messages (no regression from current behaviour)"
      - "Slack participants are visually distinct from the AI"
      - "The chat history serialiser used by SR-133 reads the same `source` field — there is one source-of-truth for who said what"

  SR-135:
    function: "Bind the Slack relay to a single channel via the SLACK_RELAY_CHANNEL_ID environment variable, and cleanly disable the relay when the variable is unset"
    parent: [UR-017]
    component: src/services/slackRelay.ts (VITE_SLACK_RELAY_BASE_URL) + n8n/workflows/modellogue-slack-relay.json (SLACK_RELAY_CHANNEL_ID) + Doc/architecture.md §7.4 / §8.2 (Phase A vs B note)
    status: implemented  # v7.8 (Phase A — config scaffolding; n8n workflow body lands in SR-132)
    notes: |
      Phase A — MVP scope, this SR:
        - The bridged channel id is set via environment variable
          SLACK_RELAY_CHANNEL_ID on the n8n container.
        - One channel for the whole MVP — every ModelLogue
          session bridges to the same channel
          (e.g. #modellogue-dev).
        - The Slack Bot is invited to that channel manually by
          the operator when the workspace is set up.
        - Sufficient for the MVP because the team running the
          MVP test is small and runs reviews serially; a single
          shared channel is acceptable.

      Phase B — deferred, separate UR/SR pass:
        - At session start, the facilitator picks a channel from
          a list (or pastes a channel id).
        - The Bot is invited to the chosen channel on demand
          (or the operator pre-invites a set of candidate
          channels).
        - n8n's relay state must then be keyed by
          session × channel rather than global.
        - A UI for channel selection is added to the seed-time
          flow.

      Why the two-phase split:
        - Phase A's technical risk is low (one env var, one
          workflow) and delivers UR-017's value end-to-end for
          the team running the MVP test.
        - Phase B requires session ↔ channel bookkeeping in n8n
          state and a session-start UI for selection, both of
          which deserve a separate review pass once Phase A is
          settled.

      Disable path:
        - If SLACK_RELAY_CHANNEL_ID is unset, n8n workflow #1's
          trigger never fires; ModelLogue's polling hook gets
          empty results and does not append anything. The chat
          pane behaves exactly as today (facilitator + AI only).
          Cleanly disabling the relay must NOT crash the chat
          pane.
    acceptance_criteria:
      - "A single SLACK_RELAY_CHANNEL_ID env var on the n8n side determines the bridged channel for every session in Phase A"
      - "Doc/architecture.md (or an inline note in the n8n workflow) clearly states this is Phase A and that per-session selection is deferred"
      - "Removing or unsetting SLACK_RELAY_CHANNEL_ID cleanly disables the relay — the local chat continues to work without errors"
      - "The Phase B follow-up (per-session channel selection) is captured as a documented future SR rather than left implicit"

  SR-136:
    function: "Hide the chat pane and suppress every n8n / AI relay call unless the current user is the authenticated operator"
    parent: [UR-018]
    component: src/components/MainLayout.tsx (ChatPanel mount gate) + src/services/n8nService.ts + src/services/slackRelay.ts + an AI-availability flag derived from auth state
    status: planned  # v8.0 (public beta)
    notes: |
      The frontend half of UR-018's AI gate. Today ChatPanel is
      rendered unconditionally in MainLayout (~line 143) and
      n8nService / slackRelay call their webhooks whenever
      configured. SR-136 makes the chat pane and all AI/relay
      traffic conditional on the user being the authenticated
      operator.

      Critical framing (see NFR-090):
        - The switch is the AUTHENTICATED IDENTITY, never whether
          n8n is configured or reachable. In a deployment n8n
          exists and is fixed for everyone (operator and anonymous
          visitors alike), so its presence cannot discriminate
          users. Only "am I the authenticated operator?" may drive
          the switch.
        - This frontend gate is INSURANCE, not the security
          boundary. It is bypassable (a modified client can call
          n8n anyway), so the system's safety must NOT depend on
          it. The real boundary is SR-137 (server-side). SR-136
          exists for UX (anonymous users see a clean AI-free app)
          and to avoid doomed calls.

      Anonymous experience: full review tool minus AI — display,
      tables, markers, save evidence all work; the chat pane does
      not appear.
    acceptance_criteria:
      - "When the user is not the authenticated operator, the chat pane is not rendered and zero requests are sent to the n8n chat or Slack-relay webhooks"
      - "When the user is the authenticated operator, the chat pane is shown and the AI relay works normally"
      - "The visibility switch is driven by authenticated identity, never by whether VITE_N8N_BASE_URL / the n8n endpoint is configured or reachable"
      - "Removing this gate entirely does not expose the AI to anonymous users, because SR-137 still rejects unauthenticated calls server-side"

  SR-137:
    function: "Ensure the AI relay boundary serves only requests that have passed the auth gate — the origin is reachable only through the gate (or n8n verifies the gate's signed assertion) — so an unauthenticated request never reaches a Gemini call"
    parent: [UR-018]
    component: the auth gate (managed access gate for the beta) in front of the AI route + origin network isolation and/or a verification step at the head of the n8n chat/relay workflows
    status: planned  # v8.0 (public beta)
    notes: |
      The server-side half of UR-018's AI gate, and THE security
      boundary (SR-136 is only insurance). This must hold even if
      the entire frontend is removed or a hostile client crafts
      requests directly.

      Realised as a forward-auth seam (SR-138):
        - The AI boundary trusts only requests that have passed the
          gate. It never trusts a client-asserted "I am
          authenticated" flag — that would collapse the two layers
          into the untrustworthy one.
        - Safety of the seam depends on the origin being reachable
          ONLY through the gate. Achieve this by network isolation
          (e.g. a tunnel, or allowing only the gate's IPs) or by
          having n8n verify the gate's signed assertion — otherwise
          the gate can be bypassed by hitting the origin directly.
        - Rejection happens BEFORE any Gemini call, so the API key
          is never spent on behalf of a non-operator. This is what
          protects cost.
    acceptance_criteria:
      - "A request that has not passed the auth gate cannot reach the AI route, and no Gemini API call is made for it"
      - "The origin is not directly reachable in a way that bypasses the gate (tunnel / IP allowlist / signed-assertion verification)"
      - "A bare client-set 'authenticated' flag with no gate passage is not accepted"
      - "Disabling or removing the SR-136 frontend gate does not weaken this — the AI boundary still rejects unauthenticated calls"

  SR-138:
    function: "Gate the AI boundary with a provider-agnostic forward-auth seam, realised for the beta by a managed access gate (an allowlist of the operator) with nothing to build, and keep the gate provider swappable behind the seam"
    parent: [UR-018]
    component: a managed access gate in front of the AI route (beta) + the forward-auth seam contract the AI boundary (SR-137) relies on
    status: planned  # v8.0 (public beta)
    notes: |
      The auth mechanism behind SR-137. The operator does NOT build
      or own the auth — the requirements are only safe / simple /
      changeable (NFR-090 / NFR-091).

      Decisions:
        - Simplest safe realisation NOW: a MANAGED access gate
          (e.g. Cloudflare Access) in front of the AI route, with
          an allowlist of the single operator and managed TLS.
          Nothing to build or run; login (Google / OTP / etc.) and
          enforcement are the gate's job.
        - Changeability (the reason we don't lock in): the AI
          boundary depends only on "an authenticated request
          reached the seam", NOT on the specific provider. So the
          gate can later be swapped — managed → self-hosted
          forward-auth (oauth2-proxy / Authelia) → a site's own
          OIDC / corporate SSO — without reworking n8n or the SPA.
          Self-hosting is one such change, not a launch
          requirement.
        - We do NOT build generic OIDC or a login component up
          front (unrequested speculative work). We only keep the
          seam clean so the front-piece is replaceable.
        - No secret that identifies the operator is embedded in the
          SPA build. No hand-rolled crypto — rely on the gate's
          vetted implementation. Enforcement over HTTPS.
    acceptance_criteria:
      - "The operator reaches the AI route only after passing the gate; a non-allowlisted user does not"
      - "Standing up the beta gate requires no bespoke auth code — a managed access gate plus an allowlist of one"
      - "The gate provider can be swapped (managed → self-hosted forward-auth / OIDC) without changing the seam contract the AI boundary (SR-137) relies on, and without rebuilding the SPA"
      - "No secret that identifies or authenticates the operator is embedded in the shipped SPA build"

  SR-139:
    function: "Deploy the app services as a Docker Compose stack that sits behind the auth gate, wired so the gate provider and the static-host choice can change without reworking the app"
    parent: [UR-018]
    component: docker-compose (SPA + PlantUML + n8n + nswitch) + a reverse proxy for same-origin routing + SPA runtime/relative config
    status: planned  # v8.0 (public beta)
    notes: |
      The deployment topology for UR-018. The app services
      (SPA + PlantUML + n8n + nswitch) run as a compose stack; the
      auth gate (SR-138) sits in front of the AI route. For the
      beta the gate is a managed access gate; a self-hosted gate
      MAY later occupy the same seam (NFR-091).

      Keep the deployment easy and change-friendly:
        - Route the SPA and the n8n relay under a single origin (a
          reverse proxy) so the browser's AI calls are same-origin
          — no CORS / cross-site-cookie friction, and no per-host
          rebuild.
        - The SPA reads its endpoints at runtime / as relative
          paths, NOT baked absolute URLs at build time, so the same
          image deploys to any host by changing only a small env /
          the domain (avoids the VITE_* build-time rebuild trap).
        - A static host (e.g. Vercel) MAY additionally front the
          SPA, but is not required — this is one of the swappable
          choices, not a hard dependency.
    acceptance_criteria:
      - "`docker compose up` brings up the app services (SPA served + PlantUML + n8n + nswitch)"
      - "The SPA and the n8n relay are reachable under a single origin via the reverse proxy, so AI calls are same-origin"
      - "The SPA image deploys to a different host by changing only a small env / the domain — no per-host rebuild"
      - "The auth gate provider and the static-host choice can each change without reworking the app services"

  SR-140:
    function: "Provide a Sign-in entry point in the SPA: when AI is unavailable, offer a control that navigates to the auth gate's login and returns the operator to the app once authenticated"
    parent: [UR-018]
    component: a Sign-in control in the app header (shown when aiAvailable is false) + deploy/Caddyfile (/auth/login redirect) + the auth gate (SR-138)
    status: planned  # v8.0 (public beta)
    notes: |
      SR-136 hides the chat pane when the user is not the authenticated
      operator, but by itself gives no way to BECOME authenticated from
      inside the app — the bootstrap gap the operator actually hit. SR-140
      adds the entry point.

      Flow (top-level browser navigation, NOT a background fetch):
        - When aiAvailable is false, the SPA shows a small "Sign in"
          control (in the header).
        - Activating it navigates the browser to the gate-protected path
          `/auth/login`. Because it is a navigation (not a fetch), the auth
          gate (Cloudflare Access etc., SR-138) can present its own login
          page; on success the gate sets its session and forwards the
          request to the origin.
        - The reverse proxy answers `/auth/login` with a 302 back to `/`.
          The SPA then re-probes `/auth/whoami` (SR-136), now sees the
          authenticated identity header, and shows the chat pane.

      Local / no-gate behaviour: with no gate in front (the local stack, or
      before SR-137/138 is deployed), `/auth/login` is unprotected and just
      302s to `/`; the user stays unauthenticated (fail-safe, AI off). The
      control is therefore inert until the gate is deployed — implemented
      first (doc-first), activated by deployment.

      Provider-agnostic: the SPA knows only "navigate to /auth/login"; which
      gate performs the login stays behind the SR-138 seam (NFR-091).
    acceptance_criteria:
      - "When aiAvailable is false the SPA shows a 'Sign in' control; when true it does not"
      - "Activating 'Sign in' performs a top-level browser navigation to /auth/login (not a background fetch), so the edge auth gate can present its login page"
      - "Behind the auth gate, a successful login returns the operator to the app authenticated: the chat pane appears after the redirect without a further manual step"
      - "With no gate in front, /auth/login 302-redirects to / and the user remains unauthenticated (fail-safe); the control does not error"
      - "The SPA hard-codes no gate-specific detail beyond the /auth/login path — the gate provider stays swappable (NFR-091)"

# =============================================================================
# Data Model
# =============================================================================

data_model:
  StateMachineModel:
    description: "Canonical representation of a state machine parsed from PlantUML source"
    fields:
      - name: states
        type: "State[]"
        description: "All states including initial/final pseudo-states"
      - name: transitions
        type: "Transition[]"
        description: "All transitions between states"
      - name: events
        type: "string[]"
        description: "Deduplicated list of all event names"

  State:
    fields:
      - name: id
        type: string
        description: "Unique identifier (PlantUML name or alias)"
      - name: label
        type: string
        description: "Display name (from state \"name\" as alias, or id)"
      - name: type
        type: "'normal' | 'composite' | 'initial' | 'final'"
        description: "'composite' is a state that contains child states (one level only, per ADR-009)"
      - name: parentId
        type: "string | null"
        description: "Id of the enclosing composite state, or null for top-level states"

  Transition:
    fields:
      - name: sourceStateId
        type: string
      - name: targetStateId
        type: string
      - name: event
        type: "string | null"
      - name: guard
        type: "string | null"
      - name: action
        type: "string | null"

  RequirementModel:
    description: "Canonical representation of a requirement diagram parsed from the PlantUML source (SR-110, v7.5). Mirrors StateMachineModel's role for the second supported model type (ADR-012)."
    fields:
      - name: requirements
        type: "Requirement[]"
        description: "All requirements, functional, non-functional, and design-constraint"
      - name: relations
        type: "RequirementRelation[]"
        description: "Relations between requirements (derive, refine, satisfy, verify, contain, trace, copy)"

  Requirement:
    fields:
      - name: id
        type: string
        description: "Unique identifier (the first argument of $req / $fReq / $nfReq / $dConstraint)"
      - name: statement
        type: string
        description: "The requirement statement — short form of what is required (or, for designConstraint, the constraint itself). Maps to the second macro argument (the DSL parameter keeps the SysML spelling `$name`). Used as the class header when rendered."
      - name: text
        type: "string | null"
        description: "Long-form requirement text (optional third argument). May contain newlines escaped as \\n."
      - name: type
        type: "'requirement' | 'functionalRequirement' | 'nonFunctionalRequirement' | 'designConstraint'"
        description: "Derived from which macro was used. Drives the rendered stereotype and color."
      - name: parentId
        type: "string | null"
        description: "Package or containing-requirement id, or null for top-level. Populated by `package { … }` grouping or `$contain(parent, child)` relations."
      - name: hidden
        type: boolean
        description: "Review-state flag (ADR-014). true = omit from the diagram but keep in the list and analyses. Populated by the `' @modellogue hide \"id\"` comment directive in the DSL or the `hidden` CSV column. Default false."
      - name: deleted
        type: boolean
        description: "Review-state flag (ADR-014). true = reviewer decided this requirement is out. Shown strikethrough in the list tab as evidence, omitted from the diagram. Populated by the `' @modellogue deleted \"id\" \"reason\"` comment marker paired with the following commented-out declaration, or by the `deleted` CSV column. Default false."
      - name: note
        type: string
        description: "Free-form review annotation attached to this requirement (ADR-014). When `deleted=true`, MUST be non-empty (carries the deletion reason). Otherwise optional — used for working notes like 'needs clarification'. Populated by `' @modellogue note \"id\" \"text\"`, the reason argument of the delete marker, or the `note` CSV column. Default empty string."

  RequirementRelation:
    fields:
      - name: sourceId
        type: string
        description: "First id argument to the relation macro"
      - name: targetId
        type: string
        description: "Second id argument to the relation macro"
      - name: kind
        type: "'contain' | 'derive' | 'refine' | 'satisfy' | 'verify' | 'trace' | 'copy'"
        description: "Which macro produced this relation. Determines the semantic of source/target (see src/grammars/requirementDiagram.ebnf)"

  ReviewSession:
    fields:
      - name: id
        type: string
      - name: name
        type: string
      - name: createdAt
        type: "string (ISO 8601)"
      - name: updatedAt
        type: "string (ISO 8601)"
      - name: modelTypeId
        type: "'state-machine' | 'requirement'"
        description: "The model type this session is reviewing, fixed at seed time (SR-073, v7.5). Determines which parser, analysis tabs, and AI prompt apply."
      - name: plantUmlSource
        type: string
      - name: requirementsText
        type: string
        description: "Short requirements text scoped to this model (SR-080, v7.1). Read-only during review; exported as evidence"
      - name: messages
        type: "ChatMessage[]"
      - name: sourceHistory
        type: "SourceSnapshot[]"
      - name: markers
        type: "Marker[]"
      - name: outcome
        type: "SessionOutcome | null"
        description: "Set when the review session is closed (UR-010); null while the session is open"

  SessionOutcome:
    description: "How a review session ended; downstream workflows in n8n act on this (per ADR-008)"
    fields:
      - name: status
        type: "'consensus' | 'postponed' | 'spec_issue'"
        description: "consensus: agreement reached; postponed: changes pending; spec_issue: upstream requirement problem"
      - name: closedAt
        type: "string (ISO 8601)"
      - name: note
        type: "string | null"
        description: "Free-form note explaining the outcome"

  Marker:
    description: "A review marker drawn by the user on top of the diagram"
    fields:
      - name: id
        type: string
        description: "Stable id, used by future features (e.g. AI-driven highlight)"
      - name: type
        type: "'ellipse' | 'rectangle' | 'arrow'"
      - name: color
        type: "'red' | 'blue' | 'green' | 'purple'"
      - name: geometry
        type: "EllipseGeometry | RectangleGeometry | ArrowGeometry"
        description: "Coordinates in the SVG coordinate space (so the marker stays aligned during pan/zoom)"

  EllipseGeometry:
    fields:
      - name: cx
        type: number
      - name: cy
        type: number
      - name: rx
        type: number
      - name: ry
        type: number

  RectangleGeometry:
    fields:
      - name: x
        type: number
      - name: y
        type: number
      - name: width
        type: number
      - name: height
        type: number

  ArrowGeometry:
    fields:
      - name: x1
        type: number
      - name: y1
        type: number
      - name: x2
        type: number
      - name: y2
        type: number

# =============================================================================
# External Interfaces
# =============================================================================

external_interfaces:
  plantuml_server:
    endpoint: "http://localhost:8080/svg/{encoded}"
    method: GET
    input: "PlantUML source encoded with Deflate + Base64"
    output: "SVG image (displayed directly with pan/zoom + used for coordinate extraction)"

  n8n_chat_webhook:
    endpoint: "{n8n_base_url}/webhook/modellogue-chat"
    method: POST
    input: |
      JSON body with: currentSource (PlantUML), history (prior turns),
      userMessage (new user turn), markerContext (human-readable marker +
      coordinate summary, SR-022), grammarSpec (EBNF of the supported
      PlantUML subset, SR-022), requirementsText (short requirements
      fragment scoped to this model, optional, SR-030/SR-080).
    output: |
      JSON object with: text (AI free-form reply) and optional
      suggestedSource (PlantUML extracted from a ```plantuml code block).
      Phase 1 is non-streaming; n8n returns a single response.
    note: "n8n internally calls Gemini API; API key managed on n8n side"

  session_bootstrap_bundle:
    channel: "URL query parameters (?requirements=...&source=...) and/or file import"
    schema: |
      {
        "requirementsText": "string (optional, UTF-8)",
        "plantUmlSource":   "string (optional, UTF-8)",
        "sessionName":      "string (optional)"
      }
    note: |
      Documented boundary with ADR-008's surrounding workflow. n8n or a
      CI pipeline composes this bundle (e.g. by extracting a
      requirements fragment from a larger document and generating an
      initial PlantUML source). ModelLogue consumes the bundle at
      session start per SR-083 and then locks seed editing.

  slack_relay_read:
    endpoint: "{n8n_base_url}/webhook/slack-relay?since=<ts>"
    method: GET
    input: "since: Slack message ts (decimal string) of the last message already seen by the client"
    output: |
      JSON array of relayed messages newer than `since`:
      [{ ts: string, user: string, username: string, text: string,
         source: "slack:<username>" }, ...]
    note: |
      Read direction of UR-017's Slack relay (SR-132). ModelLogue polls
      this endpoint every ~1.5 seconds while the session is in REVIEW
      phase. The endpoint is implemented by an n8n workflow whose Slack
      Trigger node feeds a ring-buffer of the last 100 messages held in
      n8n Static Data. Empty array is returned when there are no new
      messages.

  slack_relay_write:
    endpoint: "{n8n_base_url}/webhook/chat-to-slack"
    method: POST
    input: |
      JSON body: { source: "facilitator" | "ai", text: string }
    output: "204 No Content on success; 4xx on bad request; 5xx on Slack API failure"
    note: |
      Write direction of UR-017's Slack relay (SR-132). n8n's workflow
      prefixes the text with "[facilitator] " or "[AI] " and posts to
      Slack chat.postMessage on the channel configured by
      SLACK_RELAY_CHANNEL_ID (SR-135). Fire-and-forget from
      ModelLogue's perspective — relay failures log a warning but do
      not block the local chat experience.

  slack_app:
    channel: "Slack App with Bot Token (registered in n8n Credentials, never in the frontend)"
    bot_scopes:
      - "channels:history"   # read channel messages for the read-direction trigger
      - "channels:read"      # list channels for Phase B selection
      - "chat:write"         # post relayed facilitator/AI messages
      - "users:read"         # resolve user ids to display names for source labels
    note: |
      Phase A operating model: the operator creates a Slack App, adds
      the Bot to the bridged channel manually, and stores the Bot Token
      in n8n's Credentials store. Phase B (deferred, see SR-135) adds
      on-demand channel join via channels:join.

# =============================================================================
# Future Extensions (not in current scope)
# =============================================================================
#
# Implemented as auxiliary services in the same repository (per ADR-010),
# callable from both ModelLogue and CI/CD pipelines:
#
# - N-switch coverage test case generator (UR-003 follow-up)
#   - Input: PlantUML state diagram source (or StateMachineModel JSON)
#   - Output: Test case CSV
#   - Layered strategy applied to composite states (per the industry research)
#
# - Bidirectional state-table converter (UR-011)
#   - PlantUML source ↔ State transition table CSV
#   - Deterministic conversion (no LLM), strict CSV format definition
#   - See ADR-011
#
# Mermaid-rendered new model types (v7.9 onwards, ADR-018):
# - Sequence diagram (Mermaid sequenceDiagram, frontend-rendered)
# - DFD (Mermaid flowchart subset, frontend-rendered)
# - C4 model (Mermaid C4, frontend-rendered)
# All three are implemented under the ADR-012 plugin framework with
# Mermaid as the rendering engine — no Docker server is added. Existing
# 3 model types (state-machine / requirement / process) keep PlantUML
# (see ADR-018 for why neither side moves).
#
# Other extensions, not yet placed:
# - Requirements derivation tree support
# - Classification tree support (indefinitely deferred — when resumed,
#   start from factor/level tables, not the tree notation; see project
#   memory)
# - Real-time multi-user marker collaboration (shared marker store via WebSocket)
# - AI-initiated markers (AI places a marker to point at something it's discussing)
# - Teams / Discord parity for the chat relay (UR-017 covers Slack only;
#   parity would be a new n8n workflow targeting the same chat-relay contract)
# - Phase B of UR-017: per-session Slack channel selection at seed time
# - SSE / WebSocket migration for the Slack relay if 1.5s polling cadence
#   proves insufficient (currently captured in SR-132 notes)
# - GitHub auto-commit via n8n
