# =============================================================================
# UI Layout
# =============================================================================
# ┌──────────────────────────────────┬──────────────┐
# │  Diagram View                    │  Chat/Review  │
# │  (PlantUML SVG + marker overlay) │  Panel        │
# │  [Marker tools: ⬭ ▭ ⇢]           │              │
# ├── drag to resize ────────────────┤              │
# │  ▲ Analysis Panel [tabs]        │              │
# │  [Source|StateEvent|StateState|EBNF]            │
# ├──────────────────────────────────┴──────────────┤
# │  Status Bar                                      │
# └──────────────────────────────────────────────────┘

ui_layout:
  SR-070:
    function: "Render state machine diagram as primary view, with an empty-state guide"
    parent: [UR-001]
    component: DiagramView
    status: implemented
    acceptance_criteria:
      - "Diagram occupies the main screen area (center, largest)"
      - "Diagram area resizes when analysis panel resizes"
      - "Diagram area maximizes when analysis panel is collapsed"
      - "When PlantUML source is empty (no model yet), the diagram pane shows a custom EMPTY STATE message instead of fetching from PlantUML Server"
      - "Empty-state copy points the user at the two real entry paths: 'Describe what the model should do in the Requirements tab, then press Generate model — or paste a PlantUML source into the Source tab.'"
      - "Empty state must NOT show the PlantUML default welcome image, because that image suggests full PlantUML syntax is accepted (it is not — only the subset in ADR-009)"
      - "Marker drawing tools and overlay are hidden in empty state (nothing to mark on yet) — but Undo / Redo controls (SR-035) remain visible so the user can restore a previous model after undoing all the way back to empty"
      - "Auto-fit on initial render AND whenever an Apply changes the canvas size: the view opens (and re-fits) at a scale that contains the whole canvas inside the pane (capped at 1.0 so small diagrams are not blurrily enlarged) and the canvas is centered. Without the Apply-time refit, TransformWrapper's initialScale applies only at mount, so a later Apply that grows the diagram would leave the old scale in place and make the bigger canvas appear to overflow the pane. Home (⌂) on the zoom toolbar returns to the current auto-fit state"

  SR-071:
    function: "Render resizable analysis panel with tabs built dynamically from ModelTypeDefinition.analysisTabs"
    parent: [UR-002, UR-003, UR-012, UR-013, UR-014]
    component: AnalysisPanel (with ResizeHandle) + ModelTypeDefinition registry (ADR-012)
    status: implemented  # v7.5: tabs are driven by the active ModelTypeDefinition
    notes: |
      v7.1 had a fixed tab set assuming state-machine models. v7.5
      generalizes this: the tab set is the concatenation of
        common tabs (Requirements | Source) +
        type-specific tabs (from ModelTypeDefinition.analysisTabs of
        the session's active model type)
      For state-machine sessions the type-specific tabs are
      State×Event / State×State / Test cases (unchanged visually
      from v7.4). For requirement-diagram sessions they are
      Requirement list / Traceability / Orphans (v7.5).

      This dynamism is a core payoff of ADR-012: adding a third
      model type in the future never requires touching AnalysisPanel —
      only the per-type analysisTabs array.
    acceptance_criteria:
      - "Bottom pull-up panel with tab navigation (unchanged)"
      - "Common tabs always appear first in order: Requirements | Source"
      - "After the common tabs, the tabs from ModelTypeDefinition.analysisTabs of the active model type appear in the order defined there"
      - "For state-machine sessions: State×Event | State×State | Test cases (unchanged from v7.4)"
      - "For requirement sessions: Requirement list | Traceability | Orphans"
      - "Requirements tab: editable requirements text during seed, read-only once a model exists (SR-080)"
      - "Source tab: canonical source view for the active model type (PlantUML for state-machine, macro DSL for requirement-diagram), read-only during review (SR-001)"
      - "Vertically resizable via a drag handle on the top edge of the panel"
      - "Collapsible to maximize diagram area"

  SR-072:
    function: "Render chat panel with proposal view"
    parent: [UR-005, UR-006]
    component: ChatPanel (with ResizeHandle) + ProposalView
    status: implemented
    acceptance_criteria:
      - "Right side panel spanning full height"
      - "Horizontally resizable via a drag handle on the left edge of the panel"
      - "Contains message list (SR-031) and chat input field"
      - "Does NOT host the Undo control (relocated to the diagram toolbar in SR-035) — the chat panel is for dialogue, not for model-state navigation"
      - "When the AI proposes a source change, renders the ProposalView (SR-033) inside the assistant message: before/after model SVGs side-by-side with diff overlay, collapsible raw source, and an Apply button"
      - "Falls back gracefully when the proposal cannot be rendered (parse error, PlantUML Server unreachable) per SR-033 rules"

  SR-073:
    function: "Select the model type at session seed (one-way, fixed for the session lifetime)"
    parent: [UR-009, UR-014]
    component: Header (ModelTypeSelector) + SessionStore.modelTypeId + ModelTypeDefinition registry
    status: implemented  # v7.5
    notes: |
      ModelLogue hosts multiple model types via the plug-in architecture
      in ADR-012. Each session is about ONE model type; switching mid-
      session would invalidate the source, the parser, and the analysis
      tabs all at once. So the type is chosen once at seed time and
      locked for the session lifetime, analogous to how SR-001 locks
      the source after first successful parse.

      When `Open saved review…` loads a saved session, the model type
      comes from the saved bundle — no selector shown. New sessions
      default to `state-machine` for continuity with existing users.
    acceptance_criteria:
      - "At session seed (SEED phase, before first successful parse), a Model type selector appears in the header with the registered options from src/modelTypes/"
      - "The initial options are 'State machine' and 'Requirement' (v7.5 scope)"
      - "Changing the selector clears the current source, requirements text, and any in-progress chat — no mixed-type state"
      - "Once the REVIEW phase is entered, the selector becomes a read-only label showing the locked type"
      - "SessionStore.modelTypeId is part of the exported session JSON (SR-041) and is restored on Open saved review (SR-083)"

# =============================================================================
# Requirements Text & Model Seeding (new in v7.1)
# =============================================================================
# The review session now carries a short requirements text alongside the
# PlantUML source. Both are read-only references during review; both are
# seeded at session start. Heavy extraction from a larger requirements
# document stays OUTSIDE ModelLogue (ADR-008).

requirements_text:
  SR-080:
    function: "Provide a Requirements tab holding a short, read-only-during-review requirements text"
    parent: [UR-009, UR-012]
    component: RequirementsTab + RequirementsStore
    status: implemented
    acceptance_criteria:
      - "Requirements text is displayed on its own tab inside the analysis panel (SR-071)"
      - "Lock condition aligned with SR-001: editable while the session is in SEED phase, read-only once REVIEW phase is entered (first successful parse of a model)"
      - "Character-count indicator visible; soft limit 4000 characters, hard limit 8000 characters"
      - "Exceeding the hard limit prevents Generate Model (SR-082) and shows a hint to extract requirements externally (ADR-008)"
      - "The text is part of ReviewSession and is included in exported JSON (SR-041)"
      - "A history of requirements text changes is NOT maintained in v7.1/v7.2 (the text is treated as fixed once seeded); Undo/Redo do not touch it"
    rules:
      - context: "Session is in SEED phase"
        action: "User pastes or types into the Requirements tab"
        outcome: "The text is accepted as the initial requirements seed"
      - context: "Session is in REVIEW phase (a parseable model exists)"
        action: "User tries to edit the requirements text"
        outcome: "Input is ignored; a hint explains that requirements are fixed during review and re-derivation is an external step (ADR-008)"

  SR-081:
    function: "Offer the PlantUML subset grammar as a downloadable file"
    parent: [UR-008]
    component: Header or Help menu
    status: implemented
    acceptance_criteria:
      - "A visible action (link or button) lets the user download src/grammars/stateDiagram.ebnf as-is"
      - "Filename on download: modellogue-state-diagram-grammar.ebnf"
      - "No in-app rendering or syntax highlighting of the file — download only"

  SR-082:
    function: "Generate an initial model from the requirements text"
    parent: [UR-009]
    component: RequirementsTab + ChatStore
    status: implemented
    acceptance_criteria:
      - "A Generate Model button is shown on the Requirements tab"
      - "The button is ENABLED only when: requirements text is non-empty AND current PlantUML source is empty"
      - "Pressing the button sends a chat message through the normal chat pipeline (SR-030), with a fixed prefix such as 'Generate a PlantUML state diagram that satisfies the following requirements:' followed by the requirements text"
      - "The message appears in the chat log as a user turn, so that the intent is captured in the dialogue log (Dialogue as Asset)"
      - "The resulting assistant message flows through the normal suggestedSource → Apply path (SR-032, SR-034); there is no hidden side-channel"
      - "Since the initial generation runs while the session source is empty, SR-034's auto-apply kicks in — the user does not have to click Apply to adopt the very first model. Subsequent proposals (after a model already exists) follow the normal click-to-apply flow"
      - "After Apply, both the requirements text and the source become read-only for the remainder of the session"

  SR-083:
    function: "Open a previously saved review or an externally prepared starter file (file import)"
    parent: [UR-007, UR-009]
    component: SessionBootstrap
    status: implemented
    acceptance_criteria:
      - "Header action is labelled 'Open saved review…' (NOT 'Seed Import' — that label was opaque to most users)"
      - "Accept a JSON file in either of two shapes, transparently to the user:"
      - "  - SeedBundle: { requirementsText?, plantUmlSource?, sessionName? } — produced by an external workflow (n8n / CI)"
      - "  - ReviewSession: a JSON file produced by Save & finish (SR-041) — the importer extracts requirementsText, plantUmlSource, sessionName and discards chat log / source history / markers / outcome (Volatile Canvas: only the seed parts round-trip)"
      - "All seed fields are optional; any missing field is treated as an empty seed"
      - "Imported values go through the same seed path as manual paste; if the imported source parses successfully the session enters REVIEW phase immediately"
      - "If a non-empty session is being replaced, confirm first"
      - "Tooltip: 'Load a previously saved review (.json) to continue, or a starter file prepared by an external workflow.'"
    notes: |
      v7.2 widens the importer to accept the Save-and-finish output so
      reviewers have an obvious save → reload round-trip without any
      external tooling. The Volatile Canvas property is preserved by
      not rehydrating chat / markers / history — only the static seed
      fields come back.

# =============================================================================
# Model-Level Diff (new in v7.1, feeds SR-033)
# =============================================================================

model_diff:
  SR-090:
    function: "Compute a model-level diff between two StateMachineModel values"
    parent: [UR-006]
    component: modelDiff engine
    status: implemented
    acceptance_criteria:
      - "Input: (before: StateMachineModel, after: StateMachineModel)"
      - "Output: { addedStates, removedStates, changedStates, addedTransitions, removedTransitions, changedTransitions }"
      - "State match key: state id (alias or PlantUML name). A rename counts as remove+add unless the id is preserved"
      - "Transition match key: (sourceStateId, targetStateId, event) — if all three match, the transition is considered the same; differences in guard or action make it 'changed'"
      - "Pure function, no I/O, no UI knowledge — consumed by SR-033 to drive overlay highlights"
      - "Empty result when before and after are structurally identical (ignoring whitespace in source)"

# =============================================================================
# Artifact Export (per-tab Copy / Save) — new in v7.2
# =============================================================================
# The Save & finish JSON (SR-041) bundles the whole review as evidence.
# These SRs cover the OTHER export use case: lifting an individual
# artifact (final source / table / future test cases) out of the session
# so it can be used in another tool. Two surfaces per artifact:
#   - Copy: write to clipboard for a paste-into-anywhere workflow
#   - Save: download as a file with the format conventional for that
#           artifact (.puml for PlantUML, .csv for tables)

artifact_export:
  SR-100:
    function: "Export the current PlantUML source from the Source tab"
    parent: [UR-007]
    component: SourceView (Copy / Save .puml actions)
    status: implemented
    acceptance_criteria:
      - "A Copy button copies the current PlantUML source to the clipboard"
      - "A Save button downloads the source as a .puml file"
      - "Filename follows the pattern: modellogue-<sessionName-slug>-<YYYY-MM-DD-HHMM>.puml"
      - "Both actions are visible whenever a non-empty source is displayed (REVIEW phase)"
      - "Copy success is acknowledged with a transient indicator (e.g. 'Copied!' for ~1.5s)"
    notes: |
      The final source IS the model. Reviewers and downstream tools
      need it stand-alone — not buried inside a JSON evidence bundle.

  SR-101:
    function: "Export each state-transition matrix from its tab"
    parent: [UR-007]
    component: MatrixView (Copy / Save actions) + transition-table serializer
    status: implemented
    notes: |
      v7.2 implemented a human-friendly matrix CSV (hybrid indented
      layout, labels only). That format is insufficient as input to
      the N-switch test generator (tools/nswitch) — it loses initial
      / final markers, action text, id-vs-label disambiguation, and
      composite parent relations.

      v7.3 (planned): CSV save produces the **canonical
      state-transition-table CSV** defined in
      `tools/nswitch/Requirements_Specification.md` §4.2 instead.
      The same format round-trips between the GUI, the CLI tool, and
      version control. On-screen display (SR-020) keeps its hybrid
      matrix look — that's a presentation choice independent of the
      export format.

      HTML clipboard payload continues to emit the human-friendly
      matrix (Copy → paste into Excel still shows a matrix); plain-
      text clipboard and Save both emit the canonical CSV.
    acceptance_criteria:
      - "Both the State×Event tab and the State×State tab carry the same Copy / Save action set"
      - "Save produces the canonical state-transition-table CSV defined in tools/nswitch/Requirements_Specification.md §4.2 (columns: state, label, parent, type, initial, then one column per event)"
      - "Plain-text clipboard payload contains the canonical CSV (so a paste into a text editor or AI prompt is directly consumable by the test generator)"
      - "HTML clipboard payload remains the hybrid-indented matrix <table> so spreadsheets / Word still see a visually familiar matrix on paste"
      - "Filename pattern: modellogue-<sessionName-slug>-transitions-<YYYY-MM-DD-HHMM>.csv"
      - "Both actions are disabled while the matrix is empty (no model)"

  SR-102:
    function: "Export generated test cases and coverage report from the Test cases tab"
    parent: [UR-013]
    component: TestCasesView (Copy / Save actions + view toggle) + test-case and coverage serializers
    status: implemented
    notes: |
      Mirrors SR-101's Copy / Save pattern for two artifacts: the test-case
      list (§6.1) and the coverage report (§6.2) defined in
      `tools/nswitch/Requirements_Specification.md`. A `View: Tests | Coverage`
      toggle in the tab toolbar switches both the on-screen table and the
      Copy / Save target, analogous to the CLI's `--coverage` flag.

      The canonical CSV formats are fixed so that files produced from the
      GUI match `modellogue-nswitch` CLI output byte-for-byte (ADR-011).
      HTML clipboard payload is an equivalent `<table>` so pasting into
      Excel / Sheets / Word yields a formatted table — same split the
      matrix export uses (SR-101 v7.3).
    acceptance_criteria:
      - "The Test cases tab toolbar carries a View toggle with options 'Tests' and 'Coverage'"
      - "The toggle switches both the on-screen table and the Copy / Save target"
      - "Tests view: Save produces the test-case CSV of tools/nswitch/Requirements_Specification.md §6.1 (columns: test_id, layer, length, start, sequence, end, covers)"
      - "Coverage view: Save produces the coverage CSV of tools/nswitch/Requirements_Specification.md §6.2 (columns: kind, layer, element, then one column per test_id, status, reason)"
      - "Plain-text clipboard payload contains the same CSV so a paste into a text editor or CI config is directly consumable"
      - "HTML clipboard payload is an equivalent <table> so Excel / Sheets / Word paste shows a formatted table"
      - "Filename patterns: modellogue-<sessionName-slug>-testcases-n<N>-<YYYY-MM-DD-HHMM>.csv and modellogue-<sessionName-slug>-coverage-n<N>-<YYYY-MM-DD-HHMM>.csv"
      - "Both actions are disabled while no tests have been generated (loading, idle, or error with no cached result)"

  SR-103:
    function: "Display Tests (verification patterns, default) and Scenarios (executable walks, secondary) in a dedicated Analysis-panel tab, updated reactively from the current model"
    parent: [UR-013]
    component: TestCasesView + nswitch HTTP client (src/services/nswitchService.ts) + testCasesStore
    status: planned
    notes: |
      v7.4 lands this end-to-end: an independent auxiliary service
      (tools/nswitch/, ADR-010) exposes an HTTP API via its `serve`
      subcommand (spec: tools/nswitch/Requirements_Specification.md §9.2),
      and the GUI adds a Test cases tab that calls that service whenever
      the PlantUML source parses cleanly. Failure modes (service down,
      parse error, uncovered-within-cap warnings) are surfaced in-place
      inside the tab rather than blocking the rest of the UI.

      Trigger policy mirrors SR-010's SVG-fetch policy: debounce on source
      change (same debounce key as the SVG fetch), skip the call while the
      source is empty or has parse errors, and cache the last good
      response while a new one is in flight so the tab is never blank
      mid-keystroke.

      v8.x reframe (Tests / Scenarios — nswitch §1.1): the tab shows Tests
      FIRST — the coverage PATTERNS to verify: positive N-switch chains at
      0S/1S/2S and negative invalid transitions (INV). Each Test has an id
      `<scope>-<type>-NNN` where scope = the ModelLogue session name (passed
      to the service) or `untitled` when the session is unnamed. The
      one-stroke paths that used to be the primary "test case" list are
      demoted to Scenarios (a secondary Tests/Scenarios toggle): executable
      initial→final walks that cover several positive Tests; negatives never
      appear in a Scenario. The coverage-mode selector picks the Test set:
      0-switch / 1-switch / 2-switch (positive) or Invalid (negative Tests
      ONLY — positive 0S is never mixed in). The empty state-table cells the
      State×Event matrix shows as `-` (SR-020) are exactly the INV Tests.
      nswitch's positive algorithm is unchanged; this is a
      presentation + selection reframe.
    acceptance_criteria:
      - "A 'Test cases' tab appears after State×State and shows Tests by default in a machine-friendly COLUMNAR table: `seq`, `id` (`<scope>-<type>-NNN`), then `start` and each `(event, reached)` step in its own columns (English headers; the last reached state is not specially named). INV Tests use a fixed shape (`seq`, `id`, `start`, `event`, `expect`=`no-transition`)"
      - "A coverage-mode selector picks the Test set in place: `0-switch` / `1-switch` / `2-switch` (positive; default `1-switch`) and `Invalid`; `Invalid` shows negative Tests ONLY — positive 0-switch is never mixed in"
      - "A Tests / Scenarios toggle switches to the secondary Scenarios view: the one-stroke initial→final walks, each listing the Test ids it covers; negatives never appear as or within a Scenario"
      - "ModelLogue passes the session name to the service so ids read as `<session>-<type>-NNN`; an unnamed session yields `untitled-...`"
      - "Negative Tests are visually distinct from positive (badge / colour), so a forbidden-transition test is not mistaken for a coverage pattern"
      - "The tab prominently shows the current count (number of Tests in the Tests view, number of Scenarios in the Scenarios view) — the count is not inferable from ids since they reset per (scope, type)"
      - "The list updates reactively after a successful parse (same debounce as SVG fetch) without requiring a manual refresh"
      - "When tools/nswitch/ responds with `uncovered` entries, a warning banner lists them above the table"
      - "When the nswitch service is unreachable, the tab shows a connection-error hint with the probed URL; the rest of the UI keeps working"
      - "When the current source has parse errors, the tab shows a parse-error hint with line numbers from the service response; the previous good result stays visible, greyed"

# =============================================================================
# Requirement Diagram Support (new in v7.5)
# =============================================================================
# The second supported model type. Parallels the state-machine functions
# in the earlier sections, registered as a ModelTypeDefinition under
# src/modelTypes/requirement/ per ADR-012. Subset grammar lives in
# src/grammars/requirementDiagram.ebnf.

requirement_diagram:
  SR-110:
    function: "Parse requirement-diagram input (macro DSL form and semi-structured seed form) into RequirementModel"
    parent: [UR-014]
    component: src/modelTypes/requirement/parser.ts
    status: implemented  # v7.5
    notes: |
      Accepts two coexisting input forms defined in
      `src/grammars/requirementDiagram.ebnf` v2.0:

      1. Macro DSL form (canonical, PlantUML-renderable):
         - Requirements: $req / $fReq / $nfReq / $dConstraint
         - Relations:    $contain / $derive / $refine / $satisfy /
                         $verify / $trace / $copy
         - Grouping:     `package "…" <<Frame>> { … }`
         These macros are defined by the `!procedure` preamble the
         user's source carries. No ModelLogue-invented macros.

      2. Seed form (friendly paste into the Requirements tab):
         - `id, statement[, type[, text[, hidden[, deleted[, note]]]]]`
           requirement rows (columns 5-7 match SR-113's CSV for
           round-trip with Save .csv)
         - `source_id --> target_id[: kind]` relation arrows
           (default kind = derive; kinds limited to derive / contain /
           refine / copy to stay within ADR-013 scope)

      Review-state is expressed in PlantUML comment directives
      (ADR-014, 2026-04-23 redesign), not macros:
         ' @modellogue hide "id"
         ' @modellogue deleted "id" "reason"
         ' @modellogue note "id" "text"
      Delete blocks also carry the commented-out declaration and
      tagged suppressed relations so the source renders correctly
      without going through ModelLogue:
         ' @modellogue deleted "R2" "out of scope"
         ' $fReq("R2", "old")
         ' $derive("R1", "R2") ' @modellogue deleted-side "R2"

      Both forms may be mixed in one file. The `!procedure` preamble,
      `hide …`, `title …`, and similar decorative directives are
      tolerated and ignored.

      Determinism: all forms convert deterministically to a single
      RequirementModel. No AI call is needed to seed. When the user's
      input doesn't match either form (e.g. pure natural language),
      SR-082 (AI generation) handles it via a requirement-type
      prompt.

      Validation (ADR-014): `deleted=Y` rows in seed form require a
      non-empty note; `' @modellogue deleted` directives require a
      non-empty reason. Empty reason is a parse error.
    acceptance_criteria:
      - "Accepts every construct listed in src/grammars/requirementDiagram.ebnf v2.0"
      - "Produces RequirementModel { requirements, relations } with id / statement / type / text / parentId / hidden / deleted / note / relation.kind per the data model section"
      - "Default type when the seed form omits the type column is `functional`"
      - "Default relation kind when a seed-form arrow has no `: kind` suffix is `derive`"
      - "Recognizes `' @modellogue hide / deleted / note` comment directives and applies them to the named requirement; unknown id is a parse error"
      - "A delete marker (`' @modellogue deleted ...`) is paired with the next commented-out requirement declaration to populate the deleted requirement's id / statement / type / text / note"
      - "Rejects `deleted=Y` rows in seed form with empty note; rejects `' @modellogue deleted` directives with empty reason (ADR-014)"
      - "Rejects unknown seed-form relation kinds (e.g. `satisfy`) with a clear message pointing at the macro form — seed form stays within ADR-013's requirement-to-requirement scope"
      - "Reports a clear line-numbered error for any construct outside the EBNF"
      - "Parse completes within the NFR-001 Parse < 100 ms budget for review-scale diagrams (~50 requirements)"

  SR-111:
    function: "Generate traceability matrix (requirement × requirement, cells marking relation kind)"
    parent: [UR-014]
