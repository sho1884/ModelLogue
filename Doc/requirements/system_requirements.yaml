# ModelLogue System Requirements
# Format: Verb + Object (Value Engineering - Miles function analysis)
# Subject is always the artifact (component/system), omitted by convention.
# Rule scenarios: Context → Action → Outcome (not Gherkin)

version: "7.2"
last_updated: "2026-04-15"

