services:
  plantuml:
    image: plantuml/plantuml-server:jetty
    ports:
      - "8080:8080"

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Tokyo}
      - TZ=${TIMEZONE:-Asia/Tokyo}
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n

  # N-switch coverage test case generator HTTP API (SR-103 / ADR-010).
  # Spec: tools/nswitch/Requirements_Specification.md §9.2.
  nswitch-api:
    image: python:3.12-slim
    working_dir: /app
    command:
      - python
      - -m
      - modellogue_nswitch
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8090"
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    ports:
      - "8090:8090"
    volumes:
      - ./tools/nswitch:/app:ro
    restart: unless-stopped

volumes:
  n8n_data:
