# SR-139: self-contained, same-origin production stack.
#
# A single Caddy front (the `web` service) serves the built SPA and
# reverse-proxies the API prefixes (/plantuml, /nswitch, /n8n/webhook) to the
# backend containers. Only `web` publishes a port; the backends are reachable
# only over the internal compose network. In production the auth gate
# (Cloudflare Access + Tunnel, SR-137/138) sits in front of `web`, and the
# n8n editor is not web-exposed.
#
# Run:  docker compose -p modellogue-prod -f docker-compose.prod.yml up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - plantuml
      - n8n
      - nswitch-api
      - auth-verify
    restart: unless-stopped

  plantuml:
    image: plantuml/plantuml-server:jetty
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Tokyo}
      - TZ=${TIMEZONE:-Asia/Tokyo}
      # n8n runs at the container root; Caddy strips the /n8n prefix before
      # proxying. WEBHOOK_URL only affects the URLs n8n displays, not routing.
      - WEBHOOK_URL=${PUBLIC_BASE_URL:-http://localhost:8088}/n8n/
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  nswitch-api:
    image: python:3.12-slim
    working_dir: /app
    command:
      - python
      - -m
      - modellogue_nswitch
      - serve
      - --host
      - "0.0.0.0"
      - --port
      - "8090"
    environment:
      - PYTHONPATH=/app/src
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tools/nswitch:/app:ro
    restart: unless-stopped

  # SR-137: server-side AI gate. Caddy forward_auth's /n8n/webhook/* through
  # this zero-dependency verifier before proxying to n8n. Fail-closed: with no
  # Cloudflare env it DENIES all AI calls; a local run opts out explicitly.
  auth-verify:
    image: node:20-slim
    working_dir: /app
    command: ["node", "src/index.js"]
    environment:
      - AUTHGATE_PORT=8092
      # Production: set these to your Cloudflare Access team name + the AI
      # application's AUD tag (see Doc/Deploy_Runbook.md).
      - CF_TEAM_DOMAIN=${CF_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      # Local only: with no CF vars the gate fails closed. Set to 1 to run the
      # stack locally without an edge gate. MUST be 0/unset in production.
      - AUTHGATE_ALLOW_INSECURE=${AUTHGATE_ALLOW_INSECURE:-0}
    volumes:
      - ./tools/authgate:/app:ro
    restart: unless-stopped

volumes:
  n8n_data:
