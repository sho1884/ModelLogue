<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModelLogue — モデルレビュー支援ツール</title>
    <meta
      name="description"
      content="ModelLogue は、状態遷移図・要求図・プロセス図などのモデルを、人と AI の対話でレビューするツールです。オープンソース（MIT）・セルフホスト可能。"
    />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <meta name="theme-color" content="#22ce86" />
    <style>
      :root {
        --green: #12a76a;
        --green-bright: #22ce86;
        --ink: #16261f;
        --muted: #5b6b64;
        --line: #e3eee9;
        --bg: #f6faf8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e9f3ee; --muted: #9fb3aa; --line: #24352d; --bg: #0d1512;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.7; display: grid; place-items: center; padding: 24px;
      }
      main { max-width: 560px; width: 100%; text-align: center; }
      .logo { width: 76px; height: 76px; margin: 0 auto 18px; display: block; }
      h1 { font-size: clamp(28px, 6vw, 40px); margin: 0 0 6px; letter-spacing: -0.02em; }
      .tag { color: var(--muted); font-size: 17px; margin: 0 0 30px; }
      .cta {
        display: inline-block; background: linear-gradient(150deg, var(--green-bright), var(--green));
        color: #fff; text-decoration: none; font-weight: 600; font-size: 17px;
        padding: 13px 30px; border-radius: 12px; box-shadow: 0 8px 20px -10px rgba(18,167,106,0.7);
      }
      .cta:hover { filter: brightness(1.05); }
      .links { margin-top: 26px; font-size: 15px; }
      .links a { color: var(--green); text-decoration: none; }
      .links a:hover { text-decoration: underline; }
      .note {
        margin-top: 34px; font-size: 13px; color: var(--muted);
        border-top: 1px solid var(--line); padding-top: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 100 100" fill="none" aria-hidden="true"
           stroke-linecap="round" stroke-linejoin="round">
        <g fill="#12a76a" stroke="#12a76a">
          <circle cx="15" cy="18" r="5" />
          <line x1="18.5" y1="21.5" x2="26" y2="29" stroke-width="4.5" />
          <path d="M30 33 L23 30.5 L28.5 25 Z" />
          <rect x="26" y="26" width="32" height="18" rx="6" />
          <path d="M58 30 C77 26 77 44 58 40" fill="none" stroke-width="4.5" />
          <path d="M56.5 40 L63 36 L63 44 Z" />
          <rect x="46" y="58" width="32" height="18" rx="6" />
          <line x1="38" y1="44" x2="49" y2="58" stroke-width="4.5" />
          <path d="M52 61.5 L43.5 60 L50.5 54.5 Z" />
          <line x1="66" y1="58" x2="55" y2="44" stroke-width="4.5" />
          <path d="M52 41 L60.5 42.5 L53.5 48 Z" />
          <line x1="70" y1="76" x2="78" y2="82" stroke-width="4.5" />
          <path d="M82 85 L74.5 83 L79.5 77.5 Z" />
          <circle cx="86" cy="86" r="7.5" fill="none" stroke-width="3" />
          <circle cx="86" cy="86" r="3.4" />
        </g>
      </svg>
      <h1>ModelLogue</h1>
      <p class="tag">
        状態遷移図・要求図・プロセス図などのモデルを、<br />
        人と AI の対話でレビューするツール
      </p>
      <a class="cta" href="/app">アプリを開く →</a>
      <p class="links">
        <a href="https://sho1884.github.io/public-files/ModelLogue/">ユーザーマニュアル</a>
      </p>
      <p class="note">正式な紹介ページは準備中です。</p>
    </main>
  </body>
</html>
